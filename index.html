<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Expenses</title>
<meta name="description" content="Track daily spending by category, monthly budgets, salary and savings.">
<meta name="theme-color" content="#0A0A0C">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://api.frankfurter.dev https://api.frankfurter.app https://open.er-api.com; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'; worker-src 'self'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Inter+Tight:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,300;9..144,500&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@400;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  color-scheme: light;
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eff2f6; --border:#e3e7ed;
  --text:#0e1726; --text-2:#475467; --muted:#8a94a6; --card-border:transparent;
  --hero-1:#2a78d6; --hero-2:#1a4fa0;
  --accent:#2a78d6; --accent-ink:#ffffff;
  --series-1:#2a78d6; --series-3:#1baf7a;
  --g1:#2a78d6; --g2:#eb6834; --g3:#4a3aa7; --g4:#eda100; --g5:#e87ba4; --g6:#008300; --g7:#e34948; --g8:#8e3b8e; --g9:#7a8a00;
  --good:#008300; --warn:#b77a00; --bad:#d03b3b;
  --good-bg:#e3f3e3; --warn-bg:#fbf0d6; --bad-bg:#fbe3e3;
  --grid:#e6e4de;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d0f13; --surface:#171a20; --surface-2:#22262e; --border:#2c313a;
    --text:#f5f7fa; --text-2:#b8c0cc; --muted:#8792a2; --card-border:#262a32;
    --hero-1:#2a6fc4; --hero-2:#17407f;
    --accent:#3987e5; --accent-ink:#ffffff;
    --series-1:#3987e5; --series-3:#199e70;
    --g1:#3987e5; --g2:#d95926; --g3:#9085e9; --g4:#c98500; --g5:#d55181; --g6:#008300; --g7:#e66767; --g8:#b565b5; --g9:#8f9f1a;
    --good:#4fb84f; --warn:#e0a526; --bad:#ef6b6b;
    --good-bg:#1d3320; --warn-bg:#3a2f14; --bad-bg:#3d1f1f;
    --grid:#2c2c29;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0f13; --surface:#171a20; --surface-2:#22262e; --border:#2c313a;
  --text:#f5f7fa; --text-2:#b8c0cc; --muted:#8792a2; --card-border:#262a32;
  --hero-1:#2a6fc4; --hero-2:#17407f;
  --accent:#3987e5; --accent-ink:#ffffff;
  --series-1:#3987e5; --series-3:#199e70;
  --g1:#3987e5; --g2:#d95926; --g3:#9085e9; --g4:#c98500; --g5:#d55181; --g6:#008300; --g7:#e66767; --g8:#b565b5; --g9:#8f9f1a;
  --good:#4fb84f; --warn:#e0a526; --bad:#ef6b6b;
  --good-bg:#1d3320; --warn-bg:#3a2f14; --bad-bg:#3d1f1f;
  --grid:#2c2c29;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font-size:17px;margin:0;font-weight:650}
.profbtn{display:flex;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;padding:4px 8px 4px 4px;border-radius:20px;font-weight:650;font-size:15px;color:var(--text);min-width:0;max-width:40vw}
.profbtn:hover{background:var(--surface-2)}
.profbtn .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--surface-2);border:1px solid var(--accent);font-family:var(--font-display);font-weight:var(--dw);font-size:15px;flex:none}
.av.lg{width:40px;height:40px;font-size:21px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--border);cursor:pointer;border-radius:8px}
.prow:first-child{border-top:0}
.prow:hover{background:var(--surface-2)}
.prow .grow{flex:1;min-width:0}
.prow .grow b{display:block}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin:14px 0}
.pinpad button{height:56px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:22px;font-weight:600;cursor:pointer}
.pinpad button:active{background:var(--surface-2)}
.pindots{display:flex;gap:12px;justify-content:center;margin:10px 0}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--text-2)}
.pindots i.on{background:var(--text)}
.lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.lock .box{width:100%;max-width:340px;text-align:center}
body.locked main,body.locked nav.tabs,body.locked .fab,body.locked .fabcalc,body.locked .fabset,body.locked .monthnav,body.locked #syncBtn{visibility:hidden}
body.locked::after{content:"Locked. Tap the name at the top to unlock or switch profile.";position:fixed;left:16px;right:16px;top:40%;text-align:center;color:var(--text-2)}
.monthnav{display:flex;align-items:center;gap:2px}
.monthnav button{border:0;background:transparent;width:34px;height:34px;border-radius:8px;font-size:20px;cursor:pointer;color:var(--text-2)}
.monthnav button:hover{background:var(--surface-2)}
.monthnav .mlabel{width:auto;min-width:104px;padding:0 10px;font-size:15px;font-weight:650;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.monthnav .mlabel svg{width:15px;height:15px;color:var(--accent)}
.sheet .monthnav .mlabel{cursor:default}
main{max-width:760px;margin:0 auto;padding:12px 16px 84px}
.card{background:var(--surface);border:1px solid var(--card-border);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 12px;color:var(--text);font-weight:700;letter-spacing:-.01em}
.card h2 .lnk,.sechead .lnk{float:right;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;background:none;border:0;padding:0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface-2);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--text-2)}
.kpi .v{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.cat{padding:10px 0;border-top:1px solid var(--border)}
.cat:first-of-type{border-top:0}
.cat .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px;flex:none}
.cat .nm{font-weight:600}
.cat .meta{font-size:12px;color:var(--text-2)}
.cat .amt{margin-left:auto;text-align:right;white-space:nowrap}
.cat .amt b{font-weight:650}
.bar{height:6px;border-radius:4px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--good)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.subgrp{margin:10px 0 0 44px;display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--text-2);flex-wrap:wrap}
.subs{margin:6px 0 0 44px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:560px){.subs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sub{background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:12px}
.sub b{display:block;font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;border-radius:10px;font-size:11px;color:var(--text-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;max-width:120px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.on svg{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:12px;padding:3px 12px;width:46px;height:28px;box-sizing:border-box;margin-top:-3px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 20px -4px color-mix(in srgb,var(--accent) 55%,transparent)}
@media (min-width:800px){.fab{right:calc(50% - 370px)}.fabcalc{right:calc(50% - 300px)}}
.fabcalc{position:fixed;right:88px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:31;width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.calcpad{margin:6px 0 12px;padding:0 2px}
.calcpad .expr{font-size:32px;font-weight:400;color:var(--text);text-align:right;min-height:44px;word-break:break-all;line-height:1.25;padding:14px 8px 0}
.calcpad .res{font-size:20px;font-weight:400;color:var(--muted);text-align:right;margin:2px 0 14px;min-height:28px;padding:0 8px}
.calcpad .keys{display:grid;grid-template-columns:repeat(4,64px);gap:10px 14px;justify-content:center}
.calcpad .keys button{width:64px;height:64px;border-radius:50%;border:0;background:var(--surface-2);color:var(--text);font-size:24px;font-weight:400;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0}
.calcpad .keys button:active{filter:brightness(.85)}
.calcpad .keys .op{background:color-mix(in srgb,var(--text) 10%,var(--surface-2));font-size:28px}
.calcpad .keys .eq{background:var(--accent);color:var(--accent-ink,#fff);font-size:28px}
.calcpad .keys .c{color:var(--bad,#E0533D)}
.btn{border:1px solid var(--border);background:var(--surface);padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:block;font-size:12px;color:var(--text-2);margin:10px 0 4px;font-weight:600}
input.in,select.in,textarea.in{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--surface);outline:none}
input.in:focus,select.in:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);padding:7px 10px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 10px}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 6px;font-size:18px}
.bigamt{font-size:26px;font-weight:650;text-align:right}
.day{margin-bottom:12px}
.day .dh{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);font-weight:600;padding:0 4px 6px}
.eye{border:0;background:var(--surface-2);color:var(--text-2);border-radius:10px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.eye svg{width:20px;height:20px}
.ent{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--border);cursor:pointer}
.ent:first-child{border-top:0}
.ent:hover{background:var(--surface-2)}
.ent .ic{font-size:18px;width:26px;text-align:center}
.ent .t{flex:1;min-width:0}
.ent .t div:last-child{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--text-2);font-weight:600;font-size:12px}
.tablewrap{overflow-x:auto}
.hbar{display:grid;grid-template-columns:118px 1fr auto;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.hbar .track{height:14px;position:relative}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.hbar:hover .track i{filter:brightness(1.1)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin-bottom:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-size:11px}
.msum{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.msum svg{width:170px;height:170px;flex:none;margin:0 auto}
.msum svg .c1{fill:var(--text);font-size:16px;font-weight:700}
.msum svg .c2{fill:var(--muted);font-size:11px}
.plist{flex:1;min-width:200px;display:grid;gap:6px}
.plist div{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;font-size:13px}
.plist i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.plist .num{text-align:right}.plist .pc{color:var(--muted);min-width:34px;text-align:right}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;opacity:0;transition:opacity .1s;max-width:220px}
#tip.on{opacity:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
.syncdot.ok{background:var(--good)} .syncdot.need{background:var(--warn)}
#syncBtn.busy .syncdot{background:var(--accent);animation:sdp .7s ease-in-out infinite alternate}
@keyframes sdp{from{transform:scale(.6);opacity:.5}to{transform:scale(1.25);opacity:1}}
.insight{padding:8px 0;border-top:1px solid var(--border);font-size:14px}
.insight:first-of-type{border-top:0}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1/1.05;border-radius:8px;background:var(--surface-2);padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:2px solid transparent;min-width:0;overflow:hidden;color:var(--text)}
.cal .d:hover{border-color:var(--border)}
.cal .d.today{border-color:var(--text-2)}
.cal .d.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal .d.future{opacity:.45}
.cal .dn{font-size:11px;font-weight:600;opacity:.8}
.cal .da{font-size:12px;font-weight:650;text-align:right;white-space:nowrap}
@media (min-width:560px){.cal{gap:6px}.cal .d{aspect-ratio:1.25/1;padding:6px 8px}.cal .dn{font-size:12px}.cal .da{font-size:14px}}
.calleg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-2);margin-top:10px}
.calleg i{display:block;width:90px;height:8px;border-radius:4px}
.brow{display:grid;grid-template-columns:34px minmax(0,1fr) 116px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.brow .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px}
.brow .ic.sm{width:28px;height:28px;font-size:15px;justify-self:end}
.brow .nm{font-weight:600}
.brow .meta{font-size:12px;color:var(--text-2)}
.brow .bin{text-align:right}
.brow .bin[readonly]{background:var(--surface-2);color:var(--text-2)}
.frow{display:grid;grid-template-columns:34px minmax(0,1fr) 116px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.frow .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px}
.frow .nm{font-weight:600}
.frow label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-top:4px;cursor:pointer}
.frow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.share{height:4px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.share i{display:block;height:100%;background:var(--series-1);border-radius:3px}
.bparts{margin-left:20px;padding-left:12px;border-left:2px solid var(--border);margin-bottom:6px}
.brow.part{border-top:1px dashed var(--border);padding:8px 0;grid-template-columns:28px minmax(0,1fr) 116px}
.hidden{display:none!important}
.stl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;font-size:14px}
.stl.sub{padding:2px 0 2px 14px;font-size:12.5px;color:var(--text-2)}
.stl.tot{border-top:1.5px solid var(--text);margin-top:6px;padding-top:9px;font-weight:800;font-size:15px}
.stl.muted{color:var(--text-2)}

function funds(){

  for(const e of Object.values(DB.entries)){ if(e.del) continue; if(e.pay) used.add(e.pay); if(e.from) used.add(e.from); if(e.to) used.add(e.to); }

const MONEY_IN = new Set(['refund','repaid','borrowed']);
const PAYKEY='dailyExpenseTracker.lastPay';

/* Does an entry change an account's balance on top of the balance you typed in?
   Entries dated BEFORE the day you typed it are already inside it (even if you record them later);
   entries dated that day count if added after you typed it; later dates always count. */
function afterAnchor(e, at){ if(!at) return true; const ad=dstr(new Date(at)); return e.date>ad || (e.date===ad && (e.cr||e.upd||0)>at); }
function entryEffect(e, id){ if(!e || e.del) return 0; let d=0;
  if(e.cat==='xfer'){ if(e.to===id) d+=e.amt; if(e.from===id) d-=e.amt; }
  else if(e.pay===id) d = MONEY_IN.has(e.cat)? e.amt : -(e.amt + (e.emi? emiFee(e) : 0));
  return r2(d); }

    if(d) out.push({e, d, after:afterAnchor(e,at)}); }

function setMonthFlag(ym, obj){

/* Money in and out of your accounts in a month (transfers between your own accounts don't count) */
function flows(ym, lite){

  const salary=st.salary, refunds=st.refund, repaid=D.repaid, borrowed=r2(D.borrowed), paidBack=r2(D.payback), lentOut=r2(D.lent), spending=r2(st.gross);
  return {st, salary, refunds, repaid, borrowed, paidBack, lentOut, spending, net:r2(salary+refunds+repaid+borrowed-spending-paidBack-lentOut)};

/* Opening balance of a month: stored, or carried from last month's closing. The first time, it is worked out from today's balances. */

function statementData(ym){
  const fl=flows(ym), op=openingOf(ym), cur=ym===curYM();

  const actual = cur? actualTotal() : null;

}

    ln('− Spending', '('+sgd(d.spending)+')')+ groups.map(g=>ln(g.icon+' '+g.name, sgd(g.v),'sub')).join('')+

/* One-time tidy-up: remove empty duplicate or junk accounts (S$0 and never used) */
function cleanupFunds(){
  const own=DB.settings.funds||[]; if(!own.length) return;
  const used=new Set(); for(const e of Object.values(DB.entries)){ if(e.del) continue; if(e.pay) used.add(e.pay); if(e.from) used.add(e.from); if(e.to) used.add(e.to); }
  const empty=f=>!(+f.amt) && !used.has(f.id);
  const seen={}; let ch=false;
  const list=own.map(f=>{ if(f.hidden) return f; const k=fkey(f.name);
    const junk = empty(f) && (/^\d+$/.test(String(f.name).trim()) || k==='lastmonthsavings' || (k==='ezlink' && f.id!=='ezlink'));
    if(junk){ ch=true; return {...f,hidden:true}; } return f; });
  if(ch){ DB.settings.funds=list; DB.settings.upd=Date.now(); }

function cleanFundsIn(noSave){
  const ok=new Set(funds().filter(isEF).map(f=>f.id)); let ch=false;
  for(const [ym,m] of Object.entries(DB.months)){ if(!m || !Array.isArray(m.fundsIn)) continue;
    const keep=m.fundsIn.filter(id=>ok.has(id)); if(keep.length!==m.fundsIn.length){ DB.months[ym]={...m, fundsIn:keep, upd:Date.now()}; ch=true; } }
  if(ch && !noSave) save(); return ch;
}

/* ============ Calculations ============ */
function monthEntries(ym){ const out=[];
  for(const e of Object.values(DB.entries)){ if(e.del || (CAT[e.cat]?.track && e.cat!=='borrowed')) continue;
    if(isEmi(e)){ if(e.date.startsWith(ym)) out.push({...e, amt:0, emiOrig:e.amt}); for(const p of emiPlan(e)) if(p.ym===ym) out.push({...e, id:e.id+'#'+p.key, src:e.id, date:p.date, amt:p.amt, inst:{k:p.k,n:p.n,early:!!(p.early && p.date<p.orig)}, emi:null}); }
    else if(e.date.startsWith(ym)) out.push(e); }
  return out; }   // borrowed money is only a reminder, never spending
function stats(ym, lite){
  const es = monthEntries(ym);
  const by = {}; CATS.forEach(c=>by[c.id]=0);
  const sub = Object.fromEntries(CAT.food.subs.map(s=>[s.id,0]));
  const daily = {}; const dailyLiving = {};
  let inrHome = 0;
  const debt = {borrowed:0, borrowCash:0, borrowFor:0, payback:0, lent:0, repaid:0};
  for(const e0 of es){
    let e=e0;
    if(e.cat==='borrowed'){ debt.borrowed+=e.amt; if(spendFor(e)){ debt.borrowFor+=e.amt; e={...e, cat:e.for}; } else { debt.borrowCash+=e.amt; by.borrowed=(by.borrowed||0)+e.amt; continue; } }
    if(e.cat==='payback'||e.cat==='lent'||e.cat==='repaid'){ debt[e.cat]+=e.amt; by[e.cat]=(by[e.cat]||0)+e.amt; continue; }   // friends: debt, never spending
    by[e.cat] = (by[e.cat]||0) + e.amt;
    if(e.cat==='food' && e.sub) sub[e.sub]=(sub[e.sub]||0)+e.amt;
    if(e.cat==='home' && (e.homeCur||'INR')===homeCode()) inrHome += e.inr||0;
    const sign = CAT[e.cat]?.income ? -1 : 1;
    if(e.cat==='refund') continue;   // refunds don't reduce any day's spending (still taken off the month total)
    daily[e.date]=(daily[e.date]||0)+sign*e.amt;
    if(!LIVING_EXCL.has(e.cat)) dailyLiving[e.date]=(dailyLiving[e.date]||0)+sign*e.amt;
  }
  const refund = by.refund||0;
  const refundFor = {};
  const net = {...by}; delete net.refund; delete net.repaid; delete net.borrowed;
  net.lent = 0; net.payback = 0;   // money lent / paid back to friends is debt (Analysis → Debt), not spending
  const gross = SPEND_CATS.reduce((s,c)=>s+(by[c.id]||0),0);
  const total = gross - refund;
  const living = total - [...LIVING_EXCL].filter(k=>!CAT[k]?.friend).reduce((s,k)=>s+(CAT[k]?.income ? -(by[k]||0) : (by[k]||0)),0);
  debt.cash = r2(debt.borrowed + debt.repaid - debt.payback - debt.lent);   // friends' money in − out this month (a friend paying for you counts in, and its spend counts out)
  const c = cfg(ym);
  const days = daysElapsed(ym);
  const budgetTotal = EXP_CATS.reduce((s,k)=>s+(+c.budgets[k.id]||0),0);
  let budgetLeft = 0;
  EXP_CATS.forEach(k=>{ const b=+c.budgets[k.id]||0; if(b>0) budgetLeft += b - net[k.id]; });
  const dailyFood = DAILY_FOOD.reduce((a,k)=>a+sub[k],0);
  const X = lite? 0 : fundsIncluded(ym);
  return {es, by, net, sub, debt, dailyFood, refund, refundFor, gross, total, living, inrHome, daily, dailyLiving, cfg:c, salary:+c.salary||0,
          days, left:daysLeft(ym), dim:dim(ym), budgetTotal, budgetLeft,
          extra:X, income:(+c.salary||0)+X,
          moneyLeft:(+c.salary||0) + X - total,   // for checking budget accounts (includes savings carried in / put aside)
          moneyInM: r2((+c.salary||0) + refund + debt.borrowed + debt.repaid), moneyOutM: r2(gross + debt.payback + debt.lent),
          saved: r2((+c.salary||0) + refund + debt.borrowed + debt.repaid - gross - debt.payback - debt.lent),   // money in − money out
          avg: days? (total+refund)/days : 0, avgLiving: days? living/days : 0};
}
/* Spending (not refunds, transfers or money coming back) on one day, with the number of entries */
function daySpend(ds){ let s=0,n=0; for(const e of monthEntries(ds.slice(0,7))){ if(e.date!==ds || e.emiOrig) continue; const k=CAT[e.cat]; if(!k||k.income) continue; const v=spendAmt(e); if(!v) continue; s+=v; n++; } return {s:r2(s),n}; }
/* How much of an entry is spending: friends' money is debt, except when a friend paid for your spend */
function spendAmt(e){ const k=CAT[e.cat]; if(!k) return 0; if(e.cat==='borrowed') return spendFor(e)? e.amt : 0; if(k.friend||k.track) return 0; return k.income? -e.amt : e.amt; }
/* Daily-living pace: what's left of the living budgets (food, travel, …) spread over the days left */
const LIVING_CATS = () => BUDGET_CATS.filter(k=>!LIVING_EXCL.has(k.id));
function livingPace(st){
  const cats=LIVING_CATS(), budget=cats.reduce((a,k)=>a+(+st.cfg.budgets[k.id]||0),0), spent=r2(cats.reduce((a,k)=>a+(st.net[k.id]||0),0));
  return {budget, spent, canDay: budget>0 && st.left>0 ? (budget-spent)/st.left : null};
}
function status(spent,budget,cat){
  if(!budget) return null;
  const p = spent/budget;
  if(FIXED.has(cat)) return p>1.005?'bad':'good';   // rent / money home: paying the planned amount is on track
  if(p>1) return 'bad'; if(p>=0.85) return 'warn'; return 'good';
}

/* ============ Exchange rate (profile currency -> home currency) ============ */
async function fetchRate(date){
  const base=curCode(), to=homeCode(); if(base===to) return 1;
  const today = todayStr(), key = date+'|'+base+to;
  if(date!==today && DB.rates[key]) return DB.rates[key];
  const tag = date>=today ? 'latest' : date;
  const urls = [
    `https://api.frankfurter.dev/v1/${tag}?base=${base}&symbols=${to}`,
    `https://api.frankfurter.app/${tag}?from=${base}&to=${to}`
  ];
  for(const u of urls){
    try{ const r = await fetch(u,{cache:'no-store'}); if(r.ok){ const j = await r.json(); const v = j?.rates?.[to]; if(v){ if(date<today){ DB.rates[key]=v; persist(); } DB.meta.lastRate=v; DB.meta.lastRatePair=base+to; return v; } } }catch(e){}
  }
  try{ const r = await fetch('https://open.er-api.com/v6/latest/'+base); if(r.ok){ const j=await r.json(); const v=j?.rates?.[to]; if(v){ DB.meta.lastRate=v; DB.meta.lastRatePair=base+to; return v; } } }catch(e){}
  return null;
}

const S = { allCats:false, ym: curYM(), tab:'home', histCat:'all', dailyMode:'living', histView:'calendar', calMode:'living', selDay:null };
const $ = s => document.querySelector(s);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
function tip(ev,html){ const t=$('#tip'); if(!html){t.classList.remove('on');return;} t.innerHTML=html; t.classList.add('on');
  const x = (ev.touches?ev.touches[0].clientX:ev.clientX), y=(ev.touches?ev.touches[0].clientY:ev.clientY);
  const w=t.offsetWidth, h=t.offsetHeight; t.style.left=Math.min(window.innerWidth-w-8, Math.max(8,x-w/2))+'px'; t.style.top=Math.max(8,y-h-12)+'px'; }
document.addEventListener('scroll',()=>tip(null,null),{passive:true});

function render(){
  $('#mLabel').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>${ymLabel(S.ym,true)}`;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  ['home','history','analysis','budget','settings'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==S.tab));
  ({home:renderHome,history:renderHistory,analysis:renderAnalysis,budget:renderBudget,settings:renderSettings})[S.tab]();
  renderSyncDot();
}

/* ============ HOME ============ */
function renderHome(){
  const st = stats(S.ym);
  const c = st.cfg;
  const today = todayStr();
  const todaySpent = ymOf(today)===S.ym ? (st.daily[today]||0) : null;
  const noBudget = !st.salary && !st.budgetTotal;
  let h = '';
  const isCur = S.ym===curYM(), past = S.ym<curYM();
  h += monthEndCard();
  // ---- Hero: the one number that matters ----
  const hasBud = st.budgetTotal>0, money = isCur && anyBalanceSet();
  const heroVal = money? moneyIn() : hasBud? st.budgetLeft : st.salary? st.saved : -st.total;
  const heroLbl = money? 'Money left to spend' : hasBud? (past?'Budget left at month end':'Left to spend') : st.salary? (past?'Money left at month end':'Money left this month') : 'Spent this month';
  const base = hasBud? st.budgetTotal : st.salary;
  const pct = base? Math.max(0,Math.min(100, (hasBud? (st.budgetTotal-st.budgetLeft) : st.total)/base*100)) : 0;
  const pace = livingPace(st);
  h += `<div class="hero ${heroVal<0&&(base||money)?'over':''}">
    <div class="ht"><span>${ymLabel(S.ym)}${isCur?' · '+st.left+' day'+(st.left===1?'':'s')+' left':''}</span><span>${st.salary?'Salary '+sgd0(st.salary):''}</span></div>
    <div class="hl">${heroVal<0&&money? 'Accounts in the budget are short by' : heroVal<0&&base? (hasBud?'Over budget by':'Overspent by') : heroLbl}</div>
    <div class="hv num"${money?' role="button" tabindex="0" onclick="moneySheet()" style="cursor:pointer"':''}>${sgd(Math.abs(heroVal))}${money?' <span style="font-size:15px;opacity:.75;font-weight:600">ⓘ</span>':''}</div>
    ${money?`<div style="font-size:11.5px;opacity:.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">In ${funds().filter(f=>isSpend(f)).map(f=>esc(shortName(f))).join(', ')||'no accounts'}${creditDueTotal()>0.004?' · after '+sgd(creditDueTotal())+' bills':''} · emergency kept aside</div>`:''}
    ${base?`<div class="hp"><i style="width:${pct}%"></i></div>`:''}
    <div class="hs"><span class="num">${sgd(st.total)} spent${base?' of '+sgd0(base)+(hasBud?' budget':' salary'):''}</span>${money&&hasBud?`<button class="hbl num" onclick="moneySheet()">Budget left ${st.budgetLeft<0?'−':''}${sgd(Math.abs(st.budgetLeft))} ›</button>`:''}</div>
    ${st.days? `<div class="hpace" role="button" tabindex="0" onclick="paceSheet()" style="cursor:pointer"><div><small>Your daily avg · living</small><b class="num">${sgd(st.avgLiving)}</b></div>${isCur && pace.canDay!==null? `<div><small>Can spend / day · living</small><b class="num">${sgd(Math.max(0,pace.canDay))}</b></div>` : `<div><small>Living spent</small><b class="num">${sgd(pace.spent)}</b></div>`}</div>`:''}
    ${isCur && pace.canDay!==null && st.days? `<div class="hnote" onclick="paceSheet()" style="cursor:pointer">${pace.canDay-st.avgLiving>=0? '✓ On track: '+sgd(pace.canDay-st.avgLiving)+'/day under your living budget' : '⚠ '+sgd(st.avgLiving-pace.canDay)+'/day over your living budget'} <span style="opacity:.75;font-weight:500">›</span></div>` : (isCur && !pace.budget && st.days? '<div class="hnote">Set budgets for food, travel and other daily costs to see your daily limit.</div>':'')}
  </div>`;
  // ---- Quick stats: today and yesterday ----
  const tile=(l,v,sub,cls='',ds='')=>`<div class="q"${ds?` role="button" tabindex="0" onclick="daySheet('${ds}')" style="cursor:pointer"`:''}><div class="l">${l}${ds?' <span class="muted">›</span>':''}</div><div class="v num ${cls}">${v}</div><div class="s">${sub}</div></div>`;
  if(isCur){
    const y=new Date(); y.setDate(y.getDate()-1); const yd=dstr(y), t0=daySpend(today), t1=daySpend(yd);
    const lbl=(ds,x)=>{ const [Y,M,D]=ds.split('-').map(Number); return new Date(Y,M-1,D).toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short'})+' · '+x.n+' entr'+(x.n===1?'y':'ies'); };
    h += `<div class="qs">${tile('Today spent', sgd(t0.s), lbl(today,t0),'',today)}${tile('Yesterday spent', sgd(t1.s), lbl(yd,t1),'',yd)}</div>`;
  } else {
    h += `<div class="qs">${tile('Daily living avg', sgd(st.avgLiving), 'excl. bills &amp; misc')}${tile('Sent home', inr(st.inrHome), sgd(st.by.home))}</div>`;
  }
  if(noBudget) h += `<div class="card"><b>Welcome!</b> Set your monthly salary and category budgets to see what's left to spend.
      <div class="btns" style="margin-top:10px"><button class="btn primary" onclick="go('budget')">Set salary &amp; budgets</button><button class="btn" onclick="loadSample()">Try with sample data</button></div></div>`;
  if(isCur) h += upcomingCard() + salaryNotice();
  // ---- Accounts ----
  h += accountsStrip();
  // ---- Categories: top 5, or all ----
  const rows = BUDGET_CATS.map(k=>({k, v:st.net[k.id], b:+c.budgets[k.id]||0})).filter(r=>r.v>0.004).sort((a,b)=>b.v-a.v);
  h += `<div class="card"><h2>${S.allCats?'All categories':'Top categories'}<button class="lnk" onclick="S.allCats=!S.allCats;renderHome()">${S.allCats?'Show less':'See all'}</button></h2>`;
  if(!S.allCats){
    h += rows.length? rows.slice(0,5).map(r=>{ const stt=status(r.v,r.b,r.k.id), rem=r.b-r.v;
      return `<div class="tc" data-cat="${r.k.id}" onclick="S.allCats=true;renderHome()" style="cursor:pointer"><div class="ic">${r.k.icon}</div>
        <div style="min-width:0"><div class="nm">${r.k.name}</div><div class="mt">${r.b? (rem>=0? (FIXED.has(r.k.id)&&rem<0.005? 'Paid in full' : sgd(rem)+' left of '+sgd0(r.b)) : '<span class="neg">'+sgd(-rem)+' over '+sgd0(r.b)+'</span>') : 'No budget'}${r.k.id==='home'&&st.inrHome?' · '+inr(st.inrHome):''}</div>
        ${r.b?`<div class="bar"><i class="${stt}" style="width:${Math.min(100,r.v/r.b*100)}%"></i></div>`:''}</div>
        <div class="am num">${sgd(r.v)}<div class="mt">${Math.round(r.v/(st.total+st.refund||1)*100)}%</div></div></div>`; }).join('')
      + (st.refund? `<div class="small muted" style="margin-top:8px">↩️ Refunds received: <b class="pos num">+${sgd(st.refund)}</b> (taken off the month total)</div>` : '')
      : '<div class="empty">No spending yet this month. Tap + to add one.</div>';
  } else {
  for(const k of CATS){
    if(k.friend || k.track) continue;
    const spent = k.income ? st.by[k.id] : st.net[k.id];
    const b = +c.budgets[k.id]||0;
    const avg = st.days? spent/st.days : 0;
    if(k.income){
      h += `<div class="cat"><div class="row"><div class="ic">${k.icon}</div><div><div class="nm">${k.name}</div><div class="meta">Money received back · taken off the month total</div></div>
        <div class="amt num"><b class="pos">+${sgd(st.by.refund)}</b></div></div></div>`;
      continue;
    }
    const stt = status(spent,b,k.id);
    const pct = b? Math.min(100, spent/b*100) : 0;
    const rem = b - spent;
    let meta = `Avg ${sgd(avg)}/day`;
    if(k.id==='home' && st.inrHome) meta += ` · ${inr(st.inrHome)}`;
    h += `<div class="cat" data-cat="${k.id}"><div class="row"><div class="ic">${k.icon}</div><div style="min-width:0"><div class="nm">${k.name}</div><div class="meta">${meta}</div></div>
      <div class="amt num"><b>${sgd(spent)}</b><div class="meta">${b? (rem>=0? sgd(rem)+' left' : '<span class="neg">'+sgd(-rem)+' over</span>') : 'no budget'}</div></div></div>
      ${b?`<div class="bar" style="margin-left:44px" title="${Math.round(spent/b*100)}% of ${sgd0(b)}"><i class="${stt}" style="width:${pct}%"></i></div>`:''}`;
    if(k.subs){
      const subCard = s=>`<div class="sub">${s.icon} ${s.name}<b class="num">${sgd(st.sub[s.id])}</b><span class="muted num">avg ${sgd(st.days?st.sub[s.id]/st.days:0)}/day</span></div>`;
      const fb = p => 0;   // food split removed (v35)
      const ofB = (x,p) => fb(p)? ` of ${sgd0(fb(p))}${x>fb(p)?' <span class="neg">(over)</span>':''}` : '';
      h += `<div class="subgrp"><span>Daily food</span><span class="num">${sgd(st.dailyFood)}${ofB(st.dailyFood,'daily')} · avg ${sgd(st.days?st.dailyFood/st.days:0)}/day</span></div>`;
      h += `<div class="subs">` + k.subs.filter(s=>!s.group).map(subCard).join('') + `</div>`;
      h += `<div class="subs" style="margin-top:6px">` + k.subs.filter(s=>s.group).map(s=>subCard(s).replace('<span class="muted num">', `<span class="muted num">${fb(s.id)?'budget '+sgd0(fb(s.id))+' · ':''}`)).join('') + `</div>`;
    }
    h += `</div>`;
  }
  }
  h += `</div>`;
  h += splitCard();
  // ---- Recent ----
  const recent = st.es.slice().sort((a,b)=> b.date.localeCompare(a.date) || (b.cr||0)-(a.cr||0)).slice(0,6);
  h += `<div class="card"><h2>Recent<button class="lnk" onclick="go('history')">See all</button></h2>${recent.length? `<div class="list" style="border:0;margin:0 -12px">${recent.map(entRow).join('')}</div>` : '<div class="empty">No expenses yet this month. Tap + to add one.</div>'}</div>`;
  $('#tab-home').innerHTML = h;
  bindCarousel(homeCards(),'h');
  bindTips($('#tab-home'));
}
function entRow(e){
  const k = CAT[e.cat]||{name:e.cat,icon:'•'};
  const s = e.sub && k.subs ? k.subs.find(x=>x.id===e.sub) : null;
  const title = s ? s.name : e.cat==='refund' ? 'Refund' : e.cat==='lent' ? 'Lent to '+esc(e.friend||'friend') : e.cat==='repaid' ? esc(e.friend||'Friend')+' paid back' : e.cat==='payback' ? 'Paid back to '+esc(e.friend||'friend') : e.cat==='borrowed' ? (spendFor(e)? esc(CAT[e.for].name)+' · paid by '+esc(e.friend||'friend') : 'Borrowed from '+esc(e.friend||'friend')) : k.name;
  const extra = [];
  if(e.cat==='home' && e.inr && (e.homeCur||'INR')!==(e.cur||curCode())) extra.push(inr(e.inr, e.homeCur||'INR')+(e.rate?' @ '+e.rate.toFixed(2):''));
  if(e.note) extra.push(esc(e.note));
  if(e.photo) extra.push('📷');
  if(e.inst) extra.unshift('EMI '+e.inst.k+'/'+e.inst.n+(e.inst.early?' · paid early':''));
  if(e.emiOrig){ const pl=emiPlan({...e, amt:e.emiOrig}, true); extra.unshift('On EMI · '+e.emi.n+' × '+sgd(pl[0].amt)+' from '+ymLabel(pl[0].ym,true)); }
  if(e.pay && fundName(e.pay)) extra.push(esc(fundName(e.pay)));
  if(!extra.length) extra.push(s? k.name : dayLabel(e.date));
  return `<div class="ent" onclick="openEntry('${esc(e.src||e.id)}')"><div class="ic">${s?s.icon:k.icon}</div><div class="t"><div>${title}</div><div>${extra.join(' · ')}</div></div>
    <div class="num ${k.income?'pos':''}" style="font-weight:600${e.emiOrig?';opacity:.55':''}">${e.emiOrig? sgd(e.emiOrig) : (k.income?'+':'')+sgd(e.amt)}</div></div>`;
}

/* ============ HISTORY ============ */
function monthXfers(ym){ return Object.values(DB.entries).filter(e=>!e.del && e.cat==='xfer' && e.date.startsWith(ym)); }
function xferRow(e){ const fi=id=>{ const f=allFunds().find(x=>x.id===id); return f? fIcon(f)+' '+esc(shortName(f)) : ''; };
  const from=e.from? fi(e.from) : '💼 Salary', kind=e.salaryFor&&!e.from? 'Salary in' : isCredit(allFunds().find(f=>f.id===e.to))? 'Bill / EMI paid' : 'Transfer';
  return `<div class="ent xf" onclick="openEntry('${esc(e.id)}')"><div class="ic">🔁</div><div class="t"><div>${from} → ${fi(e.to)}</div><div>${[kind, e.note?esc(e.note):'', 'not spending'].filter(Boolean).join(' · ')}</div></div><div class="num xfv">${sgd(e.amt)}</div></div>`; }
function renderHistory(){
  if(S.histCat==='xfer') return renderXferHistory();
  const es = monthEntries(S.ym).filter(e=>S.histCat==='all'||e.cat===S.histCat||(S.histCat==='food-'+e.sub));
  const signed = e => spendAmt(e);
  const days = {};
  es.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
  let opts = `<option value="all">All categories</option><option value="xfer">🔁 Transfers (not spending)</option>` + CATS.filter(c=>!c.track).map(c=>`<option value="${c.id}">${c.name}</option>`+(c.subs?c.subs.map(s=>`<option value="food-${s.id}">&nbsp;&nbsp;&nbsp;${s.name}</option>`).join(''):'')).join('');
  const total = es.reduce((s,e)=>s+signed(e),0);
  const cal = S.histView!=='list';
  let h = `<div class="card"><div class="row" style="gap:8px;flex-wrap:wrap">
      <div class="seg"><button class="${cal?'on':''}" data-hv="calendar">Calendar</button><button class="${cal?'':'on'}" data-hv="list">List</button></div>
      <select class="in" id="histCat" style="flex:1;min-width:160px">${opts}</select></div>
    <div class="small muted" style="margin-top:8px">${es.length} entr${es.length===1?'y':'ies'} · total <b class="num" style="color:var(--text)">${sgd(total)}</b></div></div>`;
  if(cal) h += calendarView(es, days, signed);
  else {
    const xd={}; if(S.histCat==='all') monthXfers(S.ym).forEach(e=>(xd[e.date]=xd[e.date]||[]).push(e));
    const keys = [...new Set([...Object.keys(days), ...Object.keys(xd)])].sort().reverse();
    if(!keys.length) h += `<div class="empty">Nothing recorded for ${ymLabel(S.ym)}.</div>`;
    for(const d of keys) h += dayBlock(d, days[d]||[], signed, xd[d]);
  }
  $('#tab-history').innerHTML = h;
  const sel=$('#histCat'); sel.value=S.histCat; sel.onchange=()=>{S.histCat=sel.value; renderHistory();};
  const th=$('#tab-history');
  th.querySelectorAll('[data-hv]').forEach(b=>b.onclick=()=>{ S.histView=b.dataset.hv; renderHistory(); });
  th.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{ S.calMode=b.dataset.cm; renderHistory(); });
  th.querySelectorAll('.cal .d[data-date]').forEach(c=>c.onclick=()=>{ S.selDay=c.dataset.date; renderHistory(); });
  bindTips($('#tab-history'));
}
function dayBlock(d, list, signed, xf){
  list = list.slice().sort((a,b)=>(b.cr||0)-(a.cr||0));
  const dt = list.reduce((s,e)=>s+(e.cat==='refund'&&S.histCat!=='refund'?0:signed(e)),0);   // refunds aren't counted in day totals; transfers never
  return `<div class="day"><div class="dh"><span>${dayLabel(d)}</span><span class="num">${list.length?sgd(dt):''}</span></div><div class="list">${list.map(entRow).join('')}${(xf||[]).sort((a,b)=>(b.cr||0)-(a.cr||0)).map(xferRow).join('')}</div></div>`;
}
function renderXferHistory(){
  const xs=monthXfers(S.ym), sum=r2(xs.reduce((a,e)=>a+e.amt,0)), isC=id=>isCredit(allFunds().find(f=>f.id===id));
  const sal=r2(xs.filter(e=>!e.from).reduce((a,e)=>a+e.amt,0)), bills=r2(xs.filter(e=>e.from&&isC(e.to)).reduce((a,e)=>a+e.amt,0)), moves=r2(sum-sal-bills);
  const by={}; xs.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
  let opts = `<option value="all">All categories</option><option value="xfer">🔁 Transfers (not spending)</option>` + CATS.filter(c=>!c.track).map(c=>`<option value="${c.id}">${c.name}</option>`+(c.subs?c.subs.map(s=>`<option value="food-${s.id}">&nbsp;&nbsp;&nbsp;${s.name}</option>`).join(''):'')).join('');
  let h=`<div class="card"><div class="row" style="gap:8px;flex-wrap:wrap"><select class="in" id="histCat" style="flex:1;min-width:160px">${opts}</select></div>
    <div class="xfsum"><div><small>Moved this month</small><b class="num">${sgd(sum)}</b></div><div><small>💼 Salary in</small><b class="num">${sgd(sal)}</b></div><div><small>💳 Bills &amp; EMIs paid</small><b class="num">${sgd(bills)}</b></div><div><small>🔁 Between accounts</small><b class="num">${sgd(moves)}</b></div></div>
    <div class="small muted" style="margin-top:6px">${xs.length} transfer${xs.length===1?'':'s'} · money moving between your accounts, never counted as spending</div></div>`;
  const keys=Object.keys(by).sort().reverse();
  if(!keys.length) h+=`<div class="empty">No transfers in ${ymLabel(S.ym)}.</div>`;
  for(const d of keys) h+=`<div class="day"><div class="dh"><span>${dayLabel(d)}</span><span class="num xfv">${sgd(by[d].reduce((a,e)=>a+e.amt,0))}</span></div><div class="list">${by[d].sort((a,b)=>(b.cr||0)-(a.cr||0)).map(xferRow).join('')}</div></div>`;
  $('#tab-history').innerHTML=h;
  const sel=$('#histCat'); sel.value='xfer'; sel.onchange=()=>{S.histCat=sel.value; renderHistory();};
}
function calendarView(es, days, signed, cat=S.histCat){
  const ym=S.ym, n=dim(ym), [y,m]=ym.split('-').map(Number);
  const excl = cat==='all' && S.calMode!=='all';        // leave out monthly bills so they don't swamp the shading
  const val = {};
  for(const e of es){ if((excl && LIVING_EXCL.has(e.cat)) || (e.cat==='refund' && cat!=='refund')) continue; val[e.date]=(val[e.date]||0)+signed(e); }
  const vals = Object.values(val); const mx = Math.max(1,...vals);
  const today = todayStr();
  const lead = (new Date(y,m-1,1).getDay()+6)%7;                // weeks start on Monday
  if(!S.selDay || !S.selDay.startsWith(ym)) S.selDay = ymOf(today)===ym ? today : null;
  const dueSet = new Set(funds().filter(isCredit).filter(f=>owedOf(f)>0.004 || Object.values(DB.entries).some(e=>isEmi(e)&&e.pay===f.id&&emiPlan(e).some(p=>p.ym===ym))).map(f=>ym+'-'+pad(dueDay(f))));
  let h = `<div class="card">`;
  if(cat==='all') h += `<div class="chips" style="margin-bottom:10px"><button class="chip ${excl?'on':''}" data-cm="living">Daily living</button><button class="chip ${excl?'':'on'}" data-cm="all">Everything</button></div>`;
  h += `<div class="cal">` + ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<lead;i++) h += `<div></div>`;
  let weekTot=0; const weeks=[];
  for(let d=1; d<=n; d++){
    const date = ym+'-'+pad(d), v = val[date]||0, has = !!days[date];
    const pct = v>0 ? Math.round(12 + 68*v/mx) : 0;
    const dark = pct>=48;
    const style = v>0 ? `background:color-mix(in srgb, var(--series-1) ${pct}%, var(--surface));${dark?'color:#fff;':''}` : '';
    const cls = ['d', date===today?'today':'', date===S.selDay?'sel':'', date>today?'future':''].join(' ');
    const amt = v ? (Math.abs(v)>=1000 ? (v/1000).toFixed(1)+'k' : Math.abs(v)>=100 ? Math.round(v) : v.toFixed(v%1?1:0)) : (has?'0':'');
    const bell = dueSet.has(date);
    h += `<div class="${cls}" data-date="${date}" style="${style}" data-tip="${esc(dayLabel(date))}: ${sgd(v)}${has?' · '+days[date].length+' entr'+(days[date].length===1?'y':'ies'):''}${bell?' · 🔔 credit payment due':''}"><span class="dn">${d}${bell?'<span style="font-size:10px"> 🔔</span>':''}</span><span class="da num">${amt}</span></div>`;
    weekTot += v;
    if((lead+d)%7===0 || d===n){ weeks.push(weekTot); weekTot=0; }
  }
  h += `</div>`;
  // legend + month facts
  const counted = Object.keys(val).length ? vals : [];
  const elapsed = daysElapsed(ym);
  const noSpend = elapsed ? Array.from({length:elapsed},(_,i)=>ym+'-'+pad(i+1)).filter(d=>!(val[d]>0)).length : 0;
  const top = Object.entries(val).sort((a,b)=>b[1]-a[1])[0];
  const sum = counted.reduce((a,b)=>a+b,0);
  h += `<div class="calleg"><span>${sgd0(0)}</span><i style="background:linear-gradient(90deg,color-mix(in srgb,var(--series-1) 12%,var(--surface)),var(--series-1))"></i><span>${sgd0(mx)}</span><span class="muted" style="margin-left:auto">Amounts in ${curCode()}${excl?' · excl. '+FIXED_TXT:''}</span></div>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="l">Total</div><div class="v num">${sgd(sum)}</div></div>

function groupTotals(st){ const inG=new Set(GROUPS.flatMap(g=>g.cats)); return GROUPS.map(g=>{ let v=g.cats.reduce((a,k)=>a+(st.net[k]||0),0);

/* ============ Month summary: donut of where the salary went + savings ============ */
function firstYm(){ const ks=[...Object.values(DB.entries).filter(e=>!e.del).map(e=>e.date.slice(0,7)), ...Object.keys(DB.months).filter(k=>!DB.months[k].del)]; return ks.length? ks.sort()[0] : null; }
function savedBefore(ym){ const f=firstYm(); let m=f, sum=0, n=0; if(!f) return {sum,n}; while(m<ym){ const x=stats(m); if(x.salary){ sum+=x.saved; n++; } m=addMonths(m,1); } return {sum,n}; }
function donutSvg(parts, center1, center2){
  const tot=parts.reduce((a,p)=>a+p.v,0); if(!tot) return '';
  const R=80, r=52, C=85; let a0=-Math.PI/2, out='';
  const pt=(a,rad)=>[C+rad*Math.cos(a), C+rad*Math.sin(a)];
  for(const p of parts){
    const frac=p.v/tot, a1=a0+frac*2*Math.PI, big=frac>0.5?1:0;
    let d;
    if(frac>=0.9999){ d=`M${C-R},${C} a${R},${R} 0 1,0 ${2*R},0 a${R},${R} 0 1,0 ${-2*R},0 M${C-r},${C} a${r},${r} 0 1,1 ${2*r},0 a${r},${r} 0 1,1 ${-2*r},0Z`; }
    else { const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r);
      d=`M${x0},${y0} A${R},${R} 0 ${big},1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big},0 ${x3},${y3}Z`; }
    out+=`<path d="${d}" fill="${p.c}" fill-rule="evenodd" stroke="var(--surface)" stroke-width="2" data-tip="<b>${esc(p.name)}</b><br>${sgd(p.v)} · ${Math.round(frac*100)}%"/>`;
    a0=a1;
  }
  return `<svg viewBox="0 0 170 170" role="img" aria-label="Where the money went">${out}<text class="c1" x="85" y="86" text-anchor="middle">${center1}</text><text class="c2" x="85" y="103" text-anchor="middle">${center2}</text></svg>`;
}

/* Daily-living spending so far (filled) against an even pace to the living budget (line) */
function paceChart(st){

  if(!pace.budget) return '<div class="muted small">Set budgets for food, travel and other daily costs to see your pace.</div>';
  const W=chartW(), H=150, L=40, Rr=8, T=10, Bt=24, iw=W-L-Rr, ih=H-T-Bt;
  let cum=0; const pts=[[0,0]];
  for(let d=1; d<=today; d++){ const ds=S.ym+'-'+pad(d); cum+=st.dailyLiving[ds]||0; pts.push([d,cum]); }
  const mx=niceMax(Math.max(pace.budget,cum)), x=d=>L+d/n*iw, y=v=>T+ih-(v/mx)*ih;
  const area='M'+x(0)+','+y(0)+' '+pts.map(p=>'L'+x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ')+' L'+x(today)+','+y(0)+'Z';
  const line=pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ');
  const expNow=pace.budget*today/n, ok=cum<=expNow;
  let g=''; const tk=ticks(mx); for(let i=0;i<=tk;i++){ const v=mx*i/tk; g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${sgd0(v).replace(/^[^0-9]+/,'')}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Living spending ${sgd0(cum)} so far against a budget pace of ${sgd0(expNow)}">${g}
    <path d="M${x(0)},${y(0)} L${x(n)},${y(pace.budget)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <path d="${area}" fill="var(--series-1)" opacity=".16"/><path d="${line}" stroke="var(--series-1)" stroke-width="2.5" fill="none"/>
    <circle cx="${x(today)}" cy="${y(cum)}" r="4" fill="var(--series-1)"/>
    <text x="${L}" y="${H-6}">1</text><text x="${x(today)}" y="${H-6}" text-anchor="middle">today</text><text x="${W-Rr}" y="${H-6}" text-anchor="end">${n}</text></svg>
    <div class="small" style="margin-top:6px">Spent <b class="num">${sgd(cum)}</b> on daily living by day ${today}. An even pace to your ${sgd0(pace.budget)} living budget would be <b class="num">${sgd(expNow)}</b> — <b class="${ok?'pos':'neg'}">${ok?sgd(expNow-cum)+' under':sgd(cum-expNow)+' over'}</b>.</div>`;
}

function debtCard(st, ym){

    const A=dir==='owe'?'borrowed':'lent', B=dir==='owe'?'payback':'repaid', a=r2(m.filter(e=>e.cat===A).reduce((x,e)=>x+e.amt,0)), b=r2(m.filter(e=>e.cat===B).reduce((x,e)=>x+e.amt,0));
    const bits=[]; if(a) bits.push((dir==='owe'?'took ':'gave ')+sgd(a)); if(b) bits.push((dir==='owe'?'paid back ':'got back ')+sgd(b));
    const st2 = f.owed>0.004? `<span class="${dir==='owe'?'neg':''}">${dir==='owe'?'you owe':'owes you'} ${sgd(f.owed)}</span>` : '<span class="pos">Settled ✓</span>';

  owe.forEach(f=>add(f,'owe')); lend.forEach(f=>add(f,'lend'));

  return `<div class="card"><h2>${catImg('debt')} Debt <span class="small muted" style="font-weight:500">· not spending</span></h2>
    <div class="kp3" style="grid-template-columns:1fr 1fr"><div class="kpi" style="cursor:pointer" onclick="friendsSheet('owe')"><div class="l">You owe</div><div class="v num ${tOwe>0.004?'neg':''}">${sgd(tOwe)}</div></div>
    <div class="kpi" style="cursor:pointer" onclick="friendsSheet('lend')"><div class="l">Friends owe you</div><div class="v num">${sgd(tLend)}</div></div></div>
    <div style="margin-top:10px">${ln('Borrowed this month',sgd(D.borrowed))}${D.borrowFor>0.004? ln('of which a friend paid for your spending',sgd(D.borrowFor),'sub2'):''}
    ${ln('Paid back this month',sgd(D.payback))}${ln('Lent this month',sgd(D.lent))}${ln('Got back this month',sgd(D.repaid))}</div>

}

function chartW(){ const w=(document.querySelector('main')?.clientWidth||400)-62; return Math.max(300,Math.min(700,w)); }

function niceMax(v){ if(v<=0) return 10; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }

function trendChart(){

  for(let i=0;i<=4;i++){ const v=lo+(mx-lo)*i/4, yy=y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${Math.abs(v)>=1000?(Math.round(v/100)/10)+'k':Math.round(v)}</text>`; }
  const bar=(x,v,col)=>{ if(!v) return ''; const y0=y(0), y1=y(v); const top=Math.min(y0,y1), h=Math.abs(y1-y0); const rr=Math.min(4,h);

  data.forEach((d,i)=>{
    const gx=L+i*gw+(gw-2*bw-2)/2;

  return s;
}

const FTX = {

  owe:{A:'borrowed', B:'payback', get icon(){ return catImg('borrowed'); }, title:'You owe friends', owes:'you owe', times:'borrowed', empty:'Borrowed from a friend? Tap to keep track',
    none:'You don’t owe anyone right now.', add:'+ Borrowed money', addB:'+ Paid back', more:'+ Borrow more', backBtn:'Pay back',

    fA:'Money taken from a friend', fB:'Paid back to a friend', amtA:'Amount borrowed', amtB:'Amount paid', iA:'Borrowed', iB:'Paid back',

const fdir = cat => CAT[cat]?.owe ? 'owe' : 'lend';
function friendLedger(dir='lend'){
  const T=FTX[dir], map={};
  for(const e of Object.values(DB.entries)){ if(e.del || (e.cat!==T.A && e.cat!==T.B)) continue;
    const n=(e.friend||'Friend').trim(), k=n.toLowerCase(); const f=map[k]||(map[k]={name:n, lent:0, back:0, items:[]});
    if(e.cat===T.A) f.lent+=e.amt; else f.back+=e.amt; f.items.push(e); }
  return Object.values(map).map(f=>({...f, owed:Math.max(0,r2(f.lent-f.back)), older:Math.max(0,r2(f.back-f.lent)), items:f.items.sort((a,b)=>b.date.localeCompare(a.date)||(b.cr||0)-(a.cr||0))}))
    .sort((a,b)=>b.owed-a.owed || a.name.localeCompare(b.name));
}

/* ============ Calculator: numbers, + − × ÷, %, brackets. Own parser (no eval). ============ */
let CALC='';
function calcEval(src){
  const t=String(src).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-'); let i=0;
  const peek=()=>t[i], eat=c=>{ if(t[i]===c){ i++; return true; } return false; };
  function num(){ const m=/^\d*\.?\d+|^\d+\./.exec(t.slice(i)); if(!m) throw 0; i+=m[0].length; return parseFloat(m[0]); }
  function prim(){ let v; if(eat('-')) return {v:-val(prim())};
    if(eat('(')){ v=expr(); if(!eat(')')) throw 0; } else v=num();
    if(eat('%')) return {v, pct:true}; return {v}; }
  const val=p=>p.pct? p.v/100 : p.v;
  function term(){ const f=prim(); let v=val(f), single=true;
    while(peek()==='*'||peek()==='/'){ single=false; const o=t[i++], g=val(prim()); if(o==='*') v*=g; else { if(g===0) throw 0; v/=g; } }
    return single&&f.pct? {v:f.v, pct:true, pv:v} : {v}; }
  function expr(){ const a=term(); let v=a.pct? a.pv : a.v;
    while(peek()==='+'||peek()==='-'){ const o=t[i++], b=term(); const d=b.pct? v*b.v/100 : b.v; v = o==='+'? v+d : v-d; }
    return v; }
  if(!t.trim()) throw 0; const v=expr(); if(i!==t.length || !isFinite(v)) throw 0; return v;
}
function calcFmt(v){ const r=Math.round(v*100)/100; return r.toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function calcSheet(){
  const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','( )','0','.','='];
  const DEL='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M16.5 9.5l-5 5M11.5 9.5l5 5"/></svg>';
  openSheet(`<div class="sheettop"><h3>🧮 Calculator</h3><button class="btn sm" onclick="closeSheet()">Close</button></div>
    <div class="calcpad"><div class="expr num" id="cExpr"></div><div class="res num" id="cRes"></div>
    <div class="keys">${keys.map(k=>`<button data-k="${k}" class="${'÷×−+'.includes(k)&&k.length===1?'op':k==='='?'eq':k==='C'||k==='⌫'?'c':''}" aria-label="${k==='( )'?'Brackets':k==='⌫'?'Delete':k}">${k==='⌫'?DEL:k}</button>`).join('')}</div></div>
    <div class="btns"><button class="btn" id="cCopy" style="flex:1">Copy result</button><button class="btn primary" id="cAdd" style="flex:1">+ Add as expense</button></div>`);
  const res=()=>{ const open=(CALC.match(/\(/g)||[]).length-(CALC.match(/\)/g)||[]).length; try{ return calcEval(CALC+')'.repeat(Math.max(0,open))); }catch(e){ return null; } };
  const draw=()=>{ $('#cExpr').textContent=CALC||'0'; const v=res(); $('#cRes').textContent = v===null || !/[+−×÷%(]/.test(CALC.replace(/^\(−/,''))? '' : calcFmt(v); };
  const press=k=>{ const last=CALC.slice(-1), ops='+−×÷';
    if(k==='C') CALC='';
    else if(k==='⌫') CALC=CALC.slice(0,-1);
    else if(k==='='){ const v=res(); if(v!==null) CALC=String(Math.round(v*100)/100); }
    else if(k==='+/−'){ const m=/(\(−)?(\d*\.?\d*%?)$/.exec(CALC); if(m[1]) CALC=CALC.slice(0,m.index)+m[2]; else if(!m[2] && last===')') return; else CALC=CALC.slice(0,m.index)+(m.index>0&&/[\d)%]/.test(CALC[m.index-1])?'×':'')+'(−'+m[2]; }
    else if(k==='( )'){ const open=(CALC.match(/\(/g)||[]).length-(CALC.match(/\)/g)||[]).length; CALC += (open>0 && /[\d)%]/.test(last))? ')' : (/[\d)%]/.test(last)? '×(' : '('); }
    else if(ops.includes(k)){ if(!CALC && k!=='−') return; if(ops.includes(last)) CALC=CALC.slice(0,-1); CALC+=k; }
    else if(k==='%'){ if(/[\d)]/.test(last)) CALC+='%'; }
    else if(k==='.'){ const seg=CALC.split(/[+−×÷()]/).pop(); if(seg.includes('.')) return; CALC += /\d/.test(last)? '.' : '0.'; }
    else { if(last==='%'||last===')') CALC+='×'; CALC+=k; }
    if(CALC.length>60) CALC=CALC.slice(0,60); draw(); };
  document.querySelectorAll('#sheet [data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
  const kd=ev=>{ if(!$('#cExpr')){ document.removeEventListener('keydown',kd); return; } const m={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'⌫','Escape':null,'(':'( )',')':'( )','%':'%','.':'.',',':'.','c':'C','C':'C'};
    let k=/^\d$/.test(ev.key)? ev.key : m[ev.key]; if(k===undefined||k===null) return; ev.preventDefault(); press(k); };
  if(window.__calcKd) document.removeEventListener('keydown',window.__calcKd); window.__calcKd=kd; document.addEventListener('keydown',kd);
  $('#cCopy').onclick=async()=>{ const v=res(); if(v===null){ toast('Nothing to copy yet'); return; } const s2=(Math.round(v*100)/100).toFixed(2); try{ await navigator.clipboard.writeText(s2); toast('Copied '+s2); }catch(e){ toast('Result: '+s2); } };
  $('#cAdd').onclick=()=>{ const v=res(); if(v===null||!(v>0)){ toast('Work out a positive amount first'); return; } CALC=''; closeSheet(); openEntry(null,null,(Math.round(v*100)/100).toFixed(2)); };
  draw();
}

function shrinkPhoto(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), im=new Image();

  if(r.currency && r.currency!==curCode())

  for(const [m,c] of Object.entries(r.months||{})){ if(bad(m) || !c || typeof c!=='object' || !/^\d{4}-\d{2}$/.test(m)) continue; const l=DB.months[m]; if(!l || (c.upd||0)>(l.upd||0)){ DB.months[m]=c; n++; } }

/* ============ Cloud sync (private Google Apps Script in the user's own Google account) ============

async function hashPin(pin, salt){
  const data = new TextEncoder().encode(salt+':'+pin);
  try{ const d = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h=0; for(const c of data) h=(h*31+c)>>>0; return 'x'+h.toString(16); }
}

/* Full-screen PIN pad. Resolves true when the right PIN is entered, false if cancelled. */
function askPin(p, blocking){
  return new Promise(resolve=>{
    const el = document.createElement('div'); el.className='lock';
    let val='';
    const draw = (msg)=>{ el.innerHTML = `<div class="box">${avatar(p,true).replace('class="av lg"','class="av lg" style="margin:0 auto;width:56px;height:56px;font-size:30px"')}
      <h3 style="margin:12px 0 2px">${esc(p.name)}</h3><div class="small ${msg?'neg':'muted'}">${msg||'Enter PIN'}</div>
      <div class="pindots">${[0,1,2,3].map(i=>`<i class="${i<val.length?'on':''}"></i>`).join('')}</div>
      <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="x" style="font-size:14px">${blocking?(PROFILES.list.length>1?'Switch':''):'Cancel'}</button><button data-k="0">0</button><button data-k="b" aria-label="Delete">⌫</button></div></div>`;
      el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k)); };
    const finish = ok => { document.removeEventListener('keydown', kd); el.remove(); resolve(ok); };
    const key = async k => {
      if(k==='x'){ if(!blocking) finish(false); else if(PROFILES.list.length>1){ finish(false); } return; }
      if(k==='b'){ val=val.slice(0,-1); draw(); return; }
      if(val.length>=4) return;
      val+=k; draw();
      if(val.length===4){ const h = await hashPin(val,p.salt); if(h===p.pin) finish(true); else { val=''; draw('Wrong PIN — try again'); } }
    };
    const kd = ev => { if(/^\d$/.test(ev.key)) key(ev.key); else if(ev.key==='Backspace') key('b'); else if(ev.key==='Escape' && !blocking) key('x'); };
    document.addEventListener('keydown', kd);
    draw(); document.body.appendChild(el);
  });
}

}

   On Home after using it, back once shows "Press back again to close". The guard history entry is re-added on taps,
   because Chrome skips history entries that no tap followed. */
(function(){ if(!(history.pushState && window.matchMedia)) return; let exitT=0;
  const guard=()=>{ try{ if(!(history.state&&history.state.g)) history.pushState({g:1},''); }catch(e){} };
  guard(); ['pointerdown','keydown'].forEach(t=>document.addEventListener(t,()=>guard(),{capture:true,passive:true}));
  window.addEventListener('popstate',()=>{
    if($('#sheetBg').classList.contains('open')){ closeSheet(); guard(); return; }
    if(S.tab!=='home'){ go('home'); return; }
    if(Date.now()-exitT<2000) return;
    exitT=Date.now(); toast('Press back again to close');
    setTimeout(()=>{ if(Date.now()-exitT>=1900) guard(); },2000);
  });
})();
initSync();
if(!cloudOn()) setTimeout(autoSalary, 300);
startupLock();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  const hadSW = !!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.register('sw.js').then(r=>{ try{ r.update().catch(()=>{}); }catch(e){} }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadSW && !reloaded){ reloaded=true; location.reload(); } });
}
</script>
