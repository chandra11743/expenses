<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Expenses</title>
<meta name="description" content="Track daily spending by category, monthly budgets, salary and savings.">
<meta name="theme-color" content="#2a78d6">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://api.frankfurter.dev https://api.frankfurter.app https://open.er-api.com; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'; worker-src 'self'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  color-scheme: light;
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eff2f6; --border:#e3e7ed;
  --text:#0e1726; --text-2:#475467; --muted:#8a94a6; --card-border:transparent;
  --hero-1:#2a78d6; --hero-2:#1a4fa0;
  --accent:#2a78d6; --accent-ink:#ffffff;
  --series-1:#2a78d6; --series-3:#1baf7a;
  --g1:#2a78d6; --g2:#eb6834; --g3:#4a3aa7; --g4:#eda100; --g5:#e87ba4; --g6:#008300; --g7:#e34948; --g8:#8e3b8e; --g9:#7a8a00;
  --good:#008300; --warn:#b77a00; --bad:#d03b3b;
  --good-bg:#e3f3e3; --warn-bg:#fbf0d6; --bad-bg:#fbe3e3;
  --grid:#e6e4de;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d0f13; --surface:#171a20; --surface-2:#22262e; --border:#2c313a;
    --text:#f5f7fa; --text-2:#b8c0cc; --muted:#8792a2; --card-border:#262a32;
    --hero-1:#2a6fc4; --hero-2:#17407f;
    --accent:#3987e5; --accent-ink:#ffffff;
    --series-1:#3987e5; --series-3:#199e70;
    --g1:#3987e5; --g2:#d95926; --g3:#9085e9; --g4:#c98500; --g5:#d55181; --g6:#008300; --g7:#e66767; --g8:#b565b5; --g9:#8f9f1a;
    --good:#4fb84f; --warn:#e0a526; --bad:#ef6b6b;
    --good-bg:#1d3320; --warn-bg:#3a2f14; --bad-bg:#3d1f1f;
    --grid:#2c2c29;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0f13; --surface:#171a20; --surface-2:#22262e; --border:#2c313a;
  --text:#f5f7fa; --text-2:#b8c0cc; --muted:#8792a2; --card-border:#262a32;
  --hero-1:#2a6fc4; --hero-2:#17407f;
  --accent:#3987e5; --accent-ink:#ffffff;
  --series-1:#3987e5; --series-3:#199e70;
  --g1:#3987e5; --g2:#d95926; --g3:#9085e9; --g4:#c98500; --g5:#d55181; --g6:#008300; --g7:#e66767; --g8:#b565b5; --g9:#8f9f1a;
  --good:#4fb84f; --warn:#e0a526; --bad:#ef6b6b;
  --good-bg:#1d3320; --warn-bg:#3a2f14; --bad-bg:#3d1f1f;
  --grid:#2c2c29;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font-size:17px;margin:0;font-weight:650}
.profbtn{display:flex;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;padding:4px 8px 4px 4px;border-radius:20px;font-weight:650;font-size:15px;color:var(--text);min-width:0;max-width:40vw}
.profbtn:hover{background:var(--surface-2)}
.profbtn .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.av.lg{width:40px;height:40px;font-size:17px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--border);cursor:pointer;border-radius:8px}
.prow:first-child{border-top:0}
.prow:hover{background:var(--surface-2)}
.prow .grow{flex:1;min-width:0}
.prow .grow b{display:block}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin:14px 0}
.pinpad button{height:56px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:22px;font-weight:600;cursor:pointer}
.pinpad button:active{background:var(--surface-2)}
.pindots{display:flex;gap:12px;justify-content:center;margin:10px 0}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--text-2)}
.pindots i.on{background:var(--text)}
.lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.lock .box{width:100%;max-width:340px;text-align:center}
body.locked main,body.locked nav.tabs,body.locked .fab,body.locked .monthnav,body.locked #syncBtn{visibility:hidden}
body.locked::after{content:"Locked. Tap the name at the top to unlock or switch profile.";position:fixed;left:16px;right:16px;top:40%;text-align:center;color:var(--text-2)}
.monthnav{display:flex;align-items:center;gap:2px}
.monthnav button{border:0;background:transparent;width:34px;height:34px;border-radius:8px;font-size:20px;cursor:pointer;color:var(--text-2)}
.monthnav button:hover{background:var(--surface-2)}
.monthnav .mlabel{width:auto;min-width:104px;padding:0 10px;font-size:15px;font-weight:650;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.monthnav .mlabel svg{width:15px;height:15px;color:var(--accent)}
.sheet .monthnav .mlabel{cursor:default}
main{max-width:760px;margin:0 auto;padding:12px 16px 24px}
.card{background:var(--surface);border:1px solid var(--card-border);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 12px;color:var(--text);font-weight:700;letter-spacing:-.01em}
.card h2 .lnk,.sechead .lnk{float:right;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;background:none;border:0;padding:0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface-2);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--text-2)}
.kpi .v{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.cat{padding:10px 0;border-top:1px solid var(--border)}
.cat:first-of-type{border-top:0}
.cat .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px;flex:none}
.cat .nm{font-weight:600}
.cat .meta{font-size:12px;color:var(--text-2)}
.cat .amt{margin-left:auto;text-align:right;white-space:nowrap}
.cat .amt b{font-weight:650}
.bar{height:6px;border-radius:4px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--good)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.subgrp{margin:10px 0 0 44px;display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--text-2);flex-wrap:wrap}
.subs{margin:6px 0 0 44px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:560px){.subs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sub{background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:12px}
.sub b{display:block;font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;border-radius:10px;font-size:11px;color:var(--text-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;max-width:120px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.on svg{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:12px;padding:3px 12px;width:46px;height:28px;box-sizing:border-box;margin-top:-3px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(42,120,214,.4)}
@media (min-width:800px){.fab{right:calc(50% - 370px)}}
.btn{border:1px solid var(--border);background:var(--surface);padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:block;font-size:12px;color:var(--text-2);margin:10px 0 4px;font-weight:600}
input.in,select.in,textarea.in{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--surface);outline:none}
input.in:focus,select.in:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);padding:7px 10px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 10px}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 6px;font-size:18px}
.bigamt{font-size:26px;font-weight:650;text-align:right}
.day{margin-bottom:12px}
.day .dh{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);font-weight:600;padding:0 4px 6px}
.eye{border:0;background:var(--surface-2);color:var(--text-2);border-radius:10px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.eye svg{width:20px;height:20px}
.ent{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--border);cursor:pointer}
.ent:first-child{border-top:0}
.ent:hover{background:var(--surface-2)}
.ent .ic{font-size:18px;width:26px;text-align:center}
.ent .t{flex:1;min-width:0}
.ent .t div:last-child{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--text-2);font-weight:600;font-size:12px}
.tablewrap{overflow-x:auto}
.hbar{display:grid;grid-template-columns:118px 1fr auto;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.hbar .track{height:14px;position:relative}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.hbar:hover .track i{filter:brightness(1.1)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin-bottom:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-size:11px}
.msum{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.msum svg{width:170px;height:170px;flex:none;margin:0 auto}
.msum svg .c1{fill:var(--text);font-size:16px;font-weight:700}
.msum svg .c2{fill:var(--muted);font-size:11px}
.plist{flex:1;min-width:200px;display:grid;gap:6px}
.plist div{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;font-size:13px}
.plist i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.plist .num{text-align:right}.plist .pc{color:var(--muted);min-width:34px;text-align:right}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;opacity:0;transition:opacity .1s;max-width:220px}
#tip.on{opacity:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
.syncdot.ok{background:var(--good)} .syncdot.need{background:var(--warn)}
#syncBtn.busy .syncdot{background:var(--accent);animation:sdp .7s ease-in-out infinite alternate}
@keyframes sdp{from{transform:scale(.6);opacity:.5}to{transform:scale(1.25);opacity:1}}
.insight{padding:8px 0;border-top:1px solid var(--border);font-size:14px}
.insight:first-of-type{border-top:0}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1/1.05;border-radius:8px;background:var(--surface-2);padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:2px solid transparent;min-width:0;overflow:hidden;color:var(--text)}
.cal .d:hover{border-color:var(--border)}
.cal .d.today{border-color:var(--text-2)}
.cal .d.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal .d.future{opacity:.45}
.cal .dn{font-size:11px;font-weight:600;opacity:.8}
.cal .da{font-size:12px;font-weight:650;text-align:right;white-space:nowrap}
@media (min-width:560px){.cal{gap:6px}.cal .d{aspect-ratio:1.25/1;padding:6px 8px}.cal .dn{font-size:12px}.cal .da{font-size:14px}}
.calleg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-2);margin-top:10px}
.calleg i{display:block;width:90px;height:8px;border-radius:4px}
.brow{display:grid;grid-template-columns:34px minmax(0,1fr) 116px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.brow .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px}
.brow .ic.sm{width:28px;height:28px;font-size:15px;justify-self:end}
.brow .nm{font-weight:600}
.brow .meta{font-size:12px;color:var(--text-2)}
.brow .bin{text-align:right}
.brow .bin[readonly]{background:var(--surface-2);color:var(--text-2)}
.frow{display:grid;grid-template-columns:34px minmax(0,1fr) 116px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.frow .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px}
.frow .nm{font-weight:600}
.frow label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-top:4px;cursor:pointer}
.frow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.share{height:4px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.share i{display:block;height:100%;background:var(--series-1);border-radius:3px}
.bparts{margin-left:20px;padding-left:12px;border-left:2px solid var(--border);margin-bottom:6px}
.brow.part{border-top:1px dashed var(--border);padding:8px 0;grid-template-columns:28px minmax(0,1fr) 116px}
.hidden{display:none!important}
.stl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;font-size:14px}
.stl.sub{padding:2px 0 2px 14px;font-size:12.5px;color:var(--text-2)}
.stl.tot{border-top:1.5px solid var(--text);margin-top:6px;padding-top:9px;font-weight:800;font-size:15px}
.stl.muted{color:var(--text-2)}
.stdiff{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;margin-top:8px;font-weight:700;font-size:14px;background:var(--surface-2)}
.stdiff.ok{background:var(--good-bg);color:var(--good)} .stdiff.bad{background:var(--warn-bg);color:var(--warn)}
.efrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.efrow .nm{font-weight:600}
.bgr{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.card h2 + .bgr{border-top:0}
.bgr .nm{font-weight:600} .bgr .meta{font-size:12px;color:var(--text-2)} .bgr .bar{margin-top:6px}
.bgr .bin{text-align:right}
.bsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;text-align:center}
.bsum span{display:block;font-size:12px;color:var(--text-2)} .bsum b{font-size:17px}
.warnbox{margin-top:10px;background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600}
.sgrp{font-size:12px;font-weight:700;color:var(--text-2);margin:16px 6px 6px;text-transform:uppercase;letter-spacing:.03em}
.scard{padding:2px 16px}
.sit{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 0;border:0;border-top:1px solid var(--border);background:none;font-size:15px;color:var(--text);text-align:left;cursor:pointer}
.scard .sit:first-child{border-top:0} .sit.nob{cursor:default}
.sit.danger span:first-child{color:var(--bad)}
.tgl{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--border);position:relative;cursor:pointer;flex:none;transition:background .15s}
.tgl::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl:checked{background:var(--accent)} .tgl:checked::after{left:21px}
.efrow label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-top:4px;cursor:pointer}
.efrow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.efrow input.tgl{width:44px;height:26px;margin:0}
.efrow .lnk,.srcb{background:none;border:0;padding:0;cursor:pointer;font:inherit}
.srcb{display:flex;gap:10px;align-items:center;min-width:0;flex:1;text-align:left;color:var(--text)}
/* ---- v35 redesign components ---- */
.hero{background:linear-gradient(135deg,var(--hero-1),var(--hero-2));color:#fff;border-radius:24px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(26,79,160,.28)}
.hero.over{--hero-1:#d14343;--hero-2:#8f2424;box-shadow:0 10px 30px rgba(160,36,36,.25)}
.hero .ht{display:flex;justify-content:space-between;gap:8px;font-size:13px;opacity:.85}
.hero .hl{font-size:13px;margin-top:14px;opacity:.85}
.hero .hv{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.hero .hp{height:8px;border-radius:5px;background:rgba(255,255,255,.22);margin-top:14px;overflow:hidden}
.hero .hp i{display:block;height:100%;border-radius:5px;background:#fff}
.hero .hpace{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.hero .hpace div{background:rgba(255,255,255,.13);border-radius:14px;padding:8px 12px}
.hero .hpace small{display:block;font-size:11.5px;opacity:.85}
.hero .hpace b{font-size:17px;font-weight:800}
.hero .hnote{font-size:12px;margin-top:8px;font-weight:600}
.hero .hs{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-top:8px;opacity:.9;flex-wrap:wrap}
.qs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (min-width:560px){.qs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.q{background:var(--surface);border:1px solid var(--card-border);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.q .l{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.q .v{font-size:18px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.q .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.acc::-webkit-scrollbar{display:none}
.ac{flex:none;min-width:128px;background:var(--surface-2);border-radius:16px;padding:12px 14px;cursor:pointer;border:0;text-align:left;color:var(--text)}
.ac .ai{font-size:20px}
.ac .an{font-size:12.5px;color:var(--text-2);margin-top:6px;white-space:nowrap}
.ac .av2{font-size:16px;font-weight:700;margin-top:1px}
.ac.add{display:grid;place-items:center;min-width:76px;color:var(--accent);font-weight:700;font-size:22px}
.tc{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.tc:first-of-type{border-top:0}
.tc .ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:19px}
.tc .nm{font-weight:600;font-size:14.5px}
.tc .mt{font-size:12px;color:var(--text-2)}
.tc .am{text-align:right;font-weight:700;white-space:nowrap}
.tc .am .mt{font-weight:500}
.tc .bar{margin-top:6px}
.amtbox{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:14px 0 6px}
.amtbox .cur{font-size:22px;font-weight:700;color:var(--muted)}
.amtbox input{border:0;outline:none;background:transparent;font-size:44px;font-weight:800;letter-spacing:-.02em;width:7ch;text-align:left;padding:0;color:var(--text)}
.amtbox input::placeholder{color:var(--border)}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ct{border:1.5px solid transparent;background:var(--surface-2);border-radius:16px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--text);min-width:0}
.ct .ci{font-size:22px;line-height:1}
.ct .cn{font-size:11.5px;font-weight:600;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ct.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.ct.on .cn{color:var(--accent)}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.datechips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.datechips input[type=date]{width:auto;padding:7px 10px;border-radius:999px;font-size:13px}
.bigsave{width:100%;padding:14px;font-size:16px;border-radius:14px}
.sheettop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.headbtn{border:0;background:transparent;cursor:pointer;color:var(--text-2);font-size:13px;display:flex;align-items:center;padding:6px 8px;border-radius:8px}
.headbtn:hover{background:var(--surface-2)}
</style>

<body>
<header class="top">
  <button class="profbtn" id="profBtn" aria-label="Switch profile"></button>
  <div class="monthnav">
    <button id="mPrev" aria-label="Previous month">‹</button>
    <button id="mLabel" class="mlabel num" aria-label="Show calendar for this month"></button>
    <button id="mNext" aria-label="Next month">›</button>
  </div>
  <button class="headbtn" id="syncBtn" title="Sync"><span class="syncdot" id="syncDot"></span><span id="syncLbl">Sync</span></button>
</header>

<main>
  <section id="tab-home"></section>
  <section id="tab-history" class="hidden"></section>
  <section id="tab-analysis" class="hidden"></section>
  <section id="tab-budget" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
</main>

<button class="fab" id="fab" aria-label="Add expense">+</button>

<nav class="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-tab="analysis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analysis</button>
  <button data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Budget</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>
<div id="tip"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">

<script>
"use strict";
/* ============ Constants ============ */
const CATS = [
  {id:'food', name:'Food', icon:'🍽️', subs:[
    {id:'breakfast', name:'Breakfast', icon:'🍳'},
    {id:'lunch', name:'Lunch', icon:'🍛'},
    {id:'dinner', name:'Dinner', icon:'🍲'},
    {id:'coffee', name:'Coffee / Drinks', icon:'☕'},
    {id:'groceries', name:'Groceries (to cook)', icon:'🥬', group:'other'},
    {id:'delivery', name:'Online delivery', icon:'🛵', group:'other'}]},
  {id:'travel', name:'Travel', icon:'🚌'},
  {id:'temple', name:'Temple', icon:'🛕'},
  {id:'entertainment', name:'Entertainment', icon:'🎬'},
  {id:'medical', name:'Medical', icon:'💊'},
  {id:'laundry', name:'Laundry', icon:'🧺'},
  {id:'shopping', name:'Shopping', icon:'🛍️'},
  {id:'rent', name:'Monthly Rent', icon:'🏠'},
  {id:'ac', name:'AC bill', icon:'❄️'},
  {id:'subs', name:'Subscriptions', icon:'📺'},
  {id:'home', name:'Money sent home', icon:'💸'},
  {id:'misc', name:'Miscellaneous', icon:'🧾', reason:true},
  {id:'lent', name:'Lent to friends', icon:'🤝', friend:true},
  {id:'repaid', name:'Paid back by friend', icon:'💵', income:true, friend:true},
  {id:'borrowed', name:'Borrowed from friend', icon:'🙏', friend:true, owe:true, track:true},   // just a reminder: not spending
  {id:'payback', name:'Paid back to friend', icon:'📤', friend:true, owe:true},                 // counts as spending
  {id:'xfer', name:'Transfer / top-up', icon:'🔁', track:true},   // moves money between accounts: never spending
  {id:'refund', name:'Refunds', icon:'↩️', income:true, reason:true},   // standalone: not linked to any category
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const EXP_CATS = CATS.filter(c=>!c.income && !c.track);
const BUDGET_CATS = EXP_CATS.filter(c=>!c.friend);   // money lent to friends has no budget row
const FIXED = new Set(['rent','ac','subs','home']);    // monthly bills: excluded from "daily living" average
const LIVING_EXCL = new Set([...FIXED, 'misc', 'lent', 'repaid', 'payback', 'borrowed', 'refund']);   // also left out of "daily living": one-off miscellaneous spends
const FIXED_TXT = 'rent, bills, home &amp; misc';
const DAILY_FOOD = ['breakfast','lunch','dinner','coffee'];
// Food budget can be split into three parts; stored as budgets['food:daily'] etc.
const FOOD_PARTS = [
  {id:'daily', name:'Daily food', hint:'Breakfast, lunch, dinner, coffee', icon:'🍛', subs:DAILY_FOOD},
  {id:'groceries', name:'Groceries (to cook)', hint:'Shopping to cook at home', icon:'🥬', subs:['groceries']},
  {id:'delivery', name:'Online delivery', hint:'GrabFood, foodpanda, Deliveroo', icon:'🛵', subs:['delivery']},
];
const KEY_BASE = 'dailyExpenseTracker.v1';
const PKEY = 'dailyExpenseTracker.profiles';
/* Profiles: each person on this device gets their own data store + sync file.
   The first profile ('default') keeps the original storage key, so existing data carries over. */
function loadProfiles(){
  let P=null; try{ P=JSON.parse(localStorage.getItem(PKEY)||'null'); }catch(e){}
  if(!P || !Array.isArray(P.list) || !P.list.length) P={list:[{id:'default', name:'Me', color:0}], current:'default'};
  if(!P.list.some(p=>p.id===P.current)) P.current=P.list[0].id;
  return P;
}
let PROFILES = loadProfiles();
function saveProfiles(){ try{ localStorage.setItem(PKEY, JSON.stringify(PROFILES)); }catch(e){} }
function curProfile(){ return PROFILES.list.find(p=>p.id===PROFILES.current) || PROFILES.list[0]; }
function keyFor(id){ return id==='default' ? KEY_BASE : KEY_BASE+'.'+id; }
function syncKeyFor(id){ return id==='default' ? 'syncHandle' : 'syncHandle:'+id; }
let KEY = keyFor(PROFILES.current);

/* ============ Storage ============ */
function blankDB(){ return {entries:{}, months:{}, rates:{}, settings:{upd:0, theme:'auto'}, meta:{}}; }
function loadDB(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const d = JSON.parse(raw); return Object.assign(blankDB(), d); } }catch(e){}
  return blankDB();
}
let DB = loadDB();
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast('Could not save on this device: '+e.message); } }
function save(){ persist(); scheduleSync(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ============ Dates & money ============ */
const pad = n => String(n).padStart(2,'0');
function dstr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function ymOf(s){ return s.slice(0,7); }
function curYM(){ return ymOf(todayStr()); }
function addMonths(ym,n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function dim(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function ymLabel(ym,short){ const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-SG',{month:short?'short':'long',year:'numeric'}); }
function dayLabel(s){ const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); const t=todayStr(); if(s===t) return 'Today'; const yd=new Date(); yd.setDate(yd.getDate()-1); if(s===dstr(yd)) return 'Yesterday'; return dt.toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short'}); }
function daysElapsed(ym){ const c=curYM(); if(ym<c) return dim(ym); if(ym>c) return 0; return new Date().getDate(); }
function daysLeft(ym){ const c=curYM(); if(ym<c) return 0; if(ym>c) return dim(ym); return dim(ym)-new Date().getDate()+1; }
/* Currencies: each profile picks the currency its expenses are in, and a home currency for "Money sent home". */
const CURRENCIES = {
  SGD:{sym:'S$',name:'Singapore dollar'}, INR:{sym:'₹',name:'Indian rupee',loc:'en-IN'}, USD:{sym:'US$',name:'US dollar'},
  EUR:{sym:'€',name:'Euro'}, GBP:{sym:'£',name:'British pound'}, AUD:{sym:'A$',name:'Australian dollar'},
  CAD:{sym:'C$',name:'Canadian dollar'}, NZD:{sym:'NZ$',name:'New Zealand dollar'}, MYR:{sym:'RM',name:'Malaysian ringgit'},
  AED:{sym:'AED ',name:'UAE dirham'}, SAR:{sym:'SAR ',name:'Saudi riyal'}, QAR:{sym:'QAR ',name:'Qatari riyal'},
  JPY:{sym:'¥',name:'Japanese yen',dec:0}, CNY:{sym:'CN¥',name:'Chinese yuan'}, HKD:{sym:'HK$',name:'Hong Kong dollar'},
  THB:{sym:'฿',name:'Thai baht'}, PHP:{sym:'₱',name:'Philippine peso'}, IDR:{sym:'Rp',name:'Indonesian rupiah',dec:0},
  KRW:{sym:'₩',name:'South Korean won',dec:0}, CHF:{sym:'CHF ',name:'Swiss franc'},
  LKR:{sym:'Rs ',name:'Sri Lankan rupee',loc:'en-IN'}, BDT:{sym:'৳',name:'Bangladeshi taka',loc:'en-IN'},
  NPR:{sym:'Rs ',name:'Nepalese rupee',loc:'en-IN'}, PKR:{sym:'Rs ',name:'Pakistani rupee',loc:'en-IN'},
};
function curInfo(c){ return CURRENCIES[c] || {sym:c+' ',name:c}; }
function money(n, c, dec){ const i=curInfo(c); const d = dec===undefined ? (i.dec??2) : Math.min(dec, i.dec??2);
  return (n<0?'−':'')+i.sym+Math.abs(d===0?Math.round(n||0):(n||0)).toLocaleString(i.loc||'en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function curCode(){ return (typeof curProfile==='function' && curProfile().currency) || 'SGD'; }
function homeCode(){ return (typeof curProfile==='function' && curProfile().homeCur) || 'INR'; }
const sgd  = n => money(n, curCode());        // amount in this profile's currency
const sgd0 = n => money(n, curCode(), 0);     // same, rounded
const inr  = (n, c) => money(n, c || homeCode(), 0);   // amount in the home currency
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round(n*100)/100;

/* ============ Month config (salary + budgets) ============ */
function cfg(ym){
  if(DB.months[ym] && !DB.months[ym].del) return {...DB.months[ym], inherited:false};
  const prev = Object.keys(DB.months).filter(k=>k<ym && !DB.months[k].del).sort().pop();
  if(prev) return {...DB.months[prev], fundsIn:[], fundsAmt:{}, inherited:prev};
  return {salary:0, budgets:{}, inherited:null};
}

/* ============ Emergency fund (cash / NETS / bank) — kept out of the budget unless ticked for a month ============ */
const DEFAULT_FUNDS=[{id:'cash',name:'Cash',icon:'💵',amt:0},{id:'nets',name:'NETS',icon:'💳',amt:0},{id:'dbs',name:'DBS Bank',icon:'🏦',amt:0},{id:'mari',name:'Mari Bank',icon:'🟠',amt:0},{id:'ezlink',name:'EZ-Link card',icon:'🚇',amt:0}];
function allFunds(){ const own=(DB.settings.funds||[]); if(!own.length) return DEFAULT_FUNDS.map(f=>({...f}));
  const have=new Set(own.map(f=>f.id)); return [...own, ...DEFAULT_FUNDS.filter(d=>!have.has(d.id)).map(f=>({...f}))]; }
const fkey = n => { const k=String(n||'').toLowerCase().replace(/[^a-z0-9]/g,''); return k.startsWith('ezlink')? 'ezlink' : k; };
const isEFDefault = f => f.ef ?? (f.id==='cash' || f.id==='dbs');   // starting choice before any month was set: DBS Bank and Cash kept aside
/* Accounts whose money is used for a month's budget (ticked on the Budget tab). Every other account is emergency fund.
   A month without its own choice uses the last choice made. */
function useSet(ym){ ym=(typeof ym==='string'&&ym)||curYM();
  const ks=Object.keys(DB.months).filter(k=>k<=ym && DB.months[k] && !DB.months[k].del && Array.isArray(DB.months[k].useIn)).sort();
  if(ks.length) return new Set(DB.months[ks[ks.length-1]].useIn);
  return new Set(funds().filter(f=>!isEFDefault(f)).map(f=>f.id)); }
const isEF = (f, ym) => !useSet(typeof ym==='string'? ym : undefined).has(f.id);
// Visible accounts. Removed ones are hidden; a duplicate with the same name (e.g. two EZ-Link cards) is left out if it has no balance or payments.
function funds(){
  const list=allFunds().filter(f=>!f.hidden), used=new Set();
  for(const e of Object.values(DB.entries)){ if(e.del) continue; if(e.pay) used.add(e.pay); if(e.from) used.add(e.from); if(e.to) used.add(e.to); }
  const data=f=>(+f.amt||0)!==0 || !!f.at || used.has(f.id), groups={}, drop=new Set();
  list.forEach(f=>(groups[fkey(f.name)]=groups[fkey(f.name)]||[]).push(f));
  for(const g of Object.values(groups)){ if(g.length<2) continue;
    const keep = g.find(data) || g.find(f=>DEFAULT_FUNDS.some(d=>d.id===f.id)) || g[0];
    g.forEach(f=>{ if(f!==keep && !data(f)) drop.add(f.id); }); }
  return list.filter(f=>!drop.has(f.id));
}
function fundsTotal(){ return funds().reduce((a,f)=>a+liveBal(f),0); }
// Money added to a month's budget = the balance at the moment it was ticked (so later spending isn't counted twice)
/* Balance of an account at the end of a day = balance now minus everything logged with it after that day */
function balOn(f, ds){ return r2(liveBal(f) - acctTx(f.id).filter(x=>x.e.date>ds).reduce((a,x)=>a+x.d,0)); }
/* Emergency fund for a month: accounts not ticked for that month (balance now, or at the month's end for past months) */
function efKept(ym){ const cur=ym>=curYM(), end=ym+'-'+pad(dim(ym));
  return r2(funds().filter(f=>isEF(f,ym)).reduce((a,f)=>a+(cur? liveBal(f) : balOn(f,end)),0)); }
/* Savings used in a month's budget = savings brought into the month (opening balance) − what stays in the emergency fund.
   Negative = some of this month's money was put aside. With every payment logged, Money left this month = balance of the ticked accounts. */
function fundsIncluded(ym){ const op=openingOf(ym); if(op===null) return 0; return r2(op - efKept(ym)); }
/* ============ Accounts / payment methods: balance = entered balance ± everything logged after it was entered ============ */
const MONEY_IN = new Set(['refund','repaid','borrowed']);
const PAYKEY='dailyExpenseTracker.lastPay';
function fundName(id){ const f=allFunds().find(x=>x.id===id); return f? f.name : ''; }
function lastPay(){ try{ const v=localStorage.getItem(PAYKEY)||''; return funds().some(f=>f.id===v)? v : ''; }catch(e){ return ''; } }
function setLastPay(v){ try{ if(v) localStorage.setItem(PAYKEY,v); }catch(e){} }
function acctTx(id){
  const f=funds().find(x=>x.id===id), at=f?.at||0, out=[];
  for(const e of Object.values(DB.entries)){ if(e.del) continue; let d=0;
    if(e.cat==='xfer'){ if(e.to===id) d+=e.amt; if(e.from===id) d-=e.amt; }
    else if(e.pay===id) d = MONEY_IN.has(e.cat)? e.amt : -e.amt;
    if(d) out.push({e, d, after:(e.cr||e.upd||0)>at}); }
  return out.sort((a,b)=>b.e.date.localeCompare(a.e.date)||(b.e.cr||0)-(a.e.cr||0));
}
function liveBal(f){ return r2((+f.amt||0) + acctTx(f.id).filter(x=>x.after).reduce((a,x)=>a+x.d,0)); }

function setMonthFlag(ym, obj){

/* Money in and out of your accounts in a month (transfers between your own accounts don't count) */
function flows(ym, lite){
  const st=stats(ym, lite); let borrowed=0;
  for(const e of Object.values(DB.entries)) if(!e.del && e.cat==='borrowed' && e.date.startsWith(ym)) borrowed+=e.amt;
  const salary=st.salary, refunds=st.refund, repaid=st.by.repaid||0, spending=r2(st.gross);
  return {st, salary, refunds, repaid, borrowed:r2(borrowed), spending, net:r2(salary+refunds+repaid+borrowed-spending)};

function anyBalanceSet(){ return funds().some(f=>f.at); }

function openingOf(ym, depth=0){

function statementData(ym){
  const fl=flows(ym), op=openingOf(ym), cur=ym===curYM();
  const expected = op===null? null : r2(op+fl.net);
  const actual = cur? actualTotal() : null;
  const m=DB.months[ym]||{}, since=m.openingAt||0;
  const noAcct = cur? Object.values(DB.entries).filter(e=>!e.del && e.date.startsWith(ym) && (e.cr||0)>since && !e.pay && e.cat!=='xfer' && (CAT[e.cat] && (!CAT[e.cat].track || e.cat==='borrowed'))).length : 0;

}

  const empty=f=>!(+f.amt) && !used.has(f.id);
  const seen={}; let ch=false;
  const list=own.map(f=>{ if(f.hidden) return f; const k=fkey(f.name);
    const junk = empty(f) && (/^\d+$/.test(String(f.name).trim()) || k==='lastmonthsavings' || (k==='ezlink' && f.id!=='ezlink'));
    if(junk){ ch=true; return {...f,hidden:true}; } return f; });
  if(ch){ DB.settings.funds=list; DB.settings.upd=Date.now(); }

function cleanFundsIn(noSave){
  const ok=new Set(funds().filter(isEF).map(f=>f.id)); let ch=false;
  for(const [ym,m] of Object.entries(DB.months)){ if(!m || !Array.isArray(m.fundsIn)) continue;

/* ============ Calculations ============ */
function monthEntries(ym){ return Object.values(DB.entries).filter(e=>!e.del && e.date.startsWith(ym) && !CAT[e.cat]?.track); }   // borrowed money is only a reminder, never spending
function stats(ym, lite){
  const es = monthEntries(ym);
  const by = {}; CATS.forEach(c=>by[c.id]=0);
  const sub = Object.fromEntries(CAT.food.subs.map(s=>[s.id,0]));
  const daily = {}; const dailyLiving = {};
  let inrHome = 0;
  for(const e of es){
    by[e.cat] = (by[e.cat]||0) + e.amt;
    if(e.cat==='food' && e.sub) sub[e.sub]=(sub[e.sub]||0)+e.amt;
    if(e.cat==='home' && (e.homeCur||'INR')===homeCode()) inrHome += e.inr||0;
    const sign = CAT[e.cat]?.income ? -1 : 1;
    if(e.cat==='refund') continue;   // refunds don't reduce any day's spending (still taken off the month total)
    daily[e.date]=(daily[e.date]||0)+sign*e.amt;
    if(!LIVING_EXCL.has(e.cat)) dailyLiving[e.date]=(dailyLiving[e.date]||0)+sign*e.amt;
  }
  const refund = by.refund||0;
  const refundFor = {};
  const net = {...by}; delete net.refund; delete net.repaid;
  net.lent = (by.lent||0) - (by.repaid||0);
  const gross = EXP_CATS.reduce((s,c)=>s+by[c.id],0);
  const total = gross - refund - (by.repaid||0);
  const living = total - [...LIVING_EXCL].reduce((s,k)=>s+(CAT[k]?.income ? -(by[k]||0) : (by[k]||0)),0);
  const c = cfg(ym);
  const days = daysElapsed(ym);
  const budgetTotal = EXP_CATS.reduce((s,k)=>s+(+c.budgets[k.id]||0),0);
  let budgetLeft = 0;
  EXP_CATS.forEach(k=>{ const b=+c.budgets[k.id]||0; if(b>0) budgetLeft += b - net[k.id]; });
  const dailyFood = DAILY_FOOD.reduce((a,k)=>a+sub[k],0);
  const X = lite? 0 : fundsIncluded(ym);
  return {es, by, net, sub, dailyFood, refund, refundFor, gross, total, living, inrHome, daily, dailyLiving, cfg:c, salary:+c.salary||0,
          days, left:daysLeft(ym), dim:dim(ym), budgetTotal, budgetLeft,
          extra:X, income:(+c.salary||0)+X,
          saved:(+c.salary||0) + X - total,
          avg: days? (total+refund)/days : 0, avgLiving: days? living/days : 0};
}
/* Spending (not refunds, transfers or money coming back) on one day, with the number of entries */
function daySpend(ds){ let s=0,n=0; for(const e of Object.values(DB.entries)){ if(e.del||e.date!==ds) continue; const k=CAT[e.cat]; if(!k||k.income||k.track) continue; s+=e.amt; n++; } return {s:r2(s),n}; }
/* Daily-living pace: what's left of the living budgets (food, travel, …) spread over the days left */
const LIVING_CATS = () => BUDGET_CATS.filter(k=>!LIVING_EXCL.has(k.id));
function livingPace(st){
  const cats=LIVING_CATS(), budget=cats.reduce((a,k)=>a+(+st.cfg.budgets[k.id]||0),0), spent=r2(cats.reduce((a,k)=>a+(st.net[k.id]||0),0));
  return {budget, spent, canDay: budget>0 && st.left>0 ? (budget-spent)/st.left : null};
}
function status(spent,budget,cat){
  if(!budget) return null;
  const p = spent/budget;
  if(FIXED.has(cat)) return p>1.005?'bad':'good';   // rent / money home: paying the planned amount is on track
  if(p>1) return 'bad'; if(p>=0.85) return 'warn'; return 'good';
}

/* ============ Exchange rate (profile currency -> home currency) ============ */
async function fetchRate(date){
  const base=curCode(), to=homeCode(); if(base===to) return 1;
  const today = todayStr(), key = date+'|'+base+to;
  if(date!==today && DB.rates[key]) return DB.rates[key];
  const tag = date>=today ? 'latest' : date;
  const urls = [
    `https://api.frankfurter.dev/v1/${tag}?base=${base}&symbols=${to}`,
    `https://api.frankfurter.app/${tag}?from=${base}&to=${to}`
  ];
  for(const u of urls){
    try{ const r = await fetch(u,{cache:'no-store'}); if(r.ok){ const j = await r.json(); const v = j?.rates?.[to]; if(v){ if(date<today){ DB.rates[key]=v; persist(); } DB.meta.lastRate=v; DB.meta.lastRatePair=base+to; return v; } } }catch(e){}
  }
  try{ const r = await fetch('https://open.er-api.com/v6/latest/'+base); if(r.ok){ const j=await r.json(); const v=j?.rates?.[to]; if(v){ DB.meta.lastRate=v; DB.meta.lastRatePair=base+to; return v; } } }catch(e){}
  return null;
}

  const total = es.reduce((s,e)=>s+signed(e),0);

      <select class="in" id="histCat" style="flex:1;min-width:160px">${opts}</select></div>
    <div class="small muted" style="margin-top:8px">${es.length} entr${es.length===1?'y':'ies'} · total <b class="num" style="color:var(--text)">${sgd(total)}</b></div></div>`;
  if(cal) h += calendarView(es, days, signed);
  else {
    const keys = Object.keys(days).sort().reverse();

  th.querySelectorAll('.cal .d[data-date]').forEach(c=>c.onclick=()=>{ S.selDay=c.dataset.date; renderHistory(); });
  bindTips($('#tab-history'));
}
function dayBlock(d, list, signed){
  list = list.slice().sort((a,b)=>(b.cr||0)-(a.cr||0));
  const dt = list.reduce((s,e)=>s+(e.cat==='refund'&&S.histCat!=='refund'?0:signed(e)),0);   // refunds aren't counted in day totals
  return `<div class="day"><div class="dh"><span>${dayLabel(d)}</span><span class="num">${sgd(dt)}</span></div><div class="list">${list.map(entRow).join('')}</div></div>`;
}
function calendarView(es, days, signed, cat=S.histCat){
  const ym=S.ym, n=dim(ym), [y,m]=ym.split('-').map(Number);
  const excl = cat==='all' && S.calMode!=='all';        // leave out monthly bills so they don't swamp the shading
  const val = {};
  for(const e of es){ if((excl && LIVING_EXCL.has(e.cat)) || (e.cat==='refund' && cat!=='refund')) continue; val[e.date]=(val[e.date]||0)+signed(e); }
  const vals = Object.values(val); const mx = Math.max(1,...vals);
  const today = todayStr();
  const lead = (new Date(y,m-1,1).getDay()+6)%7;                // weeks start on Monday
  if(!S.selDay || !S.selDay.startsWith(ym)) S.selDay = ymOf(today)===ym ? today : null;
  let h = `<div class="card">`;
  if(cat==='all') h += `<div class="chips" style="margin-bottom:10px"><button class="chip ${excl?'on':''}" data-cm="living">Daily living</button><button class="chip ${excl?'':'on'}" data-cm="all">Everything</button></div>`;
  h += `<div class="cal">` + ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<lead;i++) h += `<div></div>`;
  let weekTot=0; const weeks=[];
  for(let d=1; d<=n; d++){
    const date = ym+'-'+pad(d), v = val[date]||0, has = !!days[date];
    const pct = v>0 ? Math.round(12 + 68*v/mx) : 0;
    const dark = pct>=48;
    const style = v>0 ? `background:color-mix(in srgb, var(--series-1) ${pct}%, var(--surface));${dark?'color:#fff;':''}` : '';
    const cls = ['d', date===today?'today':'', date===S.selDay?'sel':'', date>today?'future':''].join(' ');
    const amt = v ? (Math.abs(v)>=1000 ? (v/1000).toFixed(1)+'k' : Math.abs(v)>=100 ? Math.round(v) : v.toFixed(v%1?1:0)) : (has?'0':'');
    h += `<div class="${cls}" data-date="${date}" style="${style}" data-tip="${esc(dayLabel(date))}: ${sgd(v)}${has?' · '+days[date].length+' entr'+(days[date].length===1?'y':'ies'):''}"><span class="dn">${d}</span><span class="da num">${amt}</span></div>`;
    weekTot += v;
    if((lead+d)%7===0 || d===n){ weeks.push(weekTot); weekTot=0; }
  }
  h += `</div>`;
  // legend + month facts
  const counted = Object.keys(val).length ? vals : [];
  const elapsed = daysElapsed(ym);
  const noSpend = elapsed ? Array.from({length:elapsed},(_,i)=>ym+'-'+pad(i+1)).filter(d=>!(val[d]>0)).length : 0;
  const top = Object.entries(val).sort((a,b)=>b[1]-a[1])[0];
  const sum = counted.reduce((a,b)=>a+b,0);
  h += `<div class="calleg"><span>${sgd0(0)}</span><i style="background:linear-gradient(90deg,color-mix(in srgb,var(--series-1) 12%,var(--surface)),var(--series-1))"></i><span>${sgd0(mx)}</span><span class="muted" style="margin-left:auto">Amounts in ${curCode()}${excl?' · excl. '+FIXED_TXT:''}</span></div>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="l">Total</div><div class="v num">${sgd(sum)}</div></div>
      <div class="kpi"><div class="l">Avg per day</div><div class="v num">${sgd(elapsed?sum/elapsed:0)}</div><div class="s">over ${elapsed} days</div></div>
      <div class="kpi"><div class="l">Highest day</div><div class="v num">${top?sgd(top[1]):'–'}</div><div class="s">${top?dayLabel(top[0]):'&nbsp;'}</div></div>
      <div class="kpi"><div class="l">No-spend days</div><div class="v num">${noSpend}</div><div class="s">of ${elapsed}</div></div>
    </div>
    <div class="small muted" style="margin-top:10px">Weekly totals: ${weeks.map((w,i)=>`<span class="num" style="color:var(--text)">W${i+1} ${sgd0(w)}</span>`).join(' · ')}</div></div>`;
  // selected day detail
  if(S.selDay){
    const list = days[S.selDay]||[];
    h += list.length ? dayBlock(S.selDay, list, signed) : `<div class="day"><div class="dh"><span>${dayLabel(S.selDay)}</span><span class="num">${sgd(0)}</span></div><div class="list"><div class="empty">No expenses on this day.</div></div></div>`;
    h += `<div class="btns" style="margin-bottom:12px"><button class="btn" onclick="openEntry(null,'${S.selDay}')">+ Add expense on ${dayLabel(S.selDay)}</button></div>`;
  } else h += `<div class="small muted" style="padding:0 4px">Tap a day to see its expenses.</div>`;
  return h;
}

function groupTotals(st){ const inG=new Set(GROUPS.flatMap(g=>g.cats)); return GROUPS.map(g=>{ let v=g.cats.reduce((a,k)=>a+(st.net[k]||0),0);
  if(g.id==='misc') v+=EXP_CATS.filter(k=>!inG.has(k.id)).reduce((a,k)=>a+(st.net[k.id]||0),0); return {...g, v}; }); }
/* ============ Month summary: donut of where the salary went + savings ============ */
function firstYm(){ const ks=[...Object.values(DB.entries).filter(e=>!e.del).map(e=>e.date.slice(0,7)), ...Object.keys(DB.months).filter(k=>!DB.months[k].del)]; return ks.length? ks.sort()[0] : null; }
function savedBefore(ym){ const f=firstYm(); let m=f, sum=0, n=0; if(!f) return {sum,n}; while(m<ym){ const x=stats(m); if(x.salary){ sum+=x.saved; n++; } m=addMonths(m,1); } return {sum,n}; }
function donutSvg(parts, center1, center2){
  const tot=parts.reduce((a,p)=>a+p.v,0); if(!tot) return '';
  const R=80, r=52, C=85; let a0=-Math.PI/2, out='';
  const pt=(a,rad)=>[C+rad*Math.cos(a), C+rad*Math.sin(a)];
  for(const p of parts){
    const frac=p.v/tot, a1=a0+frac*2*Math.PI, big=frac>0.5?1:0;
    let d;
    if(frac>=0.9999){ d=`M${C-R},${C} a${R},${R} 0 1,0 ${2*R},0 a${R},${R} 0 1,0 ${-2*R},0 M${C-r},${C} a${r},${r} 0 1,1 ${2*r},0 a${r},${r} 0 1,1 ${-2*r},0Z`; }
    else { const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r);
      d=`M${x0},${y0} A${R},${R} 0 ${big},1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big},0 ${x3},${y3}Z`; }
    out+=`<path d="${d}" fill="${p.c}" fill-rule="evenodd" stroke="var(--surface)" stroke-width="2" data-tip="<b>${esc(p.name)}</b><br>${sgd(p.v)} · ${Math.round(frac*100)}%"/>`;
    a0=a1;
  }
  return `<svg viewBox="0 0 170 170" role="img" aria-label="Where the money went">${out}<text class="c1" x="85" y="86" text-anchor="middle">${center1}</text><text class="c2" x="85" y="103" text-anchor="middle">${center2}</text></svg>`;
}
function monthSummaryCard(ym, heading){
  const st=stats(ym);
  const parts=groupTotals(st).filter(g=>g.v>0.004).map(g=>({name:g.icon+' '+g.name, v:g.v, c:g.c}));
  const done = ym < ymOf(todayStr());            // savings are final only once the month is over
  const hasSal=st.salary>0, saved=st.saved;
  if(done && hasSal && saved>0) parts.push({name:'💰 Saved', v:saved, c:'var(--series-3)'});
  const base=parts.reduce((a,p)=>a+p.v,0);
  const prev=savedBefore(ym);
  let h=`<div class="card"><h2>${heading} · ${ymLabel(ym)}</h2>`;
  if(!base){ h+=`<div class="muted">No expenses recorded for ${ymLabel(ym)} yet.</div></div>`; return h; }
  h+=`<div class="msum">${donutSvg(parts, done&&hasSal?sgd0(st.salary):sgd0(st.total), done&&hasSal?'salary':(done?'spent':'spent so far'))}<div class="plist">`+
     parts.map(p=>`<div data-tip="<b>${esc(p.name)}</b><br>${sgd(p.v)}"><i style="--c:${p.c}"></i><span>${esc(p.name)}</span><span class="num">${sgd(p.v)}</span><span class="pc">${Math.round(p.v/base*100)}%</span></div>`).join('')+
     (done && hasSal && saved<0?`<div><i style="--c:var(--bad)"></i><span>Overspent</span><span class="num neg">${sgd(-saved)}</span><span class="pc"></span></div>`:'')+
     `</div></div>`;
  if(hasSal && !done){
    h+=`<div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="l">Saved in previous months</div><div class="v num ${prev.sum<0?'neg':''}">${sgd(prev.sum)}</div><div class="s">${prev.n?prev.n+' month'+(prev.n===1?'':'s'):'no earlier months'}</div></div>
    </div><div class="small muted" style="margin-top:8px">This month’s saving is added to the chart after ${ymLabel(ym)} ends.</div>`;
  } else if(hasSal){
    h+=`<div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="l">Saved this month</div><div class="v num ${saved<0?'neg':'pos'}">${sgd(saved)}</div><div class="s">${Math.round(saved/st.salary*100)}% of salary</div></div>
      <div class="kpi"><div class="l">Saved in previous months</div><div class="v num ${prev.sum<0?'neg':''}">${sgd(prev.sum)}</div><div class="s">${prev.n?prev.n+' month'+(prev.n===1?'':'s'):'no earlier months'}</div></div>
      <div class="kpi"><div class="l">Total saved so far</div><div class="v num ${prev.sum+saved<0?'neg':'pos'}">${sgd(prev.sum+saved)}</div><div class="s">up to ${ymLabel(ym,true)}</div></div>
    </div>`;
  } else h+=`<div class="small muted" style="margin-top:10px">Set your salary in the Budget tab to see savings.</div>`;
  return h+`</div>`;
}
function monthEndCard(){

/* Daily-living spending so far (filled) against an even pace to the living budget (line) */
function paceChart(st){
  const pace=livingPace(st), n=st.dim, today=st.days;
  if(!pace.budget) return '<div class="muted small">Set budgets for food, travel and other daily costs to see your pace.</div>';
  const W=chartW(), H=150, L=40, Rr=8, T=10, Bt=24, iw=W-L-Rr, ih=H-T-Bt;
  let cum=0; const pts=[[0,0]];
  for(let d=1; d<=today; d++){ const ds=S.ym+'-'+pad(d); cum+=st.dailyLiving[ds]||0; pts.push([d,cum]); }
  const mx=niceMax(Math.max(pace.budget,cum)), x=d=>L+d/n*iw, y=v=>T+ih-(v/mx)*ih;
  const area='M'+x(0)+','+y(0)+' '+pts.map(p=>'L'+x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ')+' L'+x(today)+','+y(0)+'Z';
  const line=pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ');
  const expNow=pace.budget*today/n, ok=cum<=expNow;
  let g=''; const tk=ticks(mx); for(let i=0;i<=tk;i++){ const v=mx*i/tk; g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${sgd0(v).replace(/^[^0-9]+/,'')}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Living spending ${sgd0(cum)} so far against a budget pace of ${sgd0(expNow)}">${g}
    <path d="M${x(0)},${y(0)} L${x(n)},${y(pace.budget)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <path d="${area}" fill="var(--series-1)" opacity=".16"/><path d="${line}" stroke="var(--series-1)" stroke-width="2.5" fill="none"/>
    <circle cx="${x(today)}" cy="${y(cum)}" r="4" fill="var(--series-1)"/>
    <text x="${L}" y="${H-6}">1</text><text x="${x(today)}" y="${H-6}" text-anchor="middle">today</text><text x="${W-Rr}" y="${H-6}" text-anchor="end">${n}</text></svg>
    <div class="small" style="margin-top:6px">Spent <b class="num">${sgd(cum)}</b> on daily living by day ${today}. An even pace to your ${sgd0(pace.budget)} living budget would be <b class="num">${sgd(expNow)}</b> — <b class="${ok?'pos':'neg'}">${ok?sgd(expNow-cum)+' under':sgd(cum-expNow)+' over'}</b>.</div>`;
}

function deltaTxt(a,b){ if(!b) return '&nbsp;'; const d=(a-b)/b*100; return (d>=0?'▲ ':'▼ ')+Math.abs(Math.round(d))+'% vs last month'; }
function insights(st,prev){
  const out=[];
  if(!st.es.length) return out;
  const top = BUDGET_CATS.map(k=>({k,v:st.net[k.id]})).filter(x=>!LIVING_EXCL.has(x.k.id)).sort((a,b)=>b.v-a.v)[0];
  if(top && top.v>0) out.push(`Biggest day-to-day category: <b>${top.k.icon} ${top.k.name}</b> at ${sgd(top.v)} (${sgd(st.days?top.v/st.days:0)}/day).`);
  const foodTop = CAT.food.subs.map(s=>({s,v:st.sub[s.id]})).sort((a,b)=>b.v-a.v)[0];
  if(foodTop.v>0) out.push(`Within food, <b>${foodTop.s.name}</b> costs the most: ${sgd(foodTop.v)} this month.`);
  if(st.salary && st.budgetTotal>st.salary) out.push(`<span class="pill bad">Plan</span> Budgets total <b>${sgd0(st.budgetTotal)}</b>, which is <b>${sgd0(st.budgetTotal-st.salary)}</b> more than your salary.`);
  const over = EXP_CATS.filter(k=>{const b=+st.cfg.budgets[k.id]||0; return b && st.net[k.id]>b;});
  if(over.length) out.push(`<span class="pill bad">Over budget</span> ${over.map(k=>k.name).join(', ')}.`);
  const near = EXP_CATS.filter(k=>status(st.net[k.id],+st.cfg.budgets[k.id]||0,k.id)==='warn');
  if(near.length) out.push(`<span class="pill warn">Near limit</span> ${near.map(k=>k.name).join(', ')} (85%+ used).`);
  if(st.left>0 && st.days>0){
    const proj = st.total + st.avgLiving*(st.left-1);
    out.push(`At your current daily-living pace, you'll spend about <b>${sgd0(proj)}</b> this month${st.salary?` and save about <b class="${st.salary-proj<0?'neg':'pos'}">${sgd0(st.salary-proj)}</b>`:''}.`);
  }
  if(prev.total>0 && prev.days){
    const d = st.avgLiving - prev.avgLiving;
    if(Math.abs(d)>=0.5) out.push(`Daily living average is <b>${sgd(Math.abs(d))} ${d>0?'higher':'lower'}</b> than last month (${sgd(prev.avgLiving)}/day).`);
  }
  return out;
}

function chartW(){ const w=(document.querySelector('main')?.clientWidth||400)-62; return Math.max(300,Math.min(700,w)); }
function ticks(mx){ const lead=Math.round(mx/Math.pow(10,Math.floor(Math.log10(mx)))); return lead===2?4:5; }
function niceMax(v){ if(v<=0) return 10; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function dailyChart(st){
  const src = S.dailyMode==='living'? st.dailyLiving : st.daily;
  const n = st.dim, W=chartW(), H=200, L=38, R=8, T=10, B=22;
  const vals = Array.from({length:n},(_,i)=>src[S.ym+'-'+pad(i+1)]||0);
  const mx = niceMax(Math.max(...vals,1));
  const cw = (W-L-R)/n, bw = Math.max(2, cw-2);
  const y = v => T + (H-T-B)*(1-Math.max(0,v)/mx);
  const avg = S.dailyMode==='living'? st.avgLiving : st.avg;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spending bar chart">`;
  const tk=ticks(mx); for(let i=0;i<=tk;i++){ const v=mx*i/tk, yy=y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${v>=1000?(v/1000)+'k':Math.round(v)}</text>`; }
  vals.forEach((v,i)=>{
    const x=L+i*cw+1, yy=y(v), hh=(H-B)-yy;
    const date = S.ym+'-'+pad(i+1);
    const rr=Math.min(4,hh,bw/2);
    if(v>0) s+=`<path d="M${x},${H-B} V${yy+rr} q0,-${rr} ${rr},-${rr} H${x+bw-rr} q${rr},0 ${rr},${rr} V${H-B}Z" fill="var(--series-1)"/>`;
    s+=`<rect x="${L+i*cw}" y="${T}" width="${cw}" height="${H-T-B}" fill="transparent" data-tip="${esc(dayLabel(date))}: ${sgd(v)}"/>`;
    if((i+1)%5===0||i===0) s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${i+1}</text>`;
  });
  if(avg>0){ const ya=y(avg); s+=`<line x1="${L}" x2="${W-R}" y1="${ya}" y2="${ya}" stroke="var(--text-2)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-R}" y="${ya-4}" text-anchor="end" style="fill:var(--text-2)">avg ${sgd(avg)}</text>`; }
  s += `<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--muted)"/></svg>`;
  return s;
}
function trendChart(){
  const months = Array.from({length:6},(_,i)=>addMonths(S.ym,i-5));
  const data = months.map(m=>{ const s=stats(m); return {m, spent:s.total, saved: s.salary? s.saved : 0, salary:s.salary, home:s.inrHome}; });
  const W=chartW(),H=210,L=44,R=8,T=10,B=24;
  const mx = niceMax(Math.max(1,...data.map(d=>Math.max(d.spent,d.saved))));
  const mn = Math.min(0,...data.map(d=>d.saved)); const lo = mn<0? -niceMax(-mn):0;
  const y = v => T + (H-T-B)*(mx-v)/(mx-lo);
  const gw=(W-L-R)/6, bw=Math.min(28,(gw-14)/2);
  let s=`<div class="legend"><span style="--c:var(--series-1)">Spent</span><span style="--c:var(--series-3)">Saved</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spent vs saved per month">`;
  for(let i=0;i<=4;i++){ const v=lo+(mx-lo)*i/4, yy=y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${Math.abs(v)>=1000?(Math.round(v/100)/10)+'k':Math.round(v)}</text>`; }
  const bar=(x,v,col)=>{ if(!v) return ''; const y0=y(0), y1=y(v); const top=Math.min(y0,y1), h=Math.abs(y1-y0); const rr=Math.min(4,h);
    return v>0 ? `<path d="M${x},${y0} V${top+rr} q0,-${rr} ${rr},-${rr} H${x+bw-rr} q${rr},0 ${rr},${rr} V${y0}Z" fill="${col}"/>` : `<path d="M${x},${y0} V${top+h-rr} q0,${rr} ${rr},${rr} H${x+bw-rr} q${rr},0 ${rr},-${rr} V${y0}Z" fill="${col}"/>`; };
  data.forEach((d,i)=>{
    const gx=L+i*gw+(gw-2*bw-2)/2;
    s+=bar(gx,d.spent,'var(--series-1)')+bar(gx+bw+2,d.saved,'var(--series-3)');
    s+=`<rect x="${L+i*gw}" y="${T}" width="${gw}" height="${H-T-B}" fill="transparent" data-tip="<b>${ymLabel(d.m,true)}</b><br>Spent ${sgd(d.spent)}<br>Saved ${d.salary?sgd(d.saved):'– (no salary set)'}"/>`;
    s+=`<text x="${L+i*gw+gw/2}" y="${H-6}" text-anchor="middle" ${d.m===S.ym?'style="fill:var(--text);font-weight:600"':''}>${ymLabel(d.m,true).split(' ')[0]}</text>`;
  });
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/></svg>`;
  s+=`<div class="tablewrap" style="margin-top:8px"><table class="t"><thead><tr><th>Month</th><th>Salary</th><th>Spent</th><th>Saved</th><th>Rate</th><th>Sent home</th></tr></thead><tbody>`+
    data.slice().reverse().map(d=>`<tr><td>${ymLabel(d.m,true)}</td><td class="num">${d.salary?sgd0(d.salary):'–'}</td><td class="num">${sgd0(d.spent)}</td><td class="num ${d.saved<0?'neg':''}">${d.salary?sgd0(d.saved):'–'}</td><td class="num">${d.salary?Math.round(d.saved/d.salary*100)+'%':'–'}</td><td class="num">${d.home?inr(d.home):'–'}</td></tr>`).join('')+`</tbody></table></div>`;
  return s;
}

function renderBudget(){

  const sum = cats => ({b:cats.reduce((a,k)=>a+(+B[k.id]||0),0), s:cats.reduce((a,k)=>a+(st.net[k.id]||0),0)});
  const L=sum(living), Bi=sum(bills);

/* ============ Friends: money lent / borrowed and paid back (stored as entries so it syncs) ============ */
const FTX = {
  lend:{A:'lent', B:'repaid', icon:'🤝', title:'Friends owe you', owes:'owes you', times:'lent', empty:'Lent money to a friend? Tap to keep track',
    none:'Nobody owes you anything right now.', add:'+ Lent money', addB:'+ Got money back', more:'+ Lend more', backBtn:'Got money back',
    kA:'Owes you', kT:'Total lent', note:'Lending counts as spending until it’s paid back.',
    fA:'🤝 Money lent', fB:'💵 Money paid back', amtA:'Amount given', amtB:'Amount received', iA:'Lent', iB:'Paid back',
    tA:(n,a)=>`Lent ${a} to ${n}`, tB:(n,a)=>`${n} paid back ${a}`},
  owe:{A:'borrowed', B:'payback', icon:'🙏', title:'You owe friends', owes:'you owe', times:'borrowed', empty:'Borrowed from a friend? Tap to keep track',
    none:'You don’t owe anyone right now.', add:'+ Borrowed money', addB:'+ Paid back', more:'+ Borrow more', backBtn:'Pay back',
    kA:'You owe', kT:'Total borrowed', note:'Borrowing isn’t counted as spending. Paying it back is.',
    fA:'🙏 Money borrowed', fB:'📤 Paid back to friend', amtA:'Amount borrowed', amtB:'Amount paid', iA:'Borrowed', iB:'Paid back',
    tA:(n,a)=>`Borrowed ${a} from ${n}`, tB:(n,a)=>`Paid ${a} back to ${n}`}};
const fdir = cat => CAT[cat]?.owe ? 'owe' : 'lend';
function friendLedger(dir='lend'){
  const T=FTX[dir], map={};
  for(const e of Object.values(DB.entries)){ if(e.del || (e.cat!==T.A && e.cat!==T.B)) continue;
    const n=(e.friend||'Friend').trim(), k=n.toLowerCase(); const f=map[k]||(map[k]={name:n, lent:0, back:0, items:[]});
    if(e.cat===T.A) f.lent+=e.amt; else f.back+=e.amt; f.items.push(e); }
  return Object.values(map).map(f=>({...f, owed:r2(f.lent-f.back), items:f.items.sort((a,b)=>b.date.localeCompare(a.date)||(b.cr||0)-(a.cr||0))}))
    .sort((a,b)=>b.owed-a.owed || a.name.localeCompare(b.name));
}
function splitCard(){
  const row=dir=>{ const T=FTX[dir], open=friendLedger(dir).filter(f=>f.owed>0.004), tot=open.reduce((a,f)=>a+f.owed,0);
    return `<div class="ent fcard" data-fdir="${dir}" onclick="friendsSheet('${dir}')"><div class="ic">${T.icon}</div>
      <div class="t"><div>${T.title}</div><div>${open.length? open.slice(0,3).map(f=>esc(f.name)+' '+sgd0(f.owed)).join(' · ')+(open.length>3?' · +'+(open.length-3)+' more':'') : T.empty}</div></div>
      <div class="num" style="font-weight:700">${sgd(tot)}</div></div>`; };
  return `<div class="card"><h2>🤝 Split with friends</h2><div class="list" style="border:0">${row('lend')}${row('owe')}</div></div>`;
}
function friendsCard(dir='lend'){
  const T=FTX[dir], L=friendLedger(dir), open=L.filter(f=>f.owed>0.004), tot=open.reduce((a,f)=>a+f.owed,0);
  return `<div class="card fcard" data-fdir="${dir}" onclick="friendsSheet('${dir}')" style="cursor:pointer"><div class="row" style="justify-content:space-between;gap:10px">

    <div class="small muted">${open.length? open.slice(0,3).map(f=>esc(f.name)+' '+sgd0(f.owed)).join(' · ')+(open.length>3?' · +'+(open.length-3)+' more':'') : T.empty}</div></div></div>

async function loadRate(){
  const d=$('#eDate').value, note=$('#rateNote'), re=$('#eRate');
  if(note) note.textContent=`Fetching ${curCode()}→${homeCode()} rate for ${d}…`;
  const r = await fetchRate(d);
  if(!$('#eRate') || E.cat!=='home') return;
  if(r){ re.value=r.toFixed(4); E.rate=r; note.textContent=`Rate for ${d>=todayStr()?'today (live)':d}: 1 ${curCode()} = ${curInfo(homeCode()).sym.trim()}${r.toFixed(2)}. You can edit it to match your transfer.`;
         if($('#eAmt').value) $('#eAmt').oninput(); else if($('#eInr').value) $('#eInr').oninput(); }
  else { if(DB.meta.lastRate && !re.value) re.value=DB.meta.lastRate.toFixed(4); note.textContent='Could not fetch a rate (offline?). Enter the rate your transfer used.'; }
}
function readSheet(){
  if(!$('#eDate')) return;
  E.date=$('#eDate').value||todayStr(); E.amt=$('#eAmt').value; E.note=$('#eNote').value;
  if($('#eInr')){ E.inr=$('#eInr').value; E.rate=$('#eRate').value; }
}
function commitEntry(more){
  readSheet();
  const amt = r2(parseFloat(E.amt));
  if(!E.cat || !CAT[E.cat]){ toast('Choose a category'); return; }
  if(E.cat==='food' && !E.sub){ toast('Choose breakfast, lunch, dinner, coffee, groceries or delivery'); return; }
  if(!(amt>0)){ toast('Enter an amount'); $('#eAmt').focus(); return; }
  if(CAT[E.cat].reason && !(E.note||'').trim()){ toast(E.cat==='refund'?'Add a reason for this refund':'Add a reason for this miscellaneous expense'); $('#eNote').focus(); return; }
  const now=Date.now();
  const rec = {id:E.id||uid(), date:E.date, cat:E.cat, amt, note:(E.note||'').trim(), upd:now, cr:E.cr||now};
  if(E.cat==='food') rec.sub=E.sub;
  if(E.pay){ rec.pay=E.pay; setLastPay(E.pay); }
  rec.cur = curCode();
  if(E.cat==='home'){ if(curCode()===homeCode()){ rec.rate=1; rec.inr=amt; } else { rec.rate=+E.rate||null; rec.inr= +E.inr || (rec.rate? Math.round(amt*rec.rate):null); } rec.homeCur=homeCode(); }
  DB.entries[rec.id]=rec; S.lastCat=E.cat;
  save();
  const m=ymOf(rec.date); if(m!==S.ym) S.ym=m;
  toast(`Saved ${sgd(amt)} · ${CAT[rec.cat].name}`);
  render();
  if(more){ const keep={cat:E.cat,sub:E.sub,date:E.date,back:E.back,pay:E.pay}; E={id:null,...keep,amt:'',inr:'',rate:E.cat==='home'?E.rate:'',note:''}; drawSheet(); } else closeSheet();
}

/* ============ Sync ============ */
const idb = (()=>{ let dbp=null; const open=()=>dbp||(dbp=new Promise((res,rej)=>{ const r=indexedDB.open('dailyExpenseTracker',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{ const t=db.transaction('kv',mode); const st=t.objectStore('kv'); const q=fn(st); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); }));
  return { get:k=>tx('readonly',s=>s.get(k)).catch(()=>null), set:(k,v)=>tx('readwrite',s=>s.put(v,k)).catch(()=>null), del:k=>tx('readwrite',s=>s.delete(k)).catch(()=>null) };
})();
let SH = null, syncState='none', syncTimer=null, syncing=false;
function exportObj(){ return {app:'daily-expense-tracker', version:1, profileName:curProfile().name, currency:curCode(), exported:new Date().toISOString(), entries:DB.entries, months:DB.months, rates:DB.rates, settings:DB.settings}; }
function merge(r){
  if(!r || typeof r!=='object' || !r.entries) throw new Error('Not an expense sync file');
  if(r.profileName && r.profileName.trim().toLowerCase()!==curProfile().name.trim().toLowerCase())
    throw new Error(`this file belongs to "${r.profileName}". Switch to that profile first (or rename this profile to "${r.profileName}")`);
  if(r.currency && r.currency!==curCode())
    throw new Error(`this file is in ${r.currency} but this profile uses ${curCode()}. Set the profile's currency to ${r.currency} first`);
  let n=0; const bad=k=>k==='__proto__'||k==='constructor'||k==='prototype';
  for(const [id,e] of Object.entries(r.entries)){ if(bad(id) || !e || typeof e!=='object' || typeof e.date!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(e.date) || typeof e.amt!=='number') continue;
    const l=DB.entries[id]; if(!l || (e.upd||0)>(l.upd||0)){ DB.entries[id]=e; n++; } }
  for(const [m,c] of Object.entries(r.months||{})){ if(bad(m) || !c || typeof c!=='object' || !/^\d{4}-\d{2}$/.test(m)) continue; const l=DB.months[m]; if(!l || (c.upd||0)>(l.upd||0)){ DB.months[m]=c; n++; } }
  for(const [d,v] of Object.entries(r.rates||{})) if(!DB.rates[d]) DB.rates[d]=v;
  if(r.settings && typeof r.settings==='object' && (r.settings.upd||0)>(DB.settings.upd||0)){ DB.settings=r.settings; applyTheme(); }
  return n;
}

}

async function linkSync(create){
  try{
    // mode:'readwrite' asks for edit access in the same step as picking the file
    const opts={types:[{description:'Expense sync file',accept:{'application/json':['.json']}}], mode:'readwrite', id:'expense-sync'};
    if(create) SH = await window.showSaveFilePicker({...opts, suggestedName:syncFileName()});
    else [SH] = await window.showOpenFilePicker(opts);
    await idb.set(syncKeyFor(PROFILES.current),SH);           // remember the file even if access is still pending
    let perm = 'prompt';
    try{ perm = await SH.queryPermission({mode:'readwrite'}); }catch(e){}
    if(perm!=='granted'){ try{ perm = await SH.requestPermission({mode:'readwrite'}); }catch(e){} }
    if(perm!=='granted'){
      syncState='need'; render();
      toast('File linked. Tap "Allow access" so the app can save to it.');
      return;
    }
    syncState='ok';
    await syncNow(true);
  }catch(e){ if(e.name!=='AbortError') toast('Sync error: '+e.message); }
}
async function unlinkSync(){ await idb.del(syncKeyFor(PROFILES.current)); SH=null; syncState='none'; DB.meta.lastSync=null; persist(); toast('Sync file unlinked'); render(); }
async function syncNow(manual){
  if(!SH){ if(manual) toast('Link a sync file first'); return; }
  if(syncing) return; syncing=true;
  try{
    if(syncState!=='ok'){ const p=await SH.requestPermission({mode:'readwrite'}); if(p!=='granted'){ syncState='need'; if(manual) toast('Edit access was not given. Click the icon at the left of the address bar → Site settings → File editing → Allow, then try again.'); return; } syncState='ok'; }
    const f = await SH.getFile(); const txt = (await f.text()).trim();
    let n=0; if(txt){ n = merge(JSON.parse(txt)); }
    const w = await SH.createWritable(); await w.write(JSON.stringify(exportObj())); await w.close();
    DB.meta.lastSync=Date.now(); DB.meta.syncName=SH.name; persist();
    if(manual || n) toast(n? `Synced · ${n} update${n===1?'':'s'} from other device` : 'Synced');
    if(n || manual) render(); else renderSyncDot();
  }catch(e){ syncState = (e.name==='NotAllowedError'||e.name==='SecurityError')?'need':syncState; if(manual) toast('Sync failed: '+e.message); }
  finally{ syncing=false; renderSyncDot(); if(S.tab==='settings') renderSyncStatus(); }
}

/* ============ Cloud sync (private Google Apps Script in the user's own Google account) ============
   No files and no permission prompts: the app posts its data to the script, the script merges it with the
   copy in Google Drive (My Drive/Expenses App) and returns the merged result. Works the same on phone and Mac. */
const APP_VERSION='v36';
const CKEY='dailyExpenseTracker.cloud';
/* Only the user's own Apps Script web app and a sane key are ever accepted (a crafted code/link can't redirect data elsewhere) */
function okCloud(o){ return !!(o && typeof o.u==='string' && typeof o.k==='string' && /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{10,}\/exec$/.test(o.u) && /^[\x21-\x7e]{8,200}$/.test(o.k)); }
function cloudCfg(){ try{ const o=JSON.parse(localStorage.getItem(CKEY)||'null'); return okCloud(o)? o : null; }catch(e){ return null; } }
function saveCloudCfg(o){ try{ localStorage.setItem(CKEY, JSON.stringify(o)); }catch(e){} try{ idb.set('cloudCfg', o); }catch(e){} }
function clearCloudCfg(){ try{ localStorage.removeItem(CKEY); }catch(e){} try{ idb.del('cloudCfg'); }catch(e){} }
/* If the browser ever drops localStorage but keeps IndexedDB, bring the saved code back. */
async function restoreCloudCfg(){ if(cloudCfg()) { try{ if(!(await idb.get('cloudCfg'))) idb.set('cloudCfg', cloudCfg()); }catch(e){} return false; }
  try{ const o=await idb.get('cloudCfg'); if(okCloud(o)){ localStorage.setItem(CKEY, JSON.stringify(o)); return true; } }catch(e){} return false; }
function cloudOn(){ const c=cloudCfg(); return !!(c&&c.u&&c.k); }
let cloudErr='', cloudState='off', cloudBusy=false, cloudTimer=null, cloudAgain=false, cloudDirty=true, cloudFull=0, cloudRev=null;
function connCode(c){ return 'EXP1-'+btoa(JSON.stringify({u:c.u,k:c.k})); }
function parseCode(t){ const m=String(t||'').replace(/\s+/g,'').match(/EXP1-([A-Za-z0-9+/=]+)/); if(!m) return null; try{ const o=JSON.parse(atob(m[1])); return okCloud(o)? {u:o.u,k:o.k} : null; }catch(e){ return null; } }
/* Sends this device's data only when something changed here (or once a minute as a safety net).
   Otherwise it just asks "anything new since version X?", which the script answers without reading Drive. */
let cloudManualWait=false, lblTimer=null;
function syncLabel(txt, busy){ const b=$('#syncBtn'), l=$('#syncLbl'); if(!b||!l) return; b.classList.toggle('busy',!!busy); l.textContent=txt; clearTimeout(lblTimer); if(!busy && txt!=='Sync') lblTimer=setTimeout(()=>{ l.textContent='Sync'; },2500); }
function showLast(){ const el=$('#cLast'); if(el) el.textContent=DB.meta.lastCloud? new Date(DB.meta.lastCloud).toLocaleString('en-SG') : 'not yet'; }
async function cloudSync(manual, poll){
  if(!cloudOn()){ if(manual) toast('Connect cloud sync first'); return false; }
  if(cloudBusy){ if(manual){ cloudManualWait=true; syncLabel('Syncing…',true); } else if(!poll) cloudAgain=true; return false; }
  cloudBusy=true; cloudAgain=false; const c=cloudCfg(), prof=curProfile();
  if(manual) syncLabel('Syncing…',true);
  const full = manual || cloudDirty || !cloudRev || Date.now()-cloudFull>60000;
  if(full) cloudDirty=false;
  const ctl = ('AbortController' in window)? new AbortController() : null; const tmo = setTimeout(()=>{ try{ ctl&&ctl.abort(); }catch(e){} }, 25000);
  try{
    const r = await fetch(c.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'}, signal: ctl?ctl.signal:undefined,
      body:JSON.stringify({key:c.k, profile:prof.name, profileName:prof.name, currency:curCode(), since: full?null:cloudRev, data: full?exportObj():null})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'sync failed');
    const was=cloudState; cloudState='ok'; DB.meta.lastCloud=Date.now();
    if(j.same){ if(was!=='ok'){ renderSyncDot(); renderCloudStatus(); } else showLast(); if(manual){ syncLabel('Synced ✓'); toast('Synced — everything is up to date'); } return true; }
    const n = merge(j.data); cloudRev = j.rev||null; if(full) cloudFull=Date.now();
    if(n){ try{ cleanupFunds(); ensureOpening(); }catch(e){} }
    persist();
    if(n) render(); else { renderSyncDot(); renderCloudStatus(); }
    if(manual){ syncLabel('Synced ✓'); toast(n?`Synced · ${n} update${n===1?'':'s'} from your other devices`:'Synced — everything is up to date'); }
    else if(n) toast(`Updated · ${n} change${n===1?'':'s'} from your other device`);
    return true;
  }catch(e){ cloudErr = e.name==='AbortError'?'no response':(e.message||String(e)); if(full) cloudDirty=true; cloudState='err'; renderSyncDot(); renderCloudStatus();
    if(manual){ syncLabel('Sync'); toast('Sync failed ('+(e.name==='AbortError'?'no response, check internet':e.message)+'). It will retry automatically.'); }
    return false; }
  finally{ clearTimeout(tmo); cloudBusy=false;
    if(cloudManualWait){ cloudManualWait=false; setTimeout(()=>cloudSync(true),50); }
    else if(cloudAgain){ cloudAgain=false; setTimeout(()=>cloudSync(false),200); } }
}
function scheduleCloud(){ if(!cloudOn()) return; cloudDirty=true; clearTimeout(cloudTimer); cloudTimer=setTimeout(()=>cloudSync(false),300); }
setInterval(()=>{ if(cloudOn() && document.visibilityState==='visible') cloudSync(false,true); }, 5000);
window.addEventListener('focus',()=>{ if(cloudOn()) cloudSync(false); });
window.addEventListener('online',()=>{ if(cloudOn()) cloudSync(false); });

      <div class="btns"><button class="btn primary" id="cSync">Sync now</button><button class="btn" id="cCopy">Copy connection code</button><button class="btn danger" id="cOff">Disconnect</button></div>
