<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Expenses</title>
<meta name="description" content="Track daily spending by category, monthly budgets, salary and savings.">
<meta name="theme-color" content="#2a78d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  color-scheme: light;
  --bg:#f4f3f0; --surface:#fcfcfb; --surface-2:#efeee9; --border:#e2e0da;
  --text:#0b0b0b; --text-2:#52514e; --muted:#8a8984;
  --accent:#2a78d6; --accent-ink:#ffffff;
  --series-1:#2a78d6; --series-3:#1baf7a;
  --good:#008300; --warn:#b77a00; --bad:#d03b3b;
  --good-bg:#e3f3e3; --warn-bg:#fbf0d6; --bad-bg:#fbe3e3;
  --grid:#e6e4de;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#262624; --border:#33332f;
    --text:#ffffff; --text-2:#c3c2b7; --muted:#8d8c84;
    --accent:#3987e5; --accent-ink:#ffffff;
    --series-1:#3987e5; --series-3:#199e70;
    --good:#4fb84f; --warn:#e0a526; --bad:#ef6b6b;
    --good-bg:#1d3320; --warn-bg:#3a2f14; --bad-bg:#3d1f1f;
    --grid:#2c2c29;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#262624; --border:#33332f;
  --text:#ffffff; --text-2:#c3c2b7; --muted:#8d8c84;
  --accent:#3987e5; --accent-ink:#ffffff;
  --series-1:#3987e5; --series-3:#199e70;
  --good:#4fb84f; --warn:#e0a526; --bad:#ef6b6b;
  --good-bg:#1d3320; --warn-bg:#3a2f14; --bad-bg:#3d1f1f;
  --grid:#2c2c29;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border)}
header.top h1{font-size:17px;margin:0;font-weight:650}
.profbtn{display:flex;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;padding:4px 8px 4px 4px;border-radius:20px;font-weight:650;font-size:15px;color:var(--text);min-width:0;max-width:40vw}
.profbtn:hover{background:var(--surface-2)}
.profbtn .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.av.lg{width:40px;height:40px;font-size:17px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--border);cursor:pointer;border-radius:8px}
.prow:first-child{border-top:0}
.prow:hover{background:var(--surface-2)}
.prow .grow{flex:1;min-width:0}
.prow .grow b{display:block}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin:14px 0}
.pinpad button{height:56px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:22px;font-weight:600;cursor:pointer}
.pinpad button:active{background:var(--surface-2)}
.pindots{display:flex;gap:12px;justify-content:center;margin:10px 0}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--text-2)}
.pindots i.on{background:var(--text)}
.lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.lock .box{width:100%;max-width:340px;text-align:center}
body.locked main,body.locked nav.tabs,body.locked .fab,body.locked .monthnav,body.locked #syncBtn{visibility:hidden}
body.locked::after{content:"Locked. Tap the name at the top to unlock or switch profile.";position:fixed;left:16px;right:16px;top:40%;text-align:center;color:var(--text-2)}
.monthnav{display:flex;align-items:center;gap:2px}
.monthnav button{border:0;background:transparent;width:34px;height:34px;border-radius:8px;font-size:20px;cursor:pointer;color:var(--text-2)}
.monthnav button:hover{background:var(--surface-2)}
.monthnav .mlabel{width:auto;min-width:104px;padding:0 10px;font-size:15px;font-weight:650;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.monthnav .mlabel svg{width:15px;height:15px;color:var(--accent)}
.sheet .monthnav .mlabel{cursor:default}
main{max-width:760px;margin:0 auto;padding:12px 16px 24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:14px;margin:0 0 10px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .l{font-size:12px;color:var(--text-2)}
.kpi .v{font-size:19px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.cat{padding:10px 0;border-top:1px solid var(--border)}
.cat:first-of-type{border-top:0}
.cat .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px;flex:none}
.cat .nm{font-weight:600}
.cat .meta{font-size:12px;color:var(--text-2)}
.cat .amt{margin-left:auto;text-align:right;white-space:nowrap}
.cat .amt b{font-weight:650}
.bar{height:6px;border-radius:4px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--good)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.subgrp{margin:10px 0 0 44px;display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--text-2);flex-wrap:wrap}
.subs{margin:6px 0 0 44px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:560px){.subs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sub{background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:12px}
.sub b{display:block;font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;border-radius:10px;font-size:11px;color:var(--text-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;max-width:120px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:650}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(42,120,214,.4)}
@media (min-width:800px){.fab{right:calc(50% - 370px)}}
.btn{border:1px solid var(--border);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:block;font-size:12px;color:var(--text-2);margin:10px 0 4px;font-weight:600}
input.in,select.in,textarea.in{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);outline:none}
input.in:focus,select.in:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);padding:7px 10px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 6px;font-size:18px}
.bigamt{font-size:26px;font-weight:650;text-align:right}
.day{margin-bottom:12px}
.day .dh{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);font-weight:600;padding:0 4px 6px}
.ent{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--border);cursor:pointer}
.ent:first-child{border-top:0}
.ent:hover{background:var(--surface-2)}
.ent .ic{font-size:18px;width:26px;text-align:center}
.ent .t{flex:1;min-width:0}
.ent .t div:last-child{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--text-2);font-weight:600;font-size:12px}
.tablewrap{overflow-x:auto}
.hbar{display:grid;grid-template-columns:118px 1fr auto;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.hbar .track{height:14px;position:relative}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.hbar:hover .track i{filter:brightness(1.1)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin-bottom:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-size:11px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;opacity:0;transition:opacity .1s;max-width:220px}
#tip.on{opacity:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
.syncdot.ok{background:var(--good)} .syncdot.need{background:var(--warn)}
.insight{padding:8px 0;border-top:1px solid var(--border);font-size:14px}
.insight:first-of-type{border-top:0}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1/1.05;border-radius:8px;background:var(--surface-2);padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:2px solid transparent;min-width:0;overflow:hidden;color:var(--text)}
.cal .d:hover{border-color:var(--border)}
.cal .d.today{border-color:var(--text-2)}
.cal .d.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal .d.future{opacity:.45}
.cal .dn{font-size:11px;font-weight:600;opacity:.8}
.cal .da{font-size:12px;font-weight:650;text-align:right;white-space:nowrap}
@media (min-width:560px){.cal{gap:6px}.cal .d{aspect-ratio:1.25/1;padding:6px 8px}.cal .dn{font-size:12px}.cal .da{font-size:14px}}
.calleg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-2);margin-top:10px}
.calleg i{display:block;width:90px;height:8px;border-radius:4px}
.brow{display:grid;grid-template-columns:34px minmax(0,1fr) 116px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.brow .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px}
.brow .ic.sm{width:28px;height:28px;font-size:15px;justify-self:end}
.brow .nm{font-weight:600}
.brow .meta{font-size:12px;color:var(--text-2)}
.brow .bin{text-align:right}
.brow .bin[readonly]{background:var(--surface-2);color:var(--text-2)}
.share{height:4px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.share i{display:block;height:100%;background:var(--series-1);border-radius:3px}
.bparts{margin-left:20px;padding-left:12px;border-left:2px solid var(--border);margin-bottom:6px}
.brow.part{border-top:1px dashed var(--border);padding:8px 0;grid-template-columns:28px minmax(0,1fr) 116px}
.hidden{display:none!important}
.headbtn{border:0;background:transparent;cursor:pointer;color:var(--text-2);font-size:13px;display:flex;align-items:center;padding:6px 8px;border-radius:8px}
.headbtn:hover{background:var(--surface-2)}
</style>
</head>
<body>
<header class="top">
  <button class="profbtn" id="profBtn" aria-label="Switch profile"></button>
  <div class="monthnav">
    <button id="mPrev" aria-label="Previous month">‹</button>
    <button id="mLabel" class="mlabel num" aria-label="Show calendar for this month"></button>
    <button id="mNext" aria-label="Next month">›</button>
  </div>
  <button class="headbtn" id="syncBtn" title="Sync"><span class="syncdot" id="syncDot"></span>Sync</button>
</header>

<main>
  <section id="tab-home"></section>
  <section id="tab-history" class="hidden"></section>
  <section id="tab-analysis" class="hidden"></section>
  <section id="tab-budget" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
</main>

<button class="fab" id="fab" aria-label="Add expense">+</button>

<nav class="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-tab="analysis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analysis</button>
  <button data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Budget</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 12A9 9 0 0 1 18.5 5.8L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/></svg>Sync &amp; data</button>
</nav>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>
<div id="tip"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">

<script>
"use strict";
/* ============ Constants ============ */
const CATS = [
  {id:'food', name:'Food', icon:'🍽️', subs:[
    {id:'breakfast', name:'Breakfast', icon:'🍳'},
    {id:'lunch', name:'Lunch', icon:'🍛'},
    {id:'dinner', name:'Dinner', icon:'🍲'},
    {id:'coffee', name:'Coffee / Drinks', icon:'☕'},
    {id:'groceries', name:'Groceries (to cook)', icon:'🥬', group:'other'},
    {id:'delivery', name:'Online delivery', icon:'🛵', group:'other'}]},
  {id:'travel', name:'Travel', icon:'🚌'},
  {id:'temple', name:'Temple', icon:'🛕'},
  {id:'entertainment', name:'Entertainment', icon:'🎬'},
  {id:'medical', name:'Medical', icon:'💊'},
  {id:'laundry', name:'Laundry', icon:'🧺'},
  {id:'shopping', name:'Shopping', icon:'🛍️'},
  {id:'rent', name:'Monthly Rent', icon:'🏠'},
  {id:'ac', name:'AC bill', icon:'❄️'},
  {id:'home', name:'Money sent home', icon:'💸'},
  {id:'misc', name:'Miscellaneous', icon:'🧾', reason:true},
  {id:'refund', name:'Refunds', icon:'↩️', income:true},
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const EXP_CATS = CATS.filter(c=>!c.income);
const FIXED = new Set(['rent','ac','home']);    // monthly bills: excluded from "daily living" average
const FIXED_TXT = 'rent, AC &amp; home';
const DAILY_FOOD = ['breakfast','lunch','dinner','coffee'];
// Food budget can be split into three parts; stored as budgets['food:daily'] etc.
const FOOD_PARTS = [
  {id:'daily', name:'Daily food', hint:'Breakfast, lunch, dinner, coffee', icon:'🍛', subs:DAILY_FOOD},
  {id:'groceries', name:'Groceries (to cook)', hint:'Shopping to cook at home', icon:'🥬', subs:['groceries']},
  {id:'delivery', name:'Online delivery', hint:'GrabFood, foodpanda, Deliveroo', icon:'🛵', subs:['delivery']},
];
const KEY_BASE = 'dailyExpenseTracker.v1';
const PKEY = 'dailyExpenseTracker.profiles';
/* Profiles: each person on this device gets their own data store + sync file.
   The first profile ('default') keeps the original storage key, so existing data carries over. */
function loadProfiles(){
  let P=null; try{ P=JSON.parse(localStorage.getItem(PKEY)||'null'); }catch(e){}
  if(!P || !Array.isArray(P.list) || !P.list.length) P={list:[{id:'default', name:'Me', color:0}], current:'default'};
  if(!P.list.some(p=>p.id===P.current)) P.current=P.list[0].id;
  return P;
}
let PROFILES = loadProfiles();
function saveProfiles(){ try{ localStorage.setItem(PKEY, JSON.stringify(PROFILES)); }catch(e){} }
function curProfile(){ return PROFILES.list.find(p=>p.id===PROFILES.current) || PROFILES.list[0]; }
function keyFor(id){ return id==='default' ? KEY_BASE : KEY_BASE+'.'+id; }
function syncKeyFor(id){ return id==='default' ? 'syncHandle' : 'syncHandle:'+id; }
let KEY = keyFor(PROFILES.current);

/* ============ Storage ============ */
function blankDB(){ return {entries:{}, months:{}, rates:{}, settings:{upd:0, theme:'auto'}, meta:{}}; }
function loadDB(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const d = JSON.parse(raw); return Object.assign(blankDB(), d); } }catch(e){}
  return blankDB();
}
let DB = loadDB();
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast('Could not save on this device: '+e.message); } }
function save(){ persist(); scheduleSync(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ============ Dates & money ============ */
const pad = n => String(n).padStart(2,'0');
function dstr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function ymOf(s){ return s.slice(0,7); }
function curYM(){ return ymOf(todayStr()); }
function addMonths(ym,n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function dim(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function ymLabel(ym,short){ const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-SG',{month:short?'short':'long',year:'numeric'}); }
function dayLabel(s){ const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); const t=todayStr(); if(s===t) return 'Today'; const yd=new Date(); yd.setDate(yd.getDate()-1); if(s===dstr(yd)) return 'Yesterday'; return dt.toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short'}); }
function daysElapsed(ym){ const c=curYM(); if(ym<c) return dim(ym); if(ym>c) return 0; return new Date().getDate(); }
function daysLeft(ym){ const c=curYM(); if(ym<c) return 0; if(ym>c) return dim(ym); return dim(ym)-new Date().getDate()+1; }
/* Currencies: each profile picks the currency its expenses are in, and a home currency for "Money sent home". */
const CURRENCIES = {
  SGD:{sym:'S$',name:'Singapore dollar'}, INR:{sym:'₹',name:'Indian rupee',loc:'en-IN'}, USD:{sym:'US$',name:'US dollar'},
  EUR:{sym:'€',name:'Euro'}, GBP:{sym:'£',name:'British pound'}, AUD:{sym:'A$',name:'Australian dollar'},
  CAD:{sym:'C$',name:'Canadian dollar'}, NZD:{sym:'NZ$',name:'New Zealand dollar'}, MYR:{sym:'RM',name:'Malaysian ringgit'},
  AED:{sym:'AED ',name:'UAE dirham'}, SAR:{sym:'SAR ',name:'Saudi riyal'}, QAR:{sym:'QAR ',name:'Qatari riyal'},
  JPY:{sym:'¥',name:'Japanese yen',dec:0}, CNY:{sym:'CN¥',name:'Chinese yuan'}, HKD:{sym:'HK$',name:'Hong Kong dollar'},
  THB:{sym:'฿',name:'Thai baht'}, PHP:{sym:'₱',name:'Philippine peso'}, IDR:{sym:'Rp',name:'Indonesian rupiah',dec:0},
  KRW:{sym:'₩',name:'South Korean won',dec:0}, CHF:{sym:'CHF ',name:'Swiss franc'},
  LKR:{sym:'Rs ',name:'Sri Lankan rupee',loc:'en-IN'}, BDT:{sym:'৳',name:'Bangladeshi taka',loc:'en-IN'},
  NPR:{sym:'Rs ',name:'Nepalese rupee',loc:'en-IN'}, PKR:{sym:'Rs ',name:'Pakistani rupee',loc:'en-IN'},
};
function curInfo(c){ return CURRENCIES[c] || {sym:c+' ',name:c}; }
function money(n, c, dec){ const i=curInfo(c); const d = dec===undefined ? (i.dec??2) : Math.min(dec, i.dec??2);
  return (n<0?'−':'')+i.sym+Math.abs(d===0?Math.round(n||0):(n||0)).toLocaleString(i.loc||'en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function curCode(){ return (typeof curProfile==='function' && curProfile().currency) || 'SGD'; }
function homeCode(){ return (typeof curProfile==='function' && curProfile().homeCur) || 'INR'; }
const sgd  = n => money(n, curCode());        // amount in this profile's currency
const sgd0 = n => money(n, curCode(), 0);     // same, rounded
const inr  = (n, c) => money(n, c || homeCode(), 0);   // amount in the home currency
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round(n*100)/100;

/* ============ Month config (salary + budgets) ============ */
function cfg(ym){
  if(DB.months[ym] && !DB.months[ym].del) return {...DB.months[ym], inherited:false};
  const prev = Object.keys(DB.months).filter(k=>k<ym && !DB.months[k].del).sort().pop();
  if(prev) return {...DB.months[prev], inherited:prev};
  return {salary:0, budgets:{}, inherited:null};
}

/* ============ Calculations ============ */
function monthEntries(ym){ return Object.values(DB.entries).filter(e=>!e.del && e.date.startsWith(ym)); }
function stats(ym){
  const es = monthEntries(ym);
  const by = {}; CATS.forEach(c=>by[c.id]=0);
  const sub = Object.fromEntries(CAT.food.subs.map(s=>[s.id,0]));
  const daily = {}; const dailyLiving = {};
  let inrHome = 0;
  for(const e of es){
    by[e.cat] = (by[e.cat]||0) + e.amt;
    if(e.cat==='food' && e.sub) sub[e.sub]=(sub[e.sub]||0)+e.amt;
    if(e.cat==='home' && (e.homeCur||'INR')===homeCode()) inrHome += e.inr||0;
    const sign = CAT[e.cat]?.income ? -1 : 1;
    daily[e.date]=(daily[e.date]||0)+sign*e.amt;
    if(!FIXED.has(e.cat)) dailyLiving[e.date]=(dailyLiving[e.date]||0)+sign*e.amt;
  }
  const refund = by.refund||0;
  const refundFor = {};
  for(const e of es) if(e.cat==='refund'){ const f = CAT[e.refFor]&&!CAT[e.refFor].income ? e.refFor : 'medical'; refundFor[f]=(refundFor[f]||0)+e.amt; }
  const net = {...by}; delete net.refund;
  for(const [f,x] of Object.entries(refundFor)) net[f] = (net[f]||0) - x;
  const gross = EXP_CATS.reduce((s,c)=>s+by[c.id],0);
  const total = gross - refund;
  const living = total - [...FIXED].reduce((s,k)=>s+by[k],0);
  const c = cfg(ym);
  const days = daysElapsed(ym);
  const budgetTotal = EXP_CATS.reduce((s,k)=>s+(+c.budgets[k.id]||0),0);
  let budgetLeft = 0;
  EXP_CATS.forEach(k=>{ const b=+c.budgets[k.id]||0; if(b>0) budgetLeft += b - net[k.id]; });
  const dailyFood = DAILY_FOOD.reduce((a,k)=>a+sub[k],0);
  return {es, by, net, sub, dailyFood, refund, refundFor, gross, total, living, inrHome, daily, dailyLiving, cfg:c, salary:+c.salary||0,
          days, left:daysLeft(ym), dim:dim(ym), budgetTotal, budgetLeft,
          saved:(+c.salary||0) - total,
          avg: days? total/days : 0, avgLiving: days? living/days : 0};
}
function status(spent,budget,cat){
  if(!budget) return null;
  const p = spent/budget;
  if(FIXED.has(cat)) return p>1.005?'bad':'good';   // rent / money home: paying the planned amount is on track
  if(p>1) return 'bad'; if(p>=0.85) return 'warn'; return 'good';
}

/* ============ Exchange rate (profile currency -> home currency) ============ */
async function fetchRate(date){
  const base=curCode(), to=homeCode(); if(base===to) return 1;
  const today = todayStr(), key = date+'|'+base+to;
  if(date!==today && DB.rates[key]) return DB.rates[key];
  const tag = date>=today ? 'latest' : date;
  const urls = [
    `https://api.frankfurter.dev/v1/${tag}?base=${base}&symbols=${to}`,
    `https://api.frankfurter.app/${tag}?from=${base}&to=${to}`
  ];
  for(const u of urls){
    try{ const r = await fetch(u,{cache:'no-store'}); if(r.ok){ const j = await r.json(); const v = j?.rates?.[to]; if(v){ if(date<today){ DB.rates[key]=v; persist(); } DB.meta.lastRate=v; DB.meta.lastRatePair=base+to; return v; } } }catch(e){}
  }
  try{ const r = await fetch('https://open.er-api.com/v6/latest/'+base); if(r.ok){ const j=await r.json(); const v=j?.rates?.[to]; if(v){ DB.meta.lastRate=v; DB.meta.lastRatePair=base+to; return v; } } }catch(e){}
  return null;
}

/* ============ UI state ============ */
const S = { ym: curYM(), tab:'home', histCat:'all', dailyMode:'living', histView:'calendar', calMode:'living', selDay:null };
const $ = s => document.querySelector(s);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
function tip(ev,html){ const t=$('#tip'); if(!html){t.classList.remove('on');return;} t.innerHTML=html; t.classList.add('on');
  const x = (ev.touches?ev.touches[0].clientX:ev.clientX), y=(ev.touches?ev.touches[0].clientY:ev.clientY);
  const w=t.offsetWidth, h=t.offsetHeight; t.style.left=Math.min(window.innerWidth-w-8, Math.max(8,x-w/2))+'px'; t.style.top=Math.max(8,y-h-12)+'px'; }
document.addEventListener('scroll',()=>tip(null,null),{passive:true});

/* ============ HOME ============ */
function renderHome(){
  const st = stats(S.ym);
  const c = st.cfg;
  const today = todayStr();
  const todaySpent = ymOf(today)===S.ym ? (st.daily[today]||0) : null;
  const noBudget = !st.salary && !st.budgetTotal;
  let h = '';
  if(noBudget){
    h += `<div class="card"><b>Welcome!</b> Start by setting your monthly salary and category budgets.
      <div class="btns" style="margin-top:10px"><button class="btn primary" onclick="go('budget')">Set salary &amp; budgets</button><button class="btn" onclick="loadSample()">Try with sample data</button></div></div>`;
  }
  h += `<div class="card"><h2>${ymLabel(S.ym)}</h2><div class="kpis">
    <div class="kpi"><div class="l">Salary</div><div class="v num">${sgd0(st.salary)}</div><div class="s">${c.inherited?'from '+ymLabel(c.inherited,true):'this month'}</div></div>
    <div class="kpi"><div class="l">Spent</div><div class="v num">${sgd(st.total)}</div><div class="s">${st.salary?Math.round(st.total/st.salary*100)+'% of salary':'&nbsp;'}</div></div>
    <div class="kpi"><div class="l">Left from salary</div><div class="v num ${st.saved<0?'neg':'pos'}">${sgd(st.saved)}</div><div class="s">potential saving</div></div>
    <div class="kpi"><div class="l">Budget left</div><div class="v num ${st.budgetLeft<0?'neg':''}">${sgd(st.budgetLeft)}</div><div class="s">${st.left && st.budgetLeft>0 ? sgd(st.budgetLeft/st.left)+'/day for '+st.left+' days':'of '+sgd0(st.budgetTotal)}</div></div>
  </div>
  <div class="kpis" style="margin-top:10px">
    <div class="kpi"><div class="l">Avg daily (all)</div><div class="v num">${sgd(st.avg)}</div><div class="s">over ${st.days} day${st.days===1?'':'s'}</div></div>
    <div class="kpi"><div class="l">Avg daily living</div><div class="v num">${sgd(st.avgLiving)}</div><div class="s">excl. ${FIXED_TXT}</div></div>
    ${todaySpent!==null?`<div class="kpi"><div class="l">Today</div><div class="v num">${sgd(todaySpent)}</div><div class="s">${new Date().toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short'})}</div></div>`:''}
    <div class="kpi"><div class="l">Sent home</div><div class="v num">${inr(st.inrHome)}</div><div class="s">${sgd(st.by.home)}</div></div>
  </div></div>`;

  h += `<div class="card"><h2>Categories</h2>`;
  for(const k of CATS){
    const spent = k.income ? st.by[k.id] : st.net[k.id];
    const b = +c.budgets[k.id]||0;
    const avg = st.days? spent/st.days : 0;
    if(k.income){
      h += `<div class="cat"><div class="row"><div class="ic">${k.icon}</div><div><div class="nm">${k.name}</div><div class="meta">${Object.keys(st.refundFor).length? 'Taken off: '+Object.entries(st.refundFor).map(([f,x])=>CAT[f].name+' '+sgd(x)).join(', ') : 'Money received back · reduces the category it’s for'}</div></div>
        <div class="amt num"><b class="pos">+${sgd(st.by.refund)}</b></div></div></div>`;
      continue;
    }
    const stt = status(spent,b,k.id);
    const pct = b? Math.min(100, spent/b*100) : 0;
    const rem = b - spent;
    let meta = `Avg ${sgd(avg)}/day`;
    if(st.refundFor[k.id]) meta += ` · after ${sgd(st.refundFor[k.id])} refund`;
    if(k.id==='home' && st.inrHome) meta += ` · ${inr(st.inrHome)}`;
    h += `<div class="cat" data-cat="${k.id}"><div class="row"><div class="ic">${k.icon}</div><div style="min-width:0"><div class="nm">${k.name}</div><div class="meta">${meta}</div></div>
      <div class="amt num"><b>${sgd(spent)}</b><div class="meta">${b? (rem>=0? sgd(rem)+' left' : '<span class="neg">'+sgd(-rem)+' over</span>') : 'no budget'}</div></div></div>
      ${b?`<div class="bar" style="margin-left:44px" title="${Math.round(spent/b*100)}% of ${sgd0(b)}"><i class="${stt}" style="width:${pct}%"></i></div>`:''}`;
    if(k.subs){
      const subCard = s=>`<div class="sub">${s.icon} ${s.name}<b class="num">${sgd(st.sub[s.id])}</b><span class="muted num">avg ${sgd(st.days?st.sub[s.id]/st.days:0)}/day</span></div>`;
      const fb = p => +c.budgets['food:'+p]||0;
      const ofB = (x,p) => fb(p)? ` of ${sgd0(fb(p))}${x>fb(p)?' <span class="neg">(over)</span>':''}` : '';
      h += `<div class="subgrp"><span>Daily food</span><span class="num">${sgd(st.dailyFood)}${ofB(st.dailyFood,'daily')} · avg ${sgd(st.days?st.dailyFood/st.days:0)}/day</span></div>`;
      h += `<div class="subs">` + k.subs.filter(s=>!s.group).map(subCard).join('') + `</div>`;
      h += `<div class="subs" style="margin-top:6px">` + k.subs.filter(s=>s.group).map(s=>subCard(s).replace('<span class="muted num">', `<span class="muted num">${fb(s.id)?'budget '+sgd0(fb(s.id))+' · ':''}`)).join('') + `</div>`;
    }
    h += `</div>`;
  }
  h += `</div>`;

  // recent
  const recent = st.es.slice().sort((a,b)=> b.date.localeCompare(a.date) || (b.cr||0)-(a.cr||0)).slice(0,6);
  h += `<div class="card"><h2>Recent</h2>${recent.length? `<div class="list" style="border:0">${recent.map(entRow).join('')}</div><div style="margin-top:8px"><button class="btn sm" onclick="go('history')">See all</button></div>` : '<div class="empty">No expenses yet this month. Tap + to add one.</div>'}</div>`;
  $('#tab-home').innerHTML = h;
}
function entRow(e){
  const k = CAT[e.cat]||{name:e.cat,icon:'•'};
  const s = e.sub && k.subs ? k.subs.find(x=>x.id===e.sub) : null;
  const title = s ? s.name : (e.cat==='refund' ? 'Refund · '+(CAT[e.refFor]||CAT.medical).name : k.name);
  const extra = [];
  if(e.cat==='home' && e.inr && (e.homeCur||'INR')!==(e.cur||curCode())) extra.push(inr(e.inr, e.homeCur||'INR')+(e.rate?' @ '+e.rate.toFixed(2):''));
  if(e.note) extra.push(esc(e.note));
  if(!extra.length) extra.push(s? k.name : dayLabel(e.date));
  return `<div class="ent" onclick="openEntry('${e.id}')"><div class="ic">${s?s.icon:k.icon}</div><div class="t"><div>${title}</div><div>${extra.join(' · ')}</div></div>
    <div class="num ${k.income?'pos':''}" style="font-weight:600">${k.income?'+':''}${sgd(e.amt)}</div></div>`;
}

/* ============ HISTORY ============ */
function renderHistory(){
  const es = monthEntries(S.ym).filter(e=>S.histCat==='all'||e.cat===S.histCat||(S.histCat==='food-'+e.sub));
  const signed = e => CAT[e.cat]?.income ? -e.amt : e.amt;
  const days = {};
  es.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
  let opts = `<option value="all">All categories</option>` + CATS.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`+(c.subs?c.subs.map(s=>`<option value="food-${s.id}">&nbsp;&nbsp;&nbsp;${s.name}</option>`).join(''):'')).join('');
  const total = es.reduce((s,e)=>s+signed(e),0);
  const cal = S.histView!=='list';
  let h = `<div class="card"><div class="row" style="gap:8px;flex-wrap:wrap">
      <div class="seg"><button class="${cal?'on':''}" data-hv="calendar">Calendar</button><button class="${cal?'':'on'}" data-hv="list">List</button></div>
      <select class="in" id="histCat" style="flex:1;min-width:160px">${opts}</select></div>
    <div class="small muted" style="margin-top:8px">${es.length} entr${es.length===1?'y':'ies'} · total <b class="num" style="color:var(--text)">${sgd(total)}</b></div></div>`;
  if(cal) h += calendarView(es, days, signed);
  else {
    const keys = Object.keys(days).sort().reverse();
    if(!keys.length) h += `<div class="empty">Nothing recorded for ${ymLabel(S.ym)}.</div>`;
    for(const d of keys) h += dayBlock(d, days[d], signed);
  }
  $('#tab-history').innerHTML = h;
  const sel=$('#histCat'); sel.value=S.histCat; sel.onchange=()=>{S.histCat=sel.value; renderHistory();};
  const th=$('#tab-history');
  th.querySelectorAll('[data-hv]').forEach(b=>b.onclick=()=>{ S.histView=b.dataset.hv; renderHistory(); });
  th.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{ S.calMode=b.dataset.cm; renderHistory(); });
  th.querySelectorAll('.cal .d[data-date]').forEach(c=>c.onclick=()=>{ S.selDay=c.dataset.date; renderHistory(); });
  bindTips($('#tab-history'));
}
function dayBlock(d, list, signed){
  list = list.slice().sort((a,b)=>(b.cr||0)-(a.cr||0));
  const dt = list.reduce((s,e)=>s+signed(e),0);
  return `<div class="day"><div class="dh"><span>${dayLabel(d)}</span><span class="num">${sgd(dt)}</span></div><div class="list">${list.map(entRow).join('')}</div></div>`;
}
function calendarView(es, days, signed, cat=S.histCat){
  const ym=S.ym, n=dim(ym), [y,m]=ym.split('-').map(Number);
  const excl = cat==='all' && S.calMode!=='all';        // leave out monthly bills so they don't swamp the shading
  const val = {};
  for(const e of es){ if(excl && FIXED.has(e.cat)) continue; val[e.date]=(val[e.date]||0)+signed(e); }
  const vals = Object.values(val); const mx = Math.max(1,...vals);
  const today = todayStr();
  const lead = (new Date(y,m-1,1).getDay()+6)%7;                // weeks start on Monday
  if(!S.selDay || !S.selDay.startsWith(ym)) S.selDay = ymOf(today)===ym ? today : null;
  let h = `<div class="card">`;
  if(cat==='all') h += `<div class="chips" style="margin-bottom:10px"><button class="chip ${excl?'on':''}" data-cm="living">Daily living</button><button class="chip ${excl?'':'on'}" data-cm="all">Everything (incl. ${FIXED_TXT})</button></div>`;
  h += `<div class="cal">` + ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<lead;i++) h += `<div></div>`;
  let weekTot=0; const weeks=[];
  for(let d=1; d<=n; d++){
    const date = ym+'-'+pad(d), v = val[date]||0, has = !!days[date];
    const pct = v>0 ? Math.round(12 + 68*v/mx) : 0;
    const dark = pct>=48;
    const style = v>0 ? `background:color-mix(in srgb, var(--series-1) ${pct}%, var(--surface));${dark?'color:#fff;':''}` : '';
    const cls = ['d', date===today?'today':'', date===S.selDay?'sel':'', date>today?'future':''].join(' ');
    const amt = v ? (Math.abs(v)>=1000 ? (v/1000).toFixed(1)+'k' : Math.abs(v)>=100 ? Math.round(v) : v.toFixed(v%1?1:0)) : (has?'0':'');
    h += `<div class="${cls}" data-date="${date}" style="${style}" data-tip="${esc(dayLabel(date))}: ${sgd(v)}${has?' · '+days[date].length+' entr'+(days[date].length===1?'y':'ies'):''}"><span class="dn">${d}</span><span class="da num">${amt}</span></div>`;
    weekTot += v;
    if((lead+d)%7===0 || d===n){ weeks.push(weekTot); weekTot=0; }
  }
  h += `</div>`;
  // legend + month facts
  const counted = Object.keys(val).length ? vals : [];
  const elapsed = daysElapsed(ym);
  const noSpend = elapsed ? Array.from({length:elapsed},(_,i)=>ym+'-'+pad(i+1)).filter(d=>!(val[d]>0)).length : 0;
  const top = Object.entries(val).sort((a,b)=>b[1]-a[1])[0];
  const sum = counted.reduce((a,b)=>a+b,0);
  h += `<div class="calleg"><span>${sgd0(0)}</span><i style="background:linear-gradient(90deg,color-mix(in srgb,var(--series-1) 12%,var(--surface)),var(--series-1))"></i><span>${sgd0(mx)}</span><span class="muted" style="margin-left:auto">Amounts in ${curCode()}${excl?' · excl. '+FIXED_TXT:''}</span></div>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="l">Total</div><div class="v num">${sgd(sum)}</div></div>
      <div class="kpi"><div class="l">Avg per day</div><div class="v num">${sgd(elapsed?sum/elapsed:0)}</div><div class="s">over ${elapsed} days</div></div>
      <div class="kpi"><div class="l">Highest day</div><div class="v num">${top?sgd(top[1]):'–'}</div><div class="s">${top?dayLabel(top[0]):'&nbsp;'}</div></div>
      <div class="kpi"><div class="l">No-spend days</div><div class="v num">${noSpend}</div><div class="s">of ${elapsed}</div></div>
    </div>
    <div class="small muted" style="margin-top:10px">Weekly totals: ${weeks.map((w,i)=>`<span class="num" style="color:var(--text)">W${i+1} ${sgd0(w)}</span>`).join(' · ')}</div></div>`;
  // selected day detail
  if(S.selDay){
    const list = days[S.selDay]||[];
    h += list.length ? dayBlock(S.selDay, list, signed) : `<div class="day"><div class="dh"><span>${dayLabel(S.selDay)}</span><span class="num">${sgd(0)}</span></div><div class="list"><div class="empty">No expenses on this day.</div></div></div>`;
    h += `<div class="btns" style="margin-bottom:12px"><button class="btn" onclick="openEntry(null,'${S.selDay}')">+ Add expense on ${dayLabel(S.selDay)}</button></div>`;
  } else h += `<div class="small muted" style="padding:0 4px">Tap a day to see its expenses.</div>`;
  return h;
}

/* ============ Calendar pop-up (tap the month name) ============ */
function calSheet(){
  S.calOpen = true;
  const es = monthEntries(S.ym);
  const signed = e => CAT[e.cat]?.income ? -e.amt : e.amt;
  const days = {}; es.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
  const st = stats(S.ym);
  let h = `<div class="row" style="justify-content:space-between;margin-bottom:10px">
      <div class="monthnav"><button id="cPrev" aria-label="Previous month">‹</button><span class="mlabel num" style="display:inline-flex">${ymLabel(S.ym)}</span><button id="cNext" aria-label="Next month">›</button></div>
      <button class="btn sm" onclick="dismissSheet()">Close</button></div>
    <div class="small muted" style="margin:-4px 0 10px">Spent <b class="num" style="color:var(--text)">${sgd(st.total)}</b>${st.salary?` of ${sgd0(st.salary)} salary · left <b class="num ${st.saved<0?'neg':'pos'}">${sgd(st.saved)}</b>`:''}</div>`;
  h += calendarView(es, days, signed, 'all');
  openSheet(h);
  const sh = $('#sheet');
  $('#cPrev').onclick=()=>{ S.ym=addMonths(S.ym,-1); render(); calSheet(); };
  $('#cNext').onclick=()=>{ S.ym=addMonths(S.ym,1); render(); calSheet(); };
  sh.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{ S.calMode=b.dataset.cm; calSheet(); if(S.tab==='history') renderHistory(); });
  sh.querySelectorAll('.cal .d[data-date]').forEach(c=>c.onclick=()=>{ S.selDay=c.dataset.date; calSheet(); });
  // calendarView's cards sit inside the sheet: drop their outer card chrome
  sh.querySelectorAll(':scope > .card').forEach(c=>{ c.style.border='0'; c.style.boxShadow='none'; c.style.padding='0'; });
}

/* ============ ANALYSIS ============ */
function renderAnalysis(){
  const st = stats(S.ym);
  const prev = stats(addMonths(S.ym,-1));
  let h = `<div class="card"><h2>${ymLabel(S.ym)} summary</h2><div class="kpis">
    <div class="kpi"><div class="l">Salary</div><div class="v num">${sgd0(st.salary)}</div></div>
    <div class="kpi"><div class="l">Total spent</div><div class="v num">${sgd(st.total)}</div><div class="s">${deltaTxt(st.total,prev.total)}</div></div>
    <div class="kpi"><div class="l">Saved</div><div class="v num ${st.saved<0?'neg':'pos'}">${sgd(st.saved)}</div><div class="s">${st.salary?Math.round(st.saved/st.salary*100)+'% savings rate':'&nbsp;'}</div></div>
    <div class="kpi"><div class="l">Sent home</div><div class="v num">${inr(st.inrHome)}</div><div class="s">${sgd(st.by.home)}</div></div>
  </div></div>`;

  // insights
  h += `<div class="card"><h2>Insights</h2>${insights(st,prev).map(t=>`<div class="insight">${t}</div>`).join('') || '<div class="muted">Add some expenses to see insights.</div>'}</div>`;

  // by category (horizontal bars, single hue)
  const rows = EXP_CATS.map(k=>({k, v: st.net[k.id]})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  const max = Math.max(1,...rows.map(r=>r.v));
  h += `<div class="card"><h2>Spending by category</h2>`;
  h += rows.length ? rows.map(r=>`<div class="hbar" data-tip="${esc(r.k.name)}: ${sgd(r.v)} (${Math.round(r.v/st.total*100)}% of spend)"><div>${r.k.icon} ${r.k.name}</div><div class="track"><i style="width:${r.v/max*100}%"></i></div><div class="num">${sgd0(r.v)}</div></div>`).join('') : '<div class="muted">No spending yet.</div>';
  h += `</div>`;

  // daily chart
  h += `<div class="card"><h2>Daily spending</h2>
    <div class="chips" style="margin-bottom:8px"><button class="chip ${S.dailyMode==='living'?'on':''}" data-dm="living">Daily living (excl. ${FIXED_TXT})</button><button class="chip ${S.dailyMode==='all'?'on':''}" data-dm="all">Everything</button></div>
    ${dailyChart(st)}</div>`;

  // budget vs actual table
  h += `<div class="card"><h2>Budget vs actual</h2><div class="tablewrap"><table class="t"><thead><tr><th>Category</th><th>Budget</th><th>Spent</th><th>Left</th><th>Avg/day</th><th>Status</th></tr></thead><tbody>`;
  for(const k of EXP_CATS){
    const b=+st.cfg.budgets[k.id]||0, s=st.net[k.id], stt=status(s,b,k.id);
    h += `<tr><td>${k.icon} ${k.name}</td><td class="num">${b?sgd0(b):'–'}</td><td class="num">${sgd(s)}</td><td class="num ${b&&b-s<0?'neg':''}">${b?sgd(b-s):'–'}</td><td class="num">${sgd(st.days?s/st.days:0)}</td><td>${stt?`<span class="pill ${stt}">${stt==='bad'?'Over':stt==='warn'?'Near limit':'On track'}</span>`:''}</td></tr>`;
    if(k.subs) for(const p of FOOD_PARTS){
      const pb=+st.cfg.budgets['food:'+p.id]||0, ps=p.subs.reduce((a,x)=>a+(st.sub[x]||0),0), pst=status(ps,pb,'food');
      h += `<tr><td>&nbsp;&nbsp;&nbsp;${p.icon} ${p.name}</td><td class="num">${pb?sgd0(pb):'–'}</td><td class="num">${sgd(ps)}</td><td class="num ${pb&&pb-ps<0?'neg':''}">${pb?sgd(pb-ps):'–'}</td><td class="num">${sgd(st.days?ps/st.days:0)}</td><td>${pst?`<span class="pill ${pst}">${pst==='bad'?'Over':pst==='warn'?'Near limit':'On track'}</span>`:''}</td></tr>`;
      if(p.subs.length>1) for(const x of p.subs){ const sb=CAT.food.subs.find(q=>q.id===x); h += `<tr class="muted"><td>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${sb.name}</td><td></td><td class="num">${sgd(st.sub[x])}</td><td></td><td class="num">${sgd(st.days?st.sub[x]/st.days:0)}</td><td></td></tr>`; }
    }
  }
  h += `<tr><td><b>Total</b></td><td class="num"><b>${sgd0(st.budgetTotal)}</b></td><td class="num"><b>${sgd(st.total)}</b></td><td class="num"><b>${st.budgetTotal?sgd(st.budgetTotal-st.total):'–'}</b></td><td class="num"><b>${sgd(st.avg)}</b></td><td></td></tr>`;
  h += `</tbody></table></div><div class="small muted" style="margin-top:6px">Spending is shown after refunds (${sgd(st.refund)} received${Object.keys(st.refundFor).length?': '+Object.entries(st.refundFor).map(([f,x])=>CAT[f].name+' '+sgd(x)).join(', '):''}).</div></div>`;

  // trend
  h += `<div class="card"><h2>Last 6 months — spent vs saved</h2>${trendChart()}</div>`;
  $('#tab-analysis').innerHTML = h;
  document.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{S.dailyMode=b.dataset.dm; renderAnalysis();});
  bindTips($('#tab-analysis'));
}
function deltaTxt(a,b){ if(!b) return '&nbsp;'; const d=(a-b)/b*100; return (d>=0?'▲ ':'▼ ')+Math.abs(Math.round(d))+'% vs last month'; }
function insights(st,prev){
  const out=[];
  if(!st.es.length) return out;
  const top = EXP_CATS.map(k=>({k,v:st.net[k.id]})).filter(x=>!FIXED.has(x.k.id)).sort((a,b)=>b.v-a.v)[0];
  if(top && top.v>0) out.push(`Biggest day-to-day category: <b>${top.k.icon} ${top.k.name}</b> at ${sgd(top.v)} (${sgd(st.days?top.v/st.days:0)}/day).`);
  const foodTop = CAT.food.subs.map(s=>({s,v:st.sub[s.id]})).sort((a,b)=>b.v-a.v)[0];
  if(foodTop.v>0) out.push(`Within food, <b>${foodTop.s.name}</b> costs the most: ${sgd(foodTop.v)} this month.`);
  const over = EXP_CATS.filter(k=>{const b=+st.cfg.budgets[k.id]||0; return b && st.net[k.id]>b;});
  if(over.length) out.push(`<span class="pill bad">Over budget</span> ${over.map(k=>k.name).join(', ')}.`);
  const near = EXP_CATS.filter(k=>status(st.net[k.id],+st.cfg.budgets[k.id]||0,k.id)==='warn');
  if(near.length) out.push(`<span class="pill warn">Near limit</span> ${near.map(k=>k.name).join(', ')} (85%+ used).`);
  if(st.left>0 && st.days>0){
    const proj = st.total + st.avgLiving*(st.left-1);
    out.push(`At your current daily-living pace, you'll spend about <b>${sgd0(proj)}</b> this month${st.salary?` and save about <b class="${st.salary-proj<0?'neg':'pos'}">${sgd0(st.salary-proj)}</b>`:''}.`);
  }
  if(prev.total>0 && prev.days){
    const d = st.avgLiving - prev.avgLiving;
    if(Math.abs(d)>=0.5) out.push(`Daily living average is <b>${sgd(Math.abs(d))} ${d>0?'higher':'lower'}</b> than last month (${sgd(prev.avgLiving)}/day).`);
  }
  return out;
}
function bindTips(root){
  root.querySelectorAll('[data-tip]').forEach(el=>{
    const f=ev=>tip(ev,el.dataset.tip);
    el.addEventListener('mousemove',f); el.addEventListener('mouseleave',()=>tip(null,null));
    el.addEventListener('touchstart',f,{passive:true});
  });
}
function chartW(){ const w=(document.querySelector('main')?.clientWidth||400)-62; return Math.max(300,Math.min(700,w)); }
function ticks(mx){ const lead=Math.round(mx/Math.pow(10,Math.floor(Math.log10(mx)))); return lead===2?4:5; }
function niceMax(v){ if(v<=0) return 10; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function dailyChart(st){
  const src = S.dailyMode==='living'? st.dailyLiving : st.daily;
  const n = st.dim, W=chartW(), H=200, L=38, R=8, T=10, B=22;
  const vals = Array.from({length:n},(_,i)=>src[S.ym+'-'+pad(i+1)]||0);
  const mx = niceMax(Math.max(...vals,1));
  const cw = (W-L-R)/n, bw = Math.max(2, cw-2);
  const y = v => T + (H-T-B)*(1-Math.max(0,v)/mx);
  const avg = S.dailyMode==='living'? st.avgLiving : st.avg;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spending bar chart">`;
  const tk=ticks(mx); for(let i=0;i<=tk;i++){ const v=mx*i/tk, yy=y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${v>=1000?(v/1000)+'k':Math.round(v)}</text>`; }
  vals.forEach((v,i)=>{
    const x=L+i*cw+1, yy=y(v), hh=(H-B)-yy;
    const date = S.ym+'-'+pad(i+1);
    const rr=Math.min(4,hh,bw/2);
    if(v>0) s+=`<path d="M${x},${H-B} V${yy+rr} q0,-${rr} ${rr},-${rr} H${x+bw-rr} q${rr},0 ${rr},${rr} V${H-B}Z" fill="var(--series-1)"/>`;
    s+=`<rect x="${L+i*cw}" y="${T}" width="${cw}" height="${H-T-B}" fill="transparent" data-tip="${esc(dayLabel(date))}: ${sgd(v)}"/>`;
    if((i+1)%5===0||i===0) s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${i+1}</text>`;
  });
  if(avg>0){ const ya=y(avg); s+=`<line x1="${L}" x2="${W-R}" y1="${ya}" y2="${ya}" stroke="var(--text-2)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-R}" y="${ya-4}" text-anchor="end" style="fill:var(--text-2)">avg ${sgd(avg)}</text>`; }
  s += `<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--muted)"/></svg>`;
  return s;
}
function trendChart(){
  const months = Array.from({length:6},(_,i)=>addMonths(S.ym,i-5));
  const data = months.map(m=>{ const s=stats(m); return {m, spent:s.total, saved: s.salary? s.saved : 0, salary:s.salary, home:s.inrHome}; });
  const W=chartW(),H=210,L=44,R=8,T=10,B=24;
  const mx = niceMax(Math.max(1,...data.map(d=>Math.max(d.spent,d.saved))));
  const mn = Math.min(0,...data.map(d=>d.saved)); const lo = mn<0? -niceMax(-mn):0;
  const y = v => T + (H-T-B)*(mx-v)/(mx-lo);
  const gw=(W-L-R)/6, bw=Math.min(28,(gw-14)/2);
  let s=`<div class="legend"><span style="--c:var(--series-1)">Spent</span><span style="--c:var(--series-3)">Saved</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spent vs saved per month">`;
  for(let i=0;i<=4;i++){ const v=lo+(mx-lo)*i/4, yy=y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${Math.abs(v)>=1000?(Math.round(v/100)/10)+'k':Math.round(v)}</text>`; }
  const bar=(x,v,col)=>{ if(!v) return ''; const y0=y(0), y1=y(v); const top=Math.min(y0,y1), h=Math.abs(y1-y0); const rr=Math.min(4,h);
    return v>0 ? `<path d="M${x},${y0} V${top+rr} q0,-${rr} ${rr},-${rr} H${x+bw-rr} q${rr},0 ${rr},${rr} V${y0}Z" fill="${col}"/>` : `<path d="M${x},${y0} V${top+h-rr} q0,${rr} ${rr},${rr} H${x+bw-rr} q${rr},0 ${rr},-${rr} V${y0}Z" fill="${col}"/>`; };
  data.forEach((d,i)=>{
    const gx=L+i*gw+(gw-2*bw-2)/2;
    s+=bar(gx,d.spent,'var(--series-1)')+bar(gx+bw+2,d.saved,'var(--series-3)');
    s+=`<rect x="${L+i*gw}" y="${T}" width="${gw}" height="${H-T-B}" fill="transparent" data-tip="<b>${ymLabel(d.m,true)}</b><br>Spent ${sgd(d.spent)}<br>Saved ${d.salary?sgd(d.saved):'– (no salary set)'}"/>`;
    s+=`<text x="${L+i*gw+gw/2}" y="${H-6}" text-anchor="middle" ${d.m===S.ym?'style="fill:var(--text);font-weight:600"':''}>${ymLabel(d.m,true).split(' ')[0]}</text>`;
  });
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/></svg>`;
  s+=`<div class="tablewrap" style="margin-top:8px"><table class="t"><thead><tr><th>Month</th><th>Salary</th><th>Spent</th><th>Saved</th><th>Rate</th><th>Sent home</th></tr></thead><tbody>`+
    data.slice().reverse().map(d=>`<tr><td>${ymLabel(d.m,true)}</td><td class="num">${d.salary?sgd0(d.salary):'–'}</td><td class="num">${sgd0(d.spent)}</td><td class="num ${d.saved<0?'neg':''}">${d.salary?sgd0(d.saved):'–'}</td><td class="num">${d.salary?Math.round(d.saved/d.salary*100)+'%':'–'}</td><td class="num">${d.home?inr(d.home):'–'}</td></tr>`).join('')+`</tbody></table></div>`;
  return s;
}

/* ============ BUDGET ============ */
function renderBudget(){
  const c = cfg(S.ym), st = stats(S.ym), B = c.budgets||{};
  const spentOf = id => st.net[id];
  const partSpent = p => p.subs.reduce((a,k)=>a+(st.sub[k]||0),0);
  const val = k => B[k] ? B[k] : '';
  const inp = (key,extra='') => `<input class="in num bin" type="number" inputmode="decimal" min="0" step="1" data-b="${key}" id="b-${key.replace(':','-')}" value="${val(key)}" placeholder="0" ${extra}>`;
  const prevCfg = cfg(addMonths(S.ym,-1));
  let h = `<div class="card"><h2>Monthly budget — ${ymLabel(S.ym)}</h2>
    <div class="small muted">${c.inherited?`Showing the budget from ${ymLabel(c.inherited)}. Save to set it for ${ymLabel(S.ym,true)}.`:`Later months reuse this budget until you change it.`}</div>
    <label class="f" for="bSalary">Monthly salary (${curCode()})</label>
    <input class="in num" type="number" inputmode="decimal" min="0" id="bSalary" value="${c.salary||''}" placeholder="0">
  </div>`;

  h += `<div class="card"><h2>Budget breakdown</h2><div class="small muted" style="margin-bottom:4px">Amount per category for the month. The bar shows its share of your salary.</div>`;
  for(const k of EXP_CATS){
    h += `<div class="brow"><div class="ic">${k.icon}</div><div class="bmid"><div class="nm">${k.name}</div><div class="meta">Spent so far ${sgd(spentOf(k.id))}</div><div class="share"><i data-share="${k.id}"></i></div></div>${inp(k.id)}</div>`;
    if(k.id==='food'){
      h += `<div class="bparts"><div class="small muted" style="padding:2px 0 4px">Split the food budget (optional) — the Food total becomes the sum of these three.</div>`;
      for(const p of FOOD_PARTS) h += `<div class="brow part"><div class="ic sm">${p.icon}</div><div class="bmid"><div class="nm">${p.name}</div><div class="meta">${p.hint} · spent ${sgd(partSpent(p))}</div></div>${inp('food:'+p.id)}</div>`;
      h += `</div>`;
    }
  }
  h += `</div>`;

  h += `<div class="card" id="bSummary"></div>
    <div class="btns" style="margin-bottom:14px"><button class="btn primary" id="bSaveBtn">Save budget for ${ymLabel(S.ym,true)}</button>
    ${prevCfg.salary||Object.keys(prevCfg.budgets||{}).length?`<button class="btn" id="bCopyPrev">Copy ${ymLabel(addMonths(S.ym,-1),true)} budget</button>`:''}</div>`;
  $('#tab-budget').innerHTML = h;

  const root = $('#tab-budget');
  const read = () => {
    const v = {}; root.querySelectorAll('[data-b]').forEach(i=>v[i.dataset.b]=+i.value||0);
    const parts = FOOD_PARTS.reduce((a,p)=>a+(v['food:'+p.id]||0),0);
    const fi = $('#b-food');
    if(parts>0){ v.food = parts; fi.value = r2(parts); fi.readOnly = true; fi.title='Sum of the food parts below'; }
    else { fi.readOnly = false; fi.title=''; }
    return {v, salary:+$('#bSalary').value||0};
  };
  const refresh = () => {
    const {v, salary} = read();
    const total = EXP_CATS.reduce((a,k)=>a+(v[k.id]||0),0);
    const saving = salary - total;
    const base = Math.max(salary,total,1);
    root.querySelectorAll('[data-share]').forEach(el=>{ const x=v[el.dataset.share]||0; el.style.width=(x/base*100)+'%'; el.parentElement.title = salary? Math.round(x/salary*100)+'% of salary' : ''; });
    const rows = EXP_CATS.map(k=>({k,x:v[k.id]||0})).filter(r=>r.x>0).sort((a,b)=>b.x-a.x);
    let sh = `<h2>Summary</h2><div class="kpis">
      <div class="kpi"><div class="l">Salary</div><div class="v num">${sgd0(salary)}</div></div>
      <div class="kpi"><div class="l">Total budget</div><div class="v num">${sgd0(total)}</div><div class="s">${salary?Math.round(total/salary*100)+'% of salary':'&nbsp;'}</div></div>
      <div class="kpi"><div class="l">Planned saving</div><div class="v num ${saving<0?'neg':'pos'}">${sgd0(saving)}</div><div class="s">${salary?Math.round(saving/salary*100)+'% of salary':'&nbsp;'}</div></div>
      <div class="kpi"><div class="l">Per day (daily living)</div><div class="v num">${sgd(EXP_CATS.filter(k=>!FIXED.has(k.id)).reduce((a,k)=>a+(v[k.id]||0),0)/dim(S.ym))}</div><div class="s">excl. ${FIXED_TXT}</div></div>
    </div>`;
    if(saving<0) sh += `<div class="insight" style="border:0"><span class="pill bad">Over salary</span> Your budget is ${sgd0(-saving)} more than your salary.</div>`;
    if(rows.length){
      const mx = Math.max(...rows.map(r=>r.x), Math.max(saving,0), 1);
      sh += `<div style="margin-top:12px">` + rows.map(r=>`<div class="hbar"><div>${r.k.icon} ${r.k.name}</div><div class="track"><i style="width:${r.x/mx*100}%"></i></div><div class="num">${sgd0(r.x)}${salary?` <span class="muted">${Math.round(r.x/salary*100)}%</span>`:''}</div></div>`).join('')
        + (saving>0?`<div class="hbar"><div>💰 Planned saving</div><div class="track"><i style="width:${saving/mx*100}%;background:var(--series-3)"></i></div><div class="num">${sgd0(saving)}${salary?` <span class="muted">${Math.round(saving/salary*100)}%</span>`:''}</div></div>`:'')
        + `</div>`;
    }
    $('#bSummary').innerHTML = sh;
  };
  root.querySelectorAll('input').forEach(i=>i.oninput=refresh); refresh();
  $('#bSaveBtn').onclick=()=>{
    const {v, salary} = read(); const budgets={};
    for(const [k,x] of Object.entries(v)) if(x>0) budgets[k]=r2(x);
    DB.months[S.ym] = {salary:r2(salary), budgets, upd:Date.now()};
    save(); toast('Budget saved for '+ymLabel(S.ym)); renderBudget();
  };
  if($('#bCopyPrev')) $('#bCopyPrev').onclick=()=>{
    $('#bSalary').value = prevCfg.salary||'';
    root.querySelectorAll('[data-b]').forEach(i=>i.value = (prevCfg.budgets||{})[i.dataset.b]||'');
    refresh(); toast('Copied — tap Save to keep it');
  };
}

/* ============ SYNC & DATA ============ */
function renderSettings(){
  let h='';
  const fsa = 'showOpenFilePicker' in window;
  h += `<div class="card"><h2>Sync with Google Drive / OneDrive</h2>
    <div class="small" style="margin-bottom:10px">Your data lives on this device. To use it on your Mac and phone, keep one sync file (<b>${syncFileName()}</b>) in your Google Drive or OneDrive. Syncing merges both sides — nothing is overwritten or lost.</div>

  const ph = {travel:'e.g. MRT, Grab', temple:'e.g. archanai, donation', home:'e.g. via Wise', misc:'e.g. phone top-up, gift, haircut', ac:'e.g. Sep bill', food: E.sub==='delivery'?'e.g. GrabFood, foodpanda':E.sub==='groceries'?'e.g. NTUC, Mustafa':'e.g. where / what'}[E.cat] || 'e.g. where / what';

  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ readSheet(); E.sub=b.dataset.s; drawSheet(); });
  document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{ readSheet(); E.refFor=b.dataset.rf; drawSheet(); });
  if(E.cat==='home' && $('#eInr')){

async function loadRate(){
  const d=$('#eDate').value, note=$('#rateNote'), re=$('#eRate');
  if(note) note.textContent=`Fetching ${curCode()}→${homeCode()} rate for ${d}…`;

         if($('#eAmt').value) $('#eAmt').oninput(); else if($('#eInr').value) $('#eInr').oninput(); }
  else { if(DB.meta.lastRate && !re.value) re.value=DB.meta.lastRate.toFixed(4); note.textContent='Could not fetch a rate (offline?). Enter the rate your transfer used.'; }
}
function readSheet(){
  if(!$('#eDate')) return;
  E.date=$('#eDate').value||todayStr(); E.amt=$('#eAmt').value; E.note=$('#eNote').value;
  if($('#eInr')){ E.inr=$('#eInr').value; E.rate=$('#eRate').value; }

function commitEntry(more){
  readSheet();
  const amt = r2(parseFloat(E.amt));
  if(!(amt>0)){ toast('Enter an amount'); $('#eAmt').focus(); return; }
  if(CAT[E.cat].reason && !(E.note||'').trim()){ toast('Add a reason for this miscellaneous expense'); $('#eNote').focus(); return; }
  const now=Date.now();
  const rec = {id:E.id||uid(), date:E.date, cat:E.cat, amt, note:(E.note||'').trim(), upd:now, cr:E.cr||now};
  if(E.cat==='food') rec.sub=E.sub||'lunch';
  if(E.cat==='refund') rec.refFor=E.refFor||'medical';
  rec.cur = curCode();
  if(E.cat==='home'){ if(curCode()===homeCode()){ rec.rate=1; rec.inr=amt; } else { rec.rate=+E.rate||null; rec.inr= +E.inr || (rec.rate? Math.round(amt*rec.rate):null); } rec.homeCur=homeCode(); }
  DB.entries[rec.id]=rec; S.lastCat=E.cat;
  save();
  const m=ymOf(rec.date); if(m!==S.ym) S.ym=m;
  toast(`Saved ${sgd(amt)} · ${CAT[rec.cat].name}`);

}

/* ============ Sync ============ */
const idb = (()=>{ let dbp=null; const open=()=>dbp||(dbp=new Promise((res,rej)=>{ const r=indexedDB.open('dailyExpenseTracker',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{ const t=db.transaction('kv',mode); const st=t.objectStore('kv'); const q=fn(st); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); }));
  return { get:k=>tx('readonly',s=>s.get(k)).catch(()=>null), set:(k,v)=>tx('readwrite',s=>s.put(v,k)).catch(()=>null), del:k=>tx('readwrite',s=>s.delete(k)).catch(()=>null) };
})();
let SH = null, syncState='none', syncTimer=null, syncing=false;
function exportObj(){ return {app:'daily-expense-tracker', version:1, profileName:curProfile().name, currency:curCode(), exported:new Date().toISOString(), entries:DB.entries, months:DB.months, rates:DB.rates, settings:DB.settings}; }
function merge(r){
  if(!r || typeof r!=='object' || !r.entries) throw new Error('Not an expense sync file');
  if(r.profileName && r.profileName.trim().toLowerCase()!==curProfile().name.trim().toLowerCase())
    throw new Error(`this file belongs to "${r.profileName}". Switch to that profile first (or rename this profile to "${r.profileName}")`);
  if(r.currency && r.currency!==curCode())
    throw new Error(`this file is in ${r.currency} but this profile uses ${curCode()}. Set the profile's currency to ${r.currency} first`);
  let n=0;
  for(const [id,e] of Object.entries(r.entries)){ const l=DB.entries[id]; if(!l || (e.upd||0)>(l.upd||0)){ DB.entries[id]=e; n++; } }
  for(const [m,c] of Object.entries(r.months||{})){ const l=DB.months[m]; if(!l || (c.upd||0)>(l.upd||0)){ DB.months[m]=c; n++; } }
  for(const [d,v] of Object.entries(r.rates||{})) if(!DB.rates[d]) DB.rates[d]=v;
  if(r.settings && (r.settings.upd||0)>(DB.settings.upd||0)){ DB.settings=r.settings; applyTheme(); }
  return n;
}
function slug(n){ return (n||'me').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'me'; }
function syncFileName(){ return PROFILES.list.length>1 || curProfile().name!=='Me' ? `expenses-sync-${slug(curProfile().name)}.json` : 'expenses-sync.json'; }
async function initSync(){
  if(!('showOpenFilePicker' in window)) { syncState='manual'; renderSyncDot(); return; }
  SH = await idb.get(syncKeyFor(PROFILES.current));
  if(!SH){ syncState='none'; renderSyncDot(); return; }
  try{ const p = await SH.queryPermission({mode:'readwrite'}); if(p==='granted'){ syncState='ok'; await syncNow(false); } else syncState='need'; }catch(e){ syncState='need'; }
  renderSyncDot();
}
async function linkSync(create){
  try{
    // mode:'readwrite' asks for edit access in the same step as picking the file
    const opts={types:[{description:'Expense sync file',accept:{'application/json':['.json']}}], mode:'readwrite', id:'expense-sync'};
    if(create) SH = await window.showSaveFilePicker({...opts, suggestedName:syncFileName()});
    else [SH] = await window.showOpenFilePicker(opts);
    await idb.set(syncKeyFor(PROFILES.current),SH);           // remember the file even if access is still pending
    let perm = 'prompt';
    try{ perm = await SH.queryPermission({mode:'readwrite'}); }catch(e){}
    if(perm!=='granted'){ try{ perm = await SH.requestPermission({mode:'readwrite'}); }catch(e){} }
    if(perm!=='granted'){
      syncState='need'; render();
      toast('File linked. Tap "Allow access" so the app can save to it.');
      return;
    }
    syncState='ok';
    await syncNow(true);
  }catch(e){ if(e.name!=='AbortError') toast('Sync error: '+e.message); }
}
async function unlinkSync(){ await idb.del(syncKeyFor(PROFILES.current)); SH=null; syncState='none'; DB.meta.lastSync=null; persist(); toast('Sync file unlinked'); render(); }
async function syncNow(manual){
  if(!SH){ if(manual) toast('Link a sync file first'); return; }
  if(syncing) return; syncing=true;
  try{
    if(syncState!=='ok'){ const p=await SH.requestPermission({mode:'readwrite'}); if(p!=='granted'){ syncState='need'; if(manual) toast('Edit access was not given. Click the icon at the left of the address bar → Site settings → File editing → Allow, then try again.'); return; } syncState='ok'; }
    const f = await SH.getFile(); const txt = (await f.text()).trim();
    let n=0; if(txt){ n = merge(JSON.parse(txt)); }
    const w = await SH.createWritable(); await w.write(JSON.stringify(exportObj())); await w.close();
    DB.meta.lastSync=Date.now(); DB.meta.syncName=SH.name; persist();
    if(manual || n) toast(n? `Synced · ${n} update${n===1?'':'s'} from other device` : 'Synced');
    if(n || manual) render(); else renderSyncDot();
  }catch(e){ syncState = (e.name==='NotAllowedError'||e.name==='SecurityError')?'need':syncState; if(manual) toast('Sync failed: '+e.message); }
  finally{ syncing=false; renderSyncDot(); if(S.tab==='settings') renderSyncStatus(); }
}
function scheduleSync(){ if(SH && syncState==='ok'){ clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(false),1500); } renderSyncDot(); }
function renderSyncDot(){
  const d=$('#syncDot'); if(!d) return;
  d.className='syncdot '+(syncState==='ok'?'ok':syncState==='need'?'need':'');
  $('#syncBtn').title = syncState==='ok'? 'Synced '+(DB.meta.lastSync?new Date(DB.meta.lastSync).toLocaleString():'') : syncState==='need'? 'Tap to reconnect sync file' : 'Set up sync';
}
function renderSyncStatus(){
  const el=$('#syncStatus'); if(!el) return;
  const last = DB.meta.lastSync? new Date(DB.meta.lastSync).toLocaleString('en-SG') : 'never';
  el.innerHTML = syncState==='ok'? `<span class="syncdot ok"></span>Linked to <b>${esc(SH?.name||DB.meta.syncName)}</b> · last synced ${last}`
    : syncState==='need'? `<span class="syncdot need"></span>Linked to <b>${esc(SH?.name||DB.meta.syncName||'sync file')}</b>, but the app still needs permission to edit it.<div class="btns" style="margin-top:8px"><button class="btn primary" onclick="syncNow(true)">Allow access</button></div><div class="small muted" style="margin-top:6px">Chrome will ask "Let site edit files?" — choose <b>Edit files</b> (or <b>Allow on every visit</b>). No pop-up? See the permission icon at the right of the address bar.</div>`
    : syncState==='manual'? `<span class="syncdot"></span>Last merge/save: ${DB.meta.lastManual? new Date(DB.meta.lastManual).toLocaleString('en-SG'):'never'}`
    : `<span class="syncdot"></span>Not linked. On your Mac, use <b>Link sync file</b> and choose (or create) ${syncFileName()} inside your Google Drive / OneDrive folder.`;
}
$('#syncBtn').onclick=()=>{ if(syncState==='ok'||syncState==='need') syncNow(true); else go('settings'); };
$('#fileIn').onchange=async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{ const n=merge(JSON.parse(await f.text())); DB.meta.lastManual=Date.now(); save(); toast(`Merged · ${n} update${n===1?'':'s'}`); render(); }
  catch(e){ toast('Could not read file: '+e.message); }
};
async function exportSyncFile(){
  const blob = new Blob([JSON.stringify(exportObj())],{type:'application/json'});
  const file = new File([blob],syncFileName(),{type:'application/json'});
  DB.meta.lastManual=Date.now(); persist();
  if(navigator.canShare && navigator.canShare({files:[file]}) && matchMedia('(pointer:coarse)').matches){
    try{ await navigator.share({files:[file], title:syncFileName()}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  download(blob,syncFileName());
}
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
function exportCSV(ym){
  const es = Object.values(DB.entries).filter(e=>!e.del && (!ym||e.date.startsWith(ym))).sort((a,b)=>a.date.localeCompare(b.date));
  const q=v=>{ v=String(v??''); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; };
  const rows=[['Date','Category','Food type','Amount '+curCode(),'Amount sent home','Home currency','Rate','Note']].concat(es.map(e=>[e.date,e.cat==='refund'?'Refund ('+(CAT[e.refFor]||CAT.medical).name+')':(CAT[e.cat]?.name||e.cat),e.sub?CAT.food.subs.find(s=>s.id===e.sub)?.name:'',(CAT[e.cat]?.income?-e.amt:e.amt).toFixed(2),e.cat==='home'?(e.inr||''):'',e.cat==='home'?(e.homeCur||'INR'):'',e.cat==='home'?(e.rate||''):'',e.note||'']));
  download(new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}), `expenses-${slug(curProfile().name)}-${ym||'all'}.csv`);
}

const AV_COLORS = ['#2a78d6','#1baf7a','#eb6834','#4a3aa7','#e34948','#008300','#c98500','#d55181'];
const avatar = (p,lg) => `<span class="av${lg?' lg':''}" style="background:${AV_COLORS[(p.color||0)%AV_COLORS.length]}">${esc((p.name||'?').trim().charAt(0).toUpperCase()||'?')}</span>`;
async function hashPin(pin, salt){
  const data = new TextEncoder().encode(salt+':'+pin);
  try{ const d = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h=0; for(const c of data) h=(h*31+c)>>>0; return 'x'+h.toString(16); }
}

      <div><label class="f" for="pHome">Home currency</label><select class="in" id="pHome">${curOptions(p?.homeCur||(p?'INR':homeCode()))}</select></div>
    </div>
    <div class="small muted" style="margin-top:6px">Home currency is used for <b>Money sent home</b>, with that day's exchange rate.</div>
    ${p&&Object.keys(p.id===PROFILES.current?DB.entries:{}).length?'<div class="small muted" style="margin-top:6px">Changing the currency doesn’t convert amounts you’ve already entered.</div>':''}
    <div class="btns" style="margin-top:14px"><button class="btn primary" id="pSave">${p?'Save':'Create profile'}</button>
      ${p&&p.pin?'<button class="btn" id="pNoPin">Remove PIN</button>':''}
      ${p&&PROFILES.list.length>1?`<button class="btn danger" id="pDel">Delete profile</button>`:''}</div>`;
  openSheet(h);
  $('#pBack').onclick=profileSheet;
  if(!p) setTimeout(()=>$('#pName').focus(),50);
  $('#pSave').onclick=async()=>{
    const name=$('#pName').value.trim(), pin=$('#pPin').value.trim();
    if(!name){ toast('Enter a name'); $('#pName').focus(); return; }
    if(PROFILES.list.some(x=>x.id!==id && x.name.toLowerCase()===name.toLowerCase())){ toast('Another profile already has that name'); return; }
    if(pin && !/^\d{4}$/.test(pin)){ toast('The PIN must be 4 digits'); $('#pPin').focus(); return; }
    const cur=$('#pCur').value, home=$('#pHome').value;
    let target = p;
    if(!target){ target={id:'p'+uid(), name, color:PROFILES.list.length}; PROFILES.list.push(target); }
    target.name=name; target.currency=cur; target.homeCur=home;
    if(pin){ target.salt=uid(); target.pin=await hashPin(pin,target.salt); }
    saveProfiles(); renderProfileBtn();
    if(!p){ toast(`Profile "${name}" created`); switchProfile(target.id, true); }
    else { toast('Profile saved'); profileSheet(); if(id===PROFILES.current) render(); }
  };
  if($('#pNoPin')) $('#pNoPin').onclick=()=>{ delete p.pin; delete p.salt; saveProfiles(); toast('PIN removed'); profileSheet(); };
  if($('#pDel')) confirmBtn($('#pDel'),`Tap again to delete ${p.name} and all their data here`,async()=>{
    try{ localStorage.removeItem(keyFor(p.id)); }catch(e){}
    await idb.del(syncKeyFor(p.id));
    PROFILES.list = PROFILES.list.filter(x=>x.id!==p.id);
    const wasCurrent = PROFILES.current===p.id;
    saveProfiles(); toast(`Deleted ${p.name}`);
    if(wasCurrent) switchProfile(PROFILES.list[0].id, true); else profileSheet();
  });
}
async function switchProfile(id, skipPin){
  const p = PROFILES.list.find(x=>x.id===id); if(!p) return;
  if(id===PROFILES.current && !skipPin){
    if(document.body.classList.contains('locked') && p.pin){ if(await askPin(p)){ document.body.classList.remove('locked'); dismissSheet(); } return; }
    dismissSheet(); return; }
  if(p.pin && !skipPin){ const ok = await askPin(p); if(!ok) return; }
  clearTimeout(syncTimer);
  document.body.classList.remove('locked');
  PROFILES.current = id; saveProfiles();
  KEY = keyFor(id); DB = loadDB(); applyTheme();
  SH = null; syncState='none';
  Object.assign(S, {ym:curYM(), tab:'home', histCat:'all', selDay:null, lastCat:null});
  dismissSheet(); renderProfileBtn(); render(); window.scrollTo(0,0);
  toast(`Switched to ${p.name}`);
  initSync();
}
/* Full-screen PIN pad. Resolves true when the right PIN is entered, false if cancelled. */
function askPin(p, blocking){
  return new Promise(resolve=>{
    const el = document.createElement('div'); el.className='lock';
    let val='';
    const draw = (msg)=>{ el.innerHTML = `<div class="box">${avatar(p,true).replace('class="av lg"','class="av lg" style="margin:0 auto;width:56px;height:56px;font-size:24px;background:'+AV_COLORS[(p.color||0)%AV_COLORS.length]+'"')}
      <h3 style="margin:12px 0 2px">${esc(p.name)}</h3><div class="small ${msg?'neg':'muted'}">${msg||'Enter PIN'}</div>
      <div class="pindots">${[0,1,2,3].map(i=>`<i class="${i<val.length?'on':''}"></i>`).join('')}</div>
      <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="x" style="font-size:14px">${blocking?(PROFILES.list.length>1?'Switch':''):'Cancel'}</button><button data-k="0">0</button><button data-k="b" aria-label="Delete">⌫</button></div></div>`;
      el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k)); };
    const finish = ok => { document.removeEventListener('keydown', kd); el.remove(); resolve(ok); };
    const key = async k => {
      if(k==='x'){ if(!blocking) finish(false); else if(PROFILES.list.length>1){ finish(false); } return; }
      if(k==='b'){ val=val.slice(0,-1); draw(); return; }
      if(val.length>=4) return;
      val+=k; draw();
      if(val.length===4){ const h = await hashPin(val,p.salt); if(h===p.pin) finish(true); else { val=''; draw('Wrong PIN — try again'); } }
    };
    const kd = ev => { if(/^\d$/.test(ev.key)) key(ev.key); else if(ev.key==='Backspace') key('b'); else if(ev.key==='Escape' && !blocking) key('x'); };
    document.addEventListener('keydown', kd);
    draw(); document.body.appendChild(el);
  });
}
/* On start: if the current profile has a PIN, lock until it's entered (or the person switches). */
async function startupLock(){
  const p = curProfile(); if(!p.pin) return true;
  document.body.classList.add('locked');
  const ok = await askPin(p, true);
  if(ok){ document.body.classList.remove('locked'); return true; }
  profileSheet(); return false;
}

/* ============ Two-tap confirm (no browser dialogs) ============ */
function confirmBtn(btn,msg,fn){
  const orig=btn.textContent;
  btn.onclick=()=>{
    if(btn.dataset.armed){ fn(); return; }
    btn.dataset.armed='1'; btn.textContent=msg; btn.classList.add('primary');
    setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent=orig; btn.classList.remove('primary'); } },4000);
  };
}

/* ============ Sample data (for trying the app) ============ */
function hasSample(){ return Object.values(DB.entries).some(e=>e.sample&&!e.del) || Object.values(DB.months).some(m=>m.sample); }
function loadSample(){
  const ym=curYM(), pm=addMonths(ym,-1), today=new Date().getDate(), now=Date.now();
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const add=(date,cat,amt,extra={})=>{ const id='sample-'+uid(); DB.entries[id]={id,date,cat,amt:r2(amt),upd:now,cr:now,sample:true,...extra}; };
  const month=(m,days)=>{
    for(let i=1;i<=days;i++){ const d=m+'-'+pad(i);
      add(d,'food',3+rnd()*2.5,{sub:'breakfast',note:'Kopi & kaya toast'});
      add(d,'food',6+rnd()*5,{sub:'lunch',note:'Hawker centre'});
      add(d,'food',7+rnd()*9,{sub:'dinner'});
      if(rnd()>.45) add(d,'food',2.2+rnd()*5,{sub:'coffee'});
      if(rnd()>.35) add(d,'travel',1.8+rnd()*6,{note:'MRT / bus'});
      if(i%7===6) add(d,'food',28+rnd()*20,{sub:'groceries',note:'NTUC'});
      if(rnd()>.8) add(d,'food',14+rnd()*12,{sub:'delivery',note:'GrabFood'});
    }
    add(m+'-01','rent',900,{note:'Room rent'});
    if(days>=5) add(m+'-05','temple',21,{note:'Archanai'});
    if(days>=6) add(m+'-06','home',600,{inr:600*65.1,rate:65.1,note:'Monthly transfer'});
    if(days>=8) add(m+'-08','laundry',14);
    if(days>=10) add(m+'-10','ac',38.6,{note:'Aircon usage'});
    if(days>=17) add(m+'-17','misc',12,{note:'Phone top-up'});
    if(days>=12) add(m+'-12','entertainment',15.5,{note:'Movie'});
    if(days>=14) add(m+'-14','medical',68,{note:'GP visit'});
    if(days>=19) add(m+'-19','shopping',46.9,{note:'Clothes'});
    if(days>=22) add(m+'-22','refund',40,{note:'Insurance claim',refFor:'medical'});
  };
  month(pm,dim(pm)); month(ym,today);
  const b={ac:45,misc:40,food:750,travel:120,temple:60,entertainment:60,medical:80,laundry:30,shopping:150,rent:900,home:1200};
  if(!DB.months[pm]) DB.months[pm]={salary:4500,budgets:b,upd:now,sample:true};
  save(); toast('Sample data loaded — remove it in Sync & data'); render();
}
function removeSample(){
  const now=Date.now();
  for(const e of Object.values(DB.entries)) if(e.sample && !e.del){ e.del=true; e.upd=now; }
  for(const [k,m] of Object.entries(DB.months)) if(m.sample) DB.months[k]={salary:0,budgets:{},upd:now,del:true};
  save();
}

/* ============ Wiring ============ */
function go(t){ S.tab=t; window.scrollTo(0,0); render(); }
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$('#fab').onclick=()=>openEntry(null);
$('#mLabel').onclick=()=>calSheet();
$('#profBtn').onclick=profileSheet;
$('#mPrev').onclick=()=>{ S.ym=addMonths(S.ym,-1); render(); };
$('#mNext').onclick=()=>{ S.ym=addMonths(S.ym,1); render(); };
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(SH&&syncState==='ok') syncNow(false); render(); } });
let _rs; window.addEventListener('resize',()=>{ clearTimeout(_rs); _rs=setTimeout(()=>{ if(S.tab==='analysis') renderAnalysis(); },200); });
window.addEventListener('storage',ev=>{ if(ev.key===KEY){ DB=loadDB(); render(); } else if(ev.key===PKEY){ PROFILES=loadProfiles(); renderProfileBtn(); } });

renderProfileBtn();
render();
initSync();
startupLock();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
